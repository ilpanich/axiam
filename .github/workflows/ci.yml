name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # libxmlsec1-dev / libxml2-dev are required by the `saml` feature
      # (→ samael → libxmlsec1), which is on by default. Without them the
      # samael build script fails ("xmlsec1-config not found").
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # F1 -- the workspace's crate graph is a design decision, so it gets a gate
  # rather than a convention. Deliberately its own job: it needs no toolchain
  # and finishes in about a second, so it reports an architectural regression
  # long before the compile jobs have finished telling you the code is fine.
  layering:
    name: Architecture Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The self-test runs FIRST and against fixtures, not the workspace. A
      # gate whose only evidence is "the repo it guards is currently clean"
      # cannot distinguish working from broken -- a check-everything script
      # with an inverted comparison passes every day until the day it matters.
      - name: Self-test (fixtures)
        run: python3 scripts/check-crate-layering.py --self-test
      - name: Dependencies point inward
        run: python3 scripts/check-crate-layering.py
      # Printed unconditionally so a failure above lands next to the table it
      # was checked against, instead of sending the reader to the source.
      - name: Layer table
        if: always()
        run: python3 scripts/check-crate-layering.py --graph

      # F5 -- UNIQUE-violation detection is a security decision (a replayed
      # assertion refused or accepted), and D-09 already said it may live in
      # exactly one place. Five call sites had their own copy anyway. This is
      # what makes the rule true rather than merely written down.
      - name: Conflict-marker gate self-test (fixtures)
        run: python3 scripts/check-conflict-markers.py --self-test
      - name: Conflict markers appear in one place only
        run: python3 scripts/check-conflict-markers.py

      # M1 -- CONTRACT.md §27's management vocabulary is derived from
      # openapi.json rather than hand-maintained, because a hand-maintained
      # table of 146 operations across eleven SDKs is wrong by the next
      # release. This gate is what makes "derived" true: it fails when the
      # committed registry drifts from the spec, and -- the half that actually
      # earns its keep -- when a new route lands under a management tag and
      # nothing claims it. Without the second check, adding a handler to
      # axiam-api-rest silently creates surface no SDK can reach, and the
      # first person to notice is a user.
      - name: Management registry gate self-test (fixtures)
        run: python3 scripts/gen-management-registry.py --self-test
      - name: §27 management registry is in sync with openapi.json
        run: python3 scripts/gen-management-registry.py --check

      # The registry gate above copies info.x-axiam-spec-digest out of the spec
      # verbatim, so it agrees with a stale digest; sdk-openapi-drift.yml would
      # catch one but needs a full server build, so it is path-filtered. That
      # left a gap a release bump fell straight through: 1.0.0-beta02 shipped
      # carrying the beta01 digest, because mass-tag.sh rewrote info.version --
      # which the digest covers -- without re-stamping. This gate needs no
      # toolchain and no build, so it can ask on every commit.
      - name: Spec digest gate self-test (fixtures)
        run: python3 scripts/check-spec-digest.py --self-test
      - name: openapi.json's spec digest matches its content
        run: python3 scripts/check-spec-digest.py

      # The advisory ignore-list has to be written twice -- cargo-deny reads
      # deny.toml, cargo-audit reads the `ignore:` input below and never looks
      # at deny.toml -- and until now "keep them in sync" was a comment and
      # nothing else. Drift is silent either way: an ID only in deny.toml
      # leaves cargo audit red for an unwritten reason, and an ID only in the
      # workflow means the rationale for suppressing it exists in no file.
      - name: Ignore-list sync gate self-test (fixtures)
        run: python3 scripts/check-audit-ignore-sync.py --self-test
      - name: Advisory ignore-lists agree
        run: python3 scripts/check-audit-ignore-sync.py

      # The configuration page reads as a complete env-var reference and is a
      # curated subset. That is a fine scope; what was not fine is that nobody
      # could tell which keys were in it, so it could drift further from the
      # server every release. A key must now be documented or carry a written
      # exemption -- the gap is arguable, but it cannot grow silently.
      - name: Config-coverage gate self-test (fixtures)
        run: python3 scripts/check-config-key-coverage.py --self-test
      - name: Every config key is documented or exempt
        run: python3 scripts/check-config-key-coverage.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # libxmlsec1-dev / libxml2-dev are required by the `saml` feature
      # (→ samael → libxmlsec1), which is on by default. Without them the
      # samael build script fails ("xmlsec1-config not found").
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev
      - run: cargo build --workspace

  build-no-saml:
    name: Build (SAML off / --no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # Install ONLY protobuf-compiler. libxmlsec1-dev / libxml2-dev are
      # deliberately NOT installed: the `saml` feature (→ samael → libxmlsec1)
      # is off here, so if SAML ever leaks back into the default-off build the
      # compile must FAIL for lack of the native lib. This guards the very
      # configuration that lets the workspace build on hosts with an
      # incompatible system libxml2 (e.g. Arch 2.15.x).
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check -p axiam-federation -p axiam-api-rest -p axiam-server --no-default-features

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # --- Rust toolchain (for cargo-audit and cargo-deny) ---
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev

      # --- cargo audit ---
      # Ignored advisories MUST stay in sync with deny.toml [advisories].ignore.
      # cargo-audit (unlike cargo-deny) reads its ignore list from this input,
      # not from deny.toml, so the same IDs are listed here with the same rationale:
      #   RUSTSEC-2023-0071 — Marvin attack (rsa); no upstream fix, PGP-encryption path only.
      #   RUSTSEC-2025-0141 — bincode unmaintained; transitive via surrealdb-core, no CVE.
      #   RUSTSEC-2023-0089 — atomic-polyfill unmaintained; transitive via surrealdb, no CVE.
      #   RUSTSEC-2026-0194 — quick-xml DoS; transitive via samael (SAML), which pins ^0.37 (no >=0.41 path); SAML off by default.
      #   RUSTSEC-2026-0195 — quick-xml DoS; transitive via samael (SAML), which pins ^0.37 (no >=0.41 path); SAML off by default.
      #   RUSTSEC-2026-0235 — rkyv OOB read. NOT COMPILED INTO ANY AXIAM ARTIFACT: rkyv is an
      #     `optional = true` dependency of rust_decimal behind its `rkyv` feature, and nothing in
      #     our graph enables it. `cargo tree -i rkyv --target all --all-features` prints "nothing
      #     to print", and rkyv appears zero times in the fully-resolved tree. cargo-audit reads
      #     Cargo.lock, which records optional dependencies whether or not a feature ever pulls
      #     them in, so this is a lockfile artifact rather than a reachable vulnerability — unlike
      #     the entries above, which are real dependencies with a reachability argument.
      #     Re-verify with the command above if rust_decimal's feature defaults ever change.
      #   RUSTSEC-2026-0258 — h2 unbounded empty DATA frames (DoS). THIS ONE IS REACHABLE, unlike
      #     every entry above, and is ignored only because no fix exists to take. Two copies of h2
      #     resolve: the 0.4.x copy (reqwest/tonic/hyper) IS patched — Cargo.lock pins 0.4.16 — but
      #     `h2 0.3.27` arrives via actix-http <- actix-web/actix-governor and serves the REST
      #     listener, and the advisory patches >=0.4.16 only, with no 0.3.x backport
      #     (`cargo update -p h2@0.3.27` locks 0 packages). actix-http 3.13.3 / actix-web 4.14.1
      #     are the newest releases and predate the 2026-08-17 advisory. Availability-only,
      #     upstream severity low. Drop this ID the moment actix-http ships on h2 0.4.
      #     Full reachability analysis and the interim operator mitigation: deny.toml.
      - name: cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24  # v1
        with:
          ignore: RUSTSEC-2023-0071,RUSTSEC-2025-0141,RUSTSEC-2023-0089,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0235,RUSTSEC-2026-0258

      # --- cargo deny (advisories + licenses + bans + sources) ---
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check
          arguments: --all-features

      # --- npm audit ---
      - name: npm audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      # --- Hadolint Dockerfile lint ---
      - name: Hadolint server Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: docker/Dockerfile.server
          format: sarif
          output-file: hadolint-server.sarif
          no-fail: true

      - name: Hadolint frontend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: docker/Dockerfile.frontend
          format: sarif
          output-file: hadolint-frontend.sarif
          no-fail: true

      # --- Trivy filesystem scan (dependency vulns — HIGH/CRITICAL, exit 1) ---
      # scanners: vuln only. Secret detection is intentionally NOT delegated to
      # Trivy here: the repository carries ~40 throwaway Ed25519/RSA PEM fixtures
      # inside `#[cfg(test)]` modules and test files, which Trivy's generic
      # `private-key` rule flags as CRITICAL across the board. Real secret
      # detection is owned by the dedicated GitGuardian check and GitHub's native
      # secret scanning, both of which run on this repo. Keeping Trivy scoped to
      # vulnerabilities removes that whole class of false positives from the
      # code-scanning dashboard while preserving the dependency-vuln gate.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          # trivy-action writes ALL severities into the SARIF by default
          # ("Building SARIF report with all severities") — the `severity`
          # input only gates the table/exit-code. This flag makes the SARIF
          # honour the filter too, so the code-scanning dashboard isn't flooded
          # with LOW/MEDIUM advisories that fail the Trivy check.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif

      # --- Trivy config scan (Dockerfile/K8s misconfig — advisory, exit 0) ---
      # Gated to HIGH,CRITICAL via limit-severities-for-sarif (see fs scan note):
      # the manifests were hardened to clear the only HIGH finding (KSV-0118, pod
      # securityContext). The residual MEDIUM/LOW advisories are structural and
      # non-hardenable — AVD-KSV-0125 (ghcr.io is the project's own registry;
      # trusted-registry is scanner policy, not a manifest field) and
      # AVD-KSV-0020/0021 (nginx-unprivileged requires UID/GID 101). They are
      # intentionally kept out of the SARIF so the advisory code-scanning check
      # stays green while real HIGH/CRITICAL regressions would still surface.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      # --- A6: AMQP transport posture is stated, not inherited ---
      # Deliberately placed after every SARIF *producer* above. A failing step
      # under `bash -e` skips the rest of the job, and the SARIF uploads below
      # already report a missing file as an error — putting this check earlier
      # would turn one real finding into five confusing ones.
      #
      # This requires TLS. AMQP is amqps://-only in every build profile, so a
      # stack that says otherwise does not fail a test — it fails to boot, and
      # the only symptom is a container that never starts, which is how it last
      # took the E2E job down.
      - name: AMQP transport posture
        run: python3 scripts/check-amqp-transport.py

      # --- Upload all SARIF results to GitHub Security tab (D-07) ---
      - name: Upload hadolint server SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        if: always()
        with:
          sarif_file: hadolint-server.sarif
          category: hadolint-server

      - name: Upload hadolint frontend SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        if: always()
        with:
          sarif_file: hadolint-frontend.sarif
          category: hadolint-frontend

      - name: Upload trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload trivy config SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  test:
    name: Test
    runs-on: ubuntu-latest
    # A6: RabbitMQ is deliberately NOT a `services:` container here. AMQP is
    # TLS-only, so the broker needs a certificate mounted at startup, and a
    # service container starts before any step runs — there is no point at
    # which a step-generated cert could reach it. Starting it with `docker run`
    # in a step instead is the same pattern this job already uses for
    # SurrealDB, and it is what lets the cert be minted first.
    env:
      AXIAM__DB__URL: "ws://localhost:8000"
      AXIAM__DB__USERNAME: root
      AXIAM__DB__PASSWORD: root
      AXIAM__AMQP__URL: "amqps://axiam:axiam@localhost:5671"
      # target/ for the workspace test build plus the two feature-gated relinks
      # at the end of this job no longer fits on an ubuntu-latest runner. It
      # failed as `ld terminated with signal 7 [Bus error]` while linking the
      # last test binary — an out-of-disk write, not a compiler bug — with the
      # RabbitMQ service container logging "Free bytes: 0" in the same second.
      # Both knobs shrink target/ rather than buying time: incremental artifacts
      # are pure waste on a one-shot runner that never rebuilds, and debuginfo
      # is the largest single contributor to test-binary size. line-tables-only
      # rather than 0 so panic backtraces keep file and line numbers.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3 start \
            --user root --pass root --log info
          for i in $(seq 1 30); do
            docker exec surrealdb /surreal isready 2>/dev/null && break || sleep 2
          done
      # A6: AMQP is TLS-only, so this broker listens on 5671 (AMQPS) and has no
      # plaintext listener at all — the same shape as docker-compose.prod.yml.
      # The certificate is minted here, per run and thrown away with the runner;
      # its SAN covers `localhost`, which is what the tests below connect to.
      - name: Start RabbitMQ (AMQPS)
        run: |
          bash scripts/gen-broker-tls.sh
          docker compose -f docker/docker-compose.ci-broker.yml up -d --wait
          # `--wait` only proves the node is running. The healthcheck is
          # `rabbitmq-diagnostics check_running`, which says nothing about
          # whether the AMQPS listener BOUND — and a bad certificate path or an
          # unsupported TLS version makes the listener fail while the node stays
          # up and healthy. That combination is the worst possible failure for a
          # caller: the port is published either way, so lapin (which has no
          # connect timeout) hangs on a socket nothing is accepting, and the
          # test sits there until the job is killed. It did, for 25 minutes.
          #
          # So assert the listener is really there, and print what is bound.
          echo "::group::rabbitmq listeners"
          docker compose -f docker/docker-compose.ci-broker.yml exec -T rabbitmq \
            rabbitmq-diagnostics -q listeners
          echo "::endgroup::"
          # Order-agnostic on purpose: `listeners` prints "port: 5671,
          # protocol: amqp/ssl" — port BEFORE protocol. The first version of
          # this assertion grepped 'amqp/ssl.*5671' and so failed a broker
          # whose listener was perfectly fine, which is the same shape of
          # defect as the one this whole change is about: a check that reads
          # like a guarantee and does not hold.
          if ! docker compose -f docker/docker-compose.ci-broker.yml exec -T rabbitmq \
              rabbitmq-diagnostics -q listeners \
              | grep -qiE '(port: *5671.*amqp/ssl|amqp/ssl.*5671)'; then
            echo "::error::the broker is running but has no AMQPS listener on 5671"
            docker compose -f docker/docker-compose.ci-broker.yml logs rabbitmq
            exit 1
          fi
      - name: Broker log on failure
        if: failure()
        run: docker compose -f docker/docker-compose.ci-broker.yml logs rabbitmq
      # libxmlsec1-dev / libxml2-dev are required by the `saml` feature
      # (→ samael → libxmlsec1), which is on by default. Without them the
      # samael build script fails ("xmlsec1-config not found").
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev
      # --no-fail-fast: run every test target and report all failures in one
      # pass (the suite only began running once libxmlsec1 was installed, so
      # surfacing the whole picture at once is far cheaper than one-per-run).
      - run: cargo test --workspace --no-fail-fast
      # The two steps below relink axiam-api-grpc under a different feature set
      # and are where the job ran out of disk. Report free space here so the
      # next capacity failure is diagnosable from the log directly, instead of
      # only from a linker signal and the service container's disk alarm.
      - name: Disk usage before feature-gated gRPC tests
        run: df -h && du -sh target 2>/dev/null || true
      # gRPC authz integration tests require the `client` feature (generated
      # client stubs). `cargo test --workspace` above skips them via
      # required-features; run them explicitly here so they execute as
      # compliance evidence (D-10, T19.1, T19.2 / SC#4).
      - run: cargo test -p axiam-api-grpc --features client --test grpc_authz_test
      # UserInfoService integration tests (gRPC OIDC userinfo) — also gated on
      # the `client` feature for the generated client stubs.
      - run: cargo test -p axiam-api-grpc --features client --test grpc_userinfo_test
      # ReactorAdminService integration tests (X1 / R2.3) — same `client`-feature
      # gate as the two above (generated client stubs).
      - run: cargo test -p axiam-api-grpc --features client --test grpc_reactor_test
      # X1 / R2.4 — containerized-reactor integration test against the AMQPS
      # broker this job started above. `#[ignore]`d for the same reason
      # `webhook_consumer_test.rs`'s live-broker test is: `cargo test
      # --workspace` above must not require a broker in every environment
      # that runs it. This job has one, so run it explicitly here.
      #
      # `--nocapture` and `RUST_BACKTRACE` are not decoration here. This step
      # has twice been killed at its timeout having printed exactly
      # `running 10 tests` and nothing else: libtest buffers per-test output
      # when stdout is a pipe, so a suite that stalls names neither the test it
      # stalled in nor the reason. The second time, the reason was a rustls
      # `CryptoProvider` panic on lapin's own IO thread — a panic the caller
      # never sees, on a thread nobody was reading — and ten minutes of silence
      # was the entire diagnostic. `--nocapture` streams it as it happens.
      #
      # `timeout-minutes` stays as the outer bound. `AmqpConfig`'s
      # `connect_timeout_ms` should now make an unbounded dial impossible, so
      # this should never be what stops the step; it is here for the failure
      # that has not been thought of yet.
      - timeout-minutes: 10
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test -p axiam-amqp --test reactor_containerized_test \
            -- --ignored --test-threads=1 --nocapture

  frontend-quality:
    name: Frontend Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # jsdom >=30 (the vitest test environment for this project) raised its
      # engines.node floor to ^22.22.2 || ^24.15.0 || >=26.0.0, dropping Node 20
      # entirely. Node 20 is also past its active-LTS window, so 22 (current
      # LTS) is the floor here rather than a one-off bump for jsdom alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint and type-check
        working-directory: frontend
        # `tsc -b` builds only tsconfig.app.json and tsconfig.node.json, so the
        # Playwright specs under e2e/ were never typechecked here. Playwright
        # transpiles without typechecking, so they ran green while carrying
        # nine type errors nobody could see. `typecheck:e2e` is that gate.
        run: npm run lint && npx tsc -b && npm run typecheck:e2e
      # C3: axe-core smoke run over the main pages and the design-system
      # components the accessibility audit fixed. It lives HERE rather than
      # only inside the e2e job's `npm test` (which also runs it) because this
      # job needs no backend and no served build -- an accessibility regression
      # should fail in a couple of minutes, not behind a whole compose stack.
      #
      # What a green run means is bounded, and the suite's own header says so:
      # automated checking catches roughly a third of real WCAG failures, so
      # this is a regression guard on the audit's fixes, not a claim of
      # accessibility.
      - name: Frontend accessibility smoke (axe-core)
        working-directory: frontend
        run: npm run test:a11y

  website-quality:
    name: Website Lint + Type Check + Build
    runs-on: ubuntu-latest
    # The public website (and with it the documentation section) had no
    # PR-time gate: `website-publish.yml` only runs on pushes to main, so a
    # change that failed to type-check or build was discovered after merge, by
    # a red deploy. This job is the same three commands that workflow runs,
    # minus the deploy step.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Kept in step with frontend-quality and website-publish.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Website lint and type-check
        working-directory: website
        run: npm run lint && npx tsc -b
      - name: Website build
        working-directory: website
        run: npm run build

  bench-harness:
    name: Bench Harness Self-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # J13/E2: the bench-pack manifest guard. Hermetic — it builds a fixture
      # results tree and runs runner/pack-filelist.sh over it, so no docker, no
      # k6, no seeded stack. Run 5 shipped a shareable archive that silently
      # dropped every investigation artifact; this is the regression that
      # catches the next such drop in seconds rather than after a matrix.
      - name: bench-pack manifest self-test
        working-directory: benchmarks
        run: bash runner/pack-selftest.sh
      # J8: the SDK median-of-N merger must name a pass that produced no
      # record and fail, rather than silently reporting "median of 2" against
      # repeat=3. Stdlib python only — no SDK toolchains needed.
      - name: SDK median-of-N provenance self-test
        working-directory: benchmarks
        run: bash sdk/test-median-provenance.sh
      # M1: an extension-less `--scenario` must be normalized BEFORE
      # filter_scenarios() runs — otherwise it matches none of the
      # `.js`-suffixed filter lists and silently bypasses every one of them,
      # pending scenarios included. Drives the real runner in dry-run mode; no
      # docker, no k6 (every scenario in the fixture is filtered out).
      - name: Scenario-name filter self-test
        working-directory: benchmarks
        run: bash runner/scenario-filter-selftest.sh
      # M2: rl_prod_check.py must read a `bench-matrix` (`run-*/`) tree as well
      # as a flat one. Reading only the flat layout made a matrix rl=prod pass
      # report "no data" on every endpoint and exit 0 — an unverified limiter
      # pass that looks like a clean one. Stdlib python only.
      - name: rl-prod results-layout self-test
        working-directory: benchmarks
        run: bash runner/rl-prod-layout-selftest.sh
      # N1: the nested-resource depth sweep's harness wiring. Three silent
      # failure modes, all caught here: a labelled sweep rung leaking into the
      # default `--scenario all` set (hours added to every future matrix, and
      # one arbitrary depth published as "the" nested number), the AXIAM-only
      # gRPC arm running against a competitor, and nested_report.py computing a
      # depth slope for the capability-gap arm — a flat line and "there is no
      # such operation" look identical in a table and mean different things.
      # Hermetic: no docker, no k6, no seeded stack.
      - name: Nested-authz sweep self-test
        working-directory: benchmarks
        run: bash runner/nested-selftest.sh
      # Shell syntax gate for the runner scripts. `bash -n` is not a linter,
      # but the runner is 1 000+ lines of bash that only ever executes inside a
      # multi-hour matrix run — a syntax error there is otherwise discovered at
      # the worst possible moment.
      - name: Runner scripts parse
        working-directory: benchmarks
        run: for f in runner/*.sh; do bash -n "$f"; done

  limiter-tests:
    name: Rate Limiter Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # libxmlsec1-dev / libxml2-dev are required by axiam-api-rest's default
      # `saml` feature (→ samael → libxmlsec1) — same as `build`/`test` above.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev
      # R5.2 (A1 §5): a dedicated, fast-running job for the limiter unit +
      # deterministic-integration suite, separate from the full `test` job so
      # a limiter regression is legible on its own (not one red line among
      # hundreds) and this job stays quick enough to run on every PR. Every
      # test here is self-contained (in-memory SurrealDB, no RabbitMQ, no
      # network) and completes in seconds — deliberately NOT the >= 60s
      # `rate_limit_sustained_flood_test` (`#[ignore]`d; that one is a
      # deliberately long-running proof run by hand / a scheduled job, not
      # part of the fast PR gate).
      - name: axiam-api-rest rate-limit config unit tests
        run: cargo test -p axiam-api-rest --lib config::rate_limit
      - name: axiam-api-rest rate-limit integration tests
        run: |
          cargo test -p axiam-api-rest --test rate_limit_shared_store_test
          cargo test -p axiam-api-rest --test rate_limit_client_identity_test
          cargo test -p axiam-api-rest --test rate_limit_keying_test
          cargo test -p axiam-api-rest --test users_rate_limit_split_test
      # R5.2 tail: SCIM shipped (R3.1) with no limiter at all. This proves the
      # `scim_per_min` bucket is ENFORCED on the real `/scim/v2` wiring, not
      # merely configured — the whole point of adding it.
      - name: axiam-scim rate-limit enforcement tests
        run: cargo test -p axiam-scim --test scim_rate_limit_test
      - name: axiam-api-grpc rate-limit unit + integration tests
        run: |
          cargo test -p axiam-api-grpc --lib middleware::rate_limit
          cargo test -p axiam-api-grpc --test rate_limit_units_test
          cargo test -p axiam-api-grpc --test rate_limit_shared_store_test
      - name: axiam-db shared rate-limit counter unit tests
        run: cargo test -p axiam-db --lib rate_limit_counter

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    # Backstop: a Playwright spec that hangs on CI (no per-test signal) would
    # otherwise run to GitHub's 6h default. Bound the whole job so a hang
    # self-terminates and leaves a downloadable log instead of blocking the PR.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start backend services (built from PR source)
        # --build forces the server image to be built from this PR's source code.
        # Using a pre-built registry image (ghcr.io/axiamhq/axiam/server:latest)
        # would produce false-green results on PR branches (W8 — stale image).
        run: |
          # load_config() asserts the JWT signing keypair is non-empty, else the
          # server panics on startup (exit 101). Generate an ephemeral Ed25519
          # keypair for this run and pass it through to the server container
          # (compose substitutes the ${...} refs in docker-compose.e2e.yml).
          AXIAM__AUTH__JWT_PRIVATE_KEY_PEM="$(openssl genpkey -algorithm ed25519)"
          AXIAM__AUTH__JWT_PUBLIC_KEY_PEM="$(printf '%s' "$AXIAM__AUTH__JWT_PRIVATE_KEY_PEM" | openssl pkey -pubout)"
          export AXIAM__AUTH__JWT_PRIVATE_KEY_PEM AXIAM__AUTH__JWT_PUBLIC_KEY_PEM
          # SEC-022/SECHRD-08/D-05c: the AMQP master signing key is mandatory in
          # a release build — unset means resolve_signing_key() fails closed and
          # the server panics on startup (exit 101). Hex-encoded, 32 bytes.
          AXIAM__AMQP__SIGNING_KEY="$(openssl rand -hex 32)"
          export AXIAM__AMQP__SIGNING_KEY
          # OBS-1: the auth pepper is mandatory in a release build — client
          # secrets are a keyed HMAC-SHA256 tag with no unkeyed fallback, so
          # install_from_config() fails closed and the server panics on startup
          # (exit 101) when it is unset. A fresh pepper per run is correct: E2E
          # starts from an empty database, so no v2 hash outlives the run.
          AXIAM__AUTH__PEPPER="$(openssl rand -hex 32)"
          export AXIAM__AUTH__PEPPER
          # A6: AMQP is TLS-only, so the broker needs a certificate before it
          # can serve anyone — there is no plaintext listener and no flag that
          # brings one back. A throwaway CA per run is correct here for the same
          # reason a fresh pepper is: the stack starts empty and is torn down
          # with the job, so nothing outlives the material.
          bash scripts/gen-broker-tls.sh
          docker compose -f docker/docker-compose.e2e.yml up -d --build --wait
        # The release build alone now takes ~14-15 min (grown with recent phases:
        # tikv-jemallocator, actix-tls, rcgen, x509-parser, samael, tonic-build,
        # etc.), leaving near-zero margin under the old 15-min step timeout —
        # observed a hairline timeout where every service reported Healthy in
        # the same second the step timed out. The job-level timeout-minutes: 75
        # above has ample headroom, so give this step real margin instead.
        timeout-minutes: 30

      - name: Dump server logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.e2e.yml logs axiam-server

      # R5.4 (X4 cross-vendor proof): `keycloak_cross_vendor_token_exchange_test.rs`
      # exchanges a token minted by the REAL Keycloak service the compose
      # stack just brought up (`--wait` above already gates on its
      # healthcheck) — see that file's module docs for exactly why it talks
      # to Keycloak over `localhost` from this runner rather than through the
      # containerized `axiam-server`. `--ignored` is required: the test is
      # marked `#[ignore]` so `cargo test` elsewhere in CI (the `test` job,
      # which has no Keycloak) never tries to run it.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: ". -> target"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev
      - name: X4 cross-vendor token exchange against real Keycloak
        run: |
          cargo test -p axiam-api-rest --test keycloak_cross_vendor_token_exchange_test \
            -- --ignored --test-threads=1
        env:
          KEYCLOAK_URL: "http://localhost:8180"

      # Seeds two administrators: the organization-level super-admin bootstrap
      # creates, and a tenant-level admin inside `default`. The Playwright
      # suite signs in as the latter — see frontend/e2e/helpers/auth.ts.
      - name: Bootstrap E2E fixture (org + organization scope + tenant + admins)
        run: bash scripts/e2e-bootstrap.sh
        env:
          E2E_ORG_SLUG: "test-org"
          E2E_TENANT_SLUG: "default"
          E2E_ADMIN_EMAIL: "admin@axiam.dev"
          E2E_ADMIN_PASSWORD: "Test@Admin123!"
          AXIAM_URL: "http://localhost:8090"
          SURREAL_URL: "http://localhost:8000"

      # This job also runs `npm test` (vitest + jsdom) below, so it needs the
      # same jsdom-30 Node floor as frontend-quality above.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The admin UI resolves `@axiam/opaque-wasm` to this build output (see
      # frontend/vite.config.ts), falling back to a stub when it is absent. This
      # job serves the real production `dist/` to Playwright, so without these
      # two steps the suite would exercise a bundle whose OPAQUE client is the
      # stub — green, and blind to exactly the class of defect that let the
      # admin UI ship a non-functional OPAQUE client for several releases.
      #
      # Same wasm-pack version as release-opaque.yml and Dockerfile.frontend.
      # SHA-pinned like coverage.yml's use of this action, rather than the
      # floating `@v2` release-opaque.yml still carries.
      - name: Install wasm-pack
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: wasm-pack@0.13.1

      - name: Build the OPAQUE WebAssembly client
        run: |
          wasm-pack build crates/axiam-opaque-wasm \
            --target web --release \
            --out-dir "$PWD/frontend/vendor/opaque-wasm" \
            --out-name axiam_opaque

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # The alias falls back silently by design, so assert the real client is in
      # the bundle rather than trusting that it is.
      - name: Assert the bundle carries the real OPAQUE client
        working-directory: frontend
        run: |
          test -n "$(find dist/assets -name 'axiam_opaque_bg-*.wasm' -print -quit)" \
            || { echo "OPAQUE wasm missing from the bundle — the stub was used" >&2; exit 1; }

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Serve frontend and run Playwright E2E tests
        working-directory: frontend
        # Generous enough for a legitimately slow full suite (serial workers,
        # 2 retries), but bounded so an actual hang fails here — with a log —
        # rather than stalling the whole job. The full 107-spec suite runs
        # serially and each failing spec burns up to 3×30s on retries, so this
        # must comfortably exceed a worst-case mostly-passing run.
        timeout-minutes: 45
        run: |
          # Serve the production `dist/` build on port 5173 with `vite preview`.
          # `vite preview` (unlike a plain static server) gives us BOTH:
          #   - SPA history fallback, so direct deep links (/login, /users, …)
          #     load index.html instead of 404ing; and
          #   - the `preview.proxy` from vite.config.ts, so the app's relative
          #     /api and /auth/login calls reach the backend on :8090.
          # A plain static server (`serve dist`) has neither, which makes every
          # authenticated page bounce to /login and the whole suite time out.
          npm run preview -- --port 5173 --strictPort &
          SERVE_PID=$!
          # Wait for the preview server to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && break || sleep 2
          done
          # D-11: this must be `npm run test:e2e` (Playwright, test:e2e script)
          # against the served build + seeded backend — NOT `npm test`
          # (vitest), which was previously (and incorrectly) run here and let
          # all 13 frontend/e2e/*.spec.ts specs (including the SECFIX-06
          # body-asserting auth-contract.spec.ts) go unexecuted (CORR-04).
          npm run test:e2e
          kill $SERVE_PID || true
        env:
          CI: "true"
          E2E_BASE_URL: "http://localhost:5173"
          E2E_ORG_SLUG: "test-org"
          E2E_TENANT_SLUG: "default"
          E2E_ADMIN_EMAIL: "admin@axiam.dev"
          E2E_ADMIN_PASSWORD: "Test@Admin123!"

      - name: Run frontend unit tests
        working-directory: frontend
        # D-11: vitest run kept as its own separate blocking step (does not
        # need the served frontend/seeded backend) so both suites
        # independently gate the build.
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Stop backend services
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down
