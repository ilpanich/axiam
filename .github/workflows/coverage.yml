name: Coverage

# Line coverage for the server workspace and the frontend unit suite,
# reported to Coveralls as a single parallel build.
#
# Runs on every PR and on every push to main. The main-branch runs are what
# establish the baseline Coveralls diffs a PR against, so both triggers are
# required — a PR-only workflow would have nothing to compare to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-coverage:
    name: cargo-llvm-cov (server workspace) -> Coveralls
    runs-on: ubuntu-latest
    # A6: RabbitMQ is started with `docker run` in a step below rather than as a
    # `services:` container, for the same reason as ci.yml's test job — AMQP is
    # TLS-only, and a service container starts before any step could mint the
    # certificate it would need to mount.
    env:
      AXIAM__DB__URL: "ws://localhost:8000"
      AXIAM__DB__USERNAME: root
      AXIAM__DB__PASSWORD: root
      AXIAM__AMQP__URL: "amqps://axiam:axiam@localhost:5671"
      # The instrumented `cargo llvm-cov --workspace` build links every test
      # binary with full `debuginfo=2`, which grew past the runner's free disk
      # once the coverage suite expanded — `ld` then SIGBUSes on a truncated
      # output. Coverage mapping comes from LLVM's `-C instrument-coverage`
      # region map, NOT from DWARF, so dropping to line tables shrinks the
      # instrumented binaries several-fold with no effect on the reported
      # numbers. `CARGO_INCREMENTAL=0` avoids incremental artifacts a clean CI
      # build never reuses.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
          # cargo-llvm-cov reads the profraw files the instrumented binaries
          # emit; llvm-tools ships the llvm-profdata/llvm-cov it shells out to.
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3 start \
            --user root --pass root --log info
          for i in $(seq 1 30); do
            docker exec surrealdb /surreal isready 2>/dev/null && break || sleep 2
          done

      # A6: AMQPS-only broker, mirroring ci.yml's test job.
      - name: Start RabbitMQ (AMQPS)
        run: |
          bash scripts/gen-broker-tls.sh
          docker run -d --name rabbitmq -p 5671:5671 -p 15672:15672 \
            -e RABBITMQ_DEFAULT_USER=axiam \
            -e RABBITMQ_DEFAULT_PASS=axiam \
            -e RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS="-rabbit listeners.tcp [] -rabbit listeners.ssl.default 5671 -rabbit ssl_options.cacertfile \"/etc/rabbitmq/tls/ca.pem\" -rabbit ssl_options.certfile \"/etc/rabbitmq/tls/server.pem\" -rabbit ssl_options.keyfile \"/etc/rabbitmq/tls/server.key\" -rabbit ssl_options.verify verify_none -rabbit ssl_options.fail_if_no_peer_cert false -rabbit ssl_options.versions ['tlsv1.3']" \
            -v "$PWD/docker/.secrets/broker-tls:/etc/rabbitmq/tls:ro" \
            rabbitmq:4-management-alpine
          for i in $(seq 1 30); do
            docker exec rabbitmq rabbitmq-diagnostics check_running 2>/dev/null && break || sleep 2
          done
          docker exec rabbitmq rabbitmq-diagnostics check_running

      # libxmlsec1-dev / libxml2-dev are required by the `saml` feature
      # (→ samael → libxmlsec1), which is on by default. Without them the
      # samael build script fails ("xmlsec1-config not found").
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libxmlsec1-dev libxml2-dev

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        with:
          tool: cargo-llvm-cov

      # Mirrors the `test` job in ci.yml: default feature set (not
      # --all-features), --no-fail-fast for the workspace suite, plus the
      # gRPC authz integration tests that require the `client` feature and
      # are excluded from the workspace run via required-features.
      - name: Collect coverage (workspace)
        run: cargo llvm-cov --workspace --no-report --no-fail-fast

      # All three axiam-api-grpc integration tests carry required-features=["client"],
      # so they are skipped by the --workspace run above and must be instrumented
      # explicitly here. Previously only grpc_authz_test was collected, which left
      # UserService/TokenService (grpc_auth_test) and UserInfoService
      # (grpc_userinfo_test) uninstrumented despite having passing integration tests.
      - name: Collect coverage (gRPC client feature)
        run: cargo llvm-cov --no-report -p axiam-api-grpc --features client --test grpc_authz_test --test grpc_auth_test --test grpc_userinfo_test

      # axiam-server/src/main.rs is the binary composition root (~1000 lines of
      # process wiring: config load, DB/AMQP/HTTP/gRPC setup, task spawning,
      # graceful shutdown). It has no unit-testable logic — it is exercised only
      # end-to-end by the server integration tests, which llvm-cov does not
      # instrument through the spawned binary — so it sat at 0% and dragged the
      # workspace number down without reflecting real test quality. Exclude it
      # from both the Coveralls report and the regression gate; the testable
      # seams (cleanup::run_erasure_pipeline, tls::build_rustls_server_config)
      # live in lib.rs and stay measured.
      - name: Generate lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'crates/axiam-server/src/main\.rs'

      # Regression gate: fail the build if workspace line coverage drops below
      # the floor. The round-2 coverage pass added ~210 tests across api-rest,
      # db, federation, amqp, auth, pki and server, and excluded the untestable
      # main.rs binary root (above). Excluding main.rs alone lifted the ~78.7%
      # pre-pass raw figure to ~80.3%, which is why the floor went 77 -> 80.
      #
      # R5.9: ratcheted 80 -> 88 against a MEASURED number rather than an
      # estimate. This job's own summary step (below) printed, on the merge
      # commit of the 2026-08-15 remediation plan:
      #
      #   TOTAL  ... 87.40% (regions)  79.32% (functions)  88.60% (lines)
      #
      # i.e. 60898 lines with 6942 missed. `--fail-under-lines` gates on LINES,
      # so 88.60% is the figure that matters here — not the lower region or
      # function numbers in the same row. The floor is set 0.6pp under it,
      # comparable to the 0.3pp margin the 77 -> 80 ratchet used.
      #
      # Keep ratcheting toward the >=90% target as it stabilizes, and only ever
      # to a value this job has actually printed — never to an estimate. Note
      # the raw cargo-llvm-cov number differs from the Coveralls display number.
      # Reuses the profdata collected above.
      - name: Enforce coverage floor
        run: |
          # Surface the achieved per-file + TOTAL coverage on the run's summary page.
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex 'crates/axiam-server/src/main\.rs' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --fail-under-lines 88 \
            --ignore-filename-regex 'crates/axiam-server/src/main\.rs'

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          flag-name: rust-workspace
          parallel: true

  frontend-coverage:
    name: vitest --coverage (frontend) -> Coveralls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # jsdom >=30 (the vitest test environment) raised its engines.node floor
      # to ^22.22.2 || ^24.15.0 || >=26.0.0, dropping Node 20; Node 22 is also
      # the current LTS, so it replaces the now-unsupported Node 20 pin here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Collect coverage
        working-directory: frontend
        # `--coverage.reporter=lcov` REPLACES vitest's default text reporter, so
        # this job printed no percentage anywhere: the threshold in
        # vitest.config.ts could be neither audited nor ratcheted against a
        # number CI had actually printed, which is the rule the rust job above
        # states for itself. `text-summary` restores it and is teed onto the run
        # summary page, exactly as `cargo llvm-cov report --summary-only` is.
        #
        # `set -o pipefail` is load-bearing, not decoration. Actions runs `run:`
        # under `bash -e`, which does NOT set pipefail, and here vitest IS the
        # gate — without it, `tee`'s exit 0 would mask a threshold failure and
        # this job would go green on a coverage regression. (The rust job needs
        # no such guard: what it tees is an informational `--summary-only`
        # report, and its actual `--fail-under-lines` gate is a separate,
        # un-piped command.)
        run: |
          set -o pipefail
          npx vitest run --coverage \
            --coverage.reporter=lcov \
            --coverage.reporter=text-summary \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: frontend/coverage/lcov.info
          format: lcov
          flag-name: frontend-vitest
          parallel: true
          base-path: frontend

  finish:
    name: "Coveralls: finalize parallel build"
    needs: [rust-coverage, frontend-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
