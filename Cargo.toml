[workspace]
members = [
    "crates/axiam-core",
    "crates/axiam-opaque",
    "crates/axiam-opaque-ffi",
    "crates/axiam-db",
    "crates/axiam-auth",
    "crates/axiam-authz",
    "crates/axiam-api-rest",
    "crates/axiam-api-grpc",
    "crates/axiam-amqp",
    "crates/axiam-oauth2",
    "crates/axiam-federation",
    "crates/axiam-audit",
    "crates/axiam-pki",
    "crates/axiam-email",
    "crates/axiam-scim",
    "crates/axiam-server",
    "crates/axiam-test-support",
]
# `tools/surreal-race-probe` is a diagnostic, not part of the product: it pulls
# three SurrealDB storage engines (one of which builds RocksDB from C++) to
# measure whether a given engine serialises concurrent read-modify-writes. It is
# run by hand on a SurrealDB bump or an engine change — see its README — and CI
# should not pay for that dependency tree on every commit.
exclude = ["tools/surreal-race-probe"]
resolver = "3"

# ---------------------------------------------------------------------------
# Lints (F6)
# ---------------------------------------------------------------------------
#
# Opt-in per crate via `[lints] workspace = true`, so the ratchet can move one
# crate at a time rather than landing 245 doc comments in one diff.
#
# `missing_docs` is a warning here and an error in CI, where clippy runs with
# `-D warnings`. That asymmetry is deliberate: a local `cargo check` should not
# fail while you are mid-thought on a new public item, and a pull request
# should not merge without the sentence explaining it.
#
# Currently opted in: axiam-authz.
#
# The rest of the workspace is a ratchet target -- add `[lints] workspace = true`
# to a crate once its public surface is documented. Do NOT add the key to a
# crate you have not documented first: a lint that fires on every build is one
# everybody learns to scroll past, and then it is worse than no lint.
#
# Next, and sized so it can be planned rather than discovered: **axiam-core,
# 993 sites**. `missing_docs` fires on struct and enum *fields*, not only on
# the items containing them, so the count is roughly four times the number of
# public types. The concentrations are models/oauth2_client.rs (115),
# repository.rs (146), models/settings.rs (74) and models/federation.rs (44).
# It is worth doing -- axiam-core is the crate every other crate reads -- and
# it is worth doing as its own change, because 993 doc comments written in a
# hurry to clear a lint are 993 sentences nobody will trust.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.package]
version = "1.0.0-beta07"
edition = "2024"
authors = ["AXIAM Contributors"]
license = "Apache-2.0"
repository = "https://github.com/emanuele/axiam"
rust-version = "1.93"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
actix-web = "4"
actix-rt = "2"
actix-http = "3"
actix-cors = "0.7"
actix-governor = "0.10"
tower_governor = { version = "0.8", features = ["tonic"] }
governor = "0.10"
tower = { version = "0.5", features = ["util"] }
http-body = "1"
http-body-util = "0.1"
http = "1"
bytes = "1"
tracing-actix-web = "0.7"

# gRPC
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# AMQP
lapin = "4"
futures-lite = "2"

# Database
surrealdb = "3"
# Lock-free atomic swap of the pooled SurrealDB connection: the DB pool slot is
# read on every query and written only by a reconnect, so readers must never
# take a lock or queue behind the (essentially never) writer.
arc-swap = "1"

# Authentication & Crypto
# jsonwebtoken 11 removed implicit per-optional-dependency Cargo features
# (`dep:` syntax) — previously this crate silently piggybacked on the
# `rust_crypto`/`aws_lc_rs` features enabled transitively via feature
# unification with `surrealdb-core`'s (still-10.x) `jsonwebtoken` dependency.
# Now that axiam and surrealdb-core resolve to two independent major
# versions, that free ride is gone and the crate's own `default` feature set
# (`use_pem` only) ships with no crypto backend at all — every `encode`/
# `decode` call panics at runtime via `CryptoProvider::from_crate_features`.
# We need EdDSA (primary token algorithm), RSA/PS* and ES* (federation OIDC
# IdPs), and HMAC — all covered by the pure-Rust `rust_crypto` backend, so
# select it explicitly. Do NOT also enable `aws_lc_rs`: jsonwebtoken only
# auto-selects a default provider when *exactly one* of the two backend
# features is active; enabling both re-triggers the same panic.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.5"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
rand = "0.10"
hmac = "0.13"
hkdf = "0.13"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
subtle = "2"
base64 = "0.23"
# `conditional-ui` is what gates the discoverable-credential API
# (`start_discoverable_authentication`, `identify_discoverable_authentication`,
# `finish_discoverable_authentication`, `DiscoverableKey`). It is upstream's
# name for the feature, not a statement that conditional mediation is the only
# caller: the same ceremony backs both passkey autofill and the explicit
# "Sign in with a passkey" button, which are one server flow and two client
# mediation modes.
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
    "conditional-ui",
] }
webauthn-rs-proto = "0.5"
aes-gcm = "0.11"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

# Shared test fixtures (dev-dependency only; see crates/axiam-test-support)
axiam-test-support = { path = "crates/axiam-test-support" }
zeroize = "1"
secrecy = { version = "0.10", features = ["serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }

# Configuration
config = "0.15"

# OpenAPI
utoipa = { version = "5", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

# PKI / X.509 / OpenPGP
rcgen = "0.14"
x509-parser = { version = "0.18", features = ["verify"] }
pgp = "0.20"
pem = "4"

# SAML
samael = { version = "0.0.22", features = ["xmlsec"] }
flate2 = "1"
# XSW (XML Signature Wrapping) binding check (SECFIX-04/SEC-005). Already
# resolved transitively via samael's `xmlsec` feature (Cargo.lock pins
# 0.3.3) — pinned here to the EXACT resolved version so promoting it to a
# direct dependency of axiam-federation does not introduce a second copy
# of the FFI bindings.
libxml = "=0.3.3"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# TLS
rustls = "0.23"

# Testing
tokio-test = "0.4"
# R5.3 (X2 test gap) — property test over the UMA RPT deny-override
# invariant in axiam-oauth2/tests/uma_rpt_deny_property_test.rs.
proptest = "1"

# Internal crates
axiam-core = { path = "crates/axiam-core" }
axiam-opaque = { path = "crates/axiam-opaque" }
axiam-db = { path = "crates/axiam-db" }
axiam-auth = { path = "crates/axiam-auth" }
axiam-authz = { path = "crates/axiam-authz" }
# default-features = false so SAML/samael is opt-in: api-rest and axiam-server
# re-enable it through their own `saml` feature (on by default). This lets the
# whole workspace build `--no-default-features` on hosts whose system libxml2 is
# incompatible with samael (e.g. Arch libxml2 2.15.x).
axiam-api-rest = { path = "crates/axiam-api-rest", default-features = false }
axiam-api-grpc = { path = "crates/axiam-api-grpc" }
axiam-amqp = { path = "crates/axiam-amqp" }
axiam-oauth2 = { path = "crates/axiam-oauth2" }
axiam-federation = { path = "crates/axiam-federation", default-features = false }
axiam-audit = { path = "crates/axiam-audit" }
axiam-email = { path = "crates/axiam-email" }
axiam-pki = { path = "crates/axiam-pki" }
# R3.1 (B4): SCIM 2.0 provisioning, mounted under /scim/v2 by axiam-server.
axiam-scim = { path = "crates/axiam-scim" }

# Release build profile.
#
# Cargo only reads `[profile.*]` from the *workspace root* manifest — profile
# tables in member crates are ignored (with a warning). So this single section
# governs `cargo build --release` for axiam-server and every crate it links.
#
# Tuned for execution speed first, binary/resource footprint second. This makes
# release builds noticeably slower (fat LTO + a single codegen unit serialize
# most of the optimizer), which is an accepted trade for the runtime win.
[profile.release]
opt-level = 3         # Maximum optimization for speed.
lto = "fat"           # Whole-program LTO across all crates (== `true`); best
                      # runtime throughput, slowest link.
codegen-units = 1     # One codegen unit per crate — lets the optimizer see the
                      # whole crate at the cost of parallelism during compile.
strip = "symbols"     # Drop the symbol table to shrink the shipped binary. No
                      # runtime cost (release already builds with debug = 0).

# NOTE: `panic = "abort"` is deliberately NOT set. Its speed/size gain is
# marginal, and on a long-running REST/gRPC/AMQP server it is a net negative:
# with unwinding (the default), a panic inside a single request handler unwinds
# just that task — actix-web/tonic/tokio isolate it and the process keeps
# serving every other tenant. With `panic = "abort"` that same panic aborts the
# entire process, turning any panic-reachable code path into a whole-server
# outage (and a potential DoS lever). For an availability- and security-
# critical IAM service, request isolation outweighs the marginal optimization.
