# Benchmark target: AXIAM (resource-capped).
#
# Mirrors docker/docker-compose.prod.yml but pins CPU/memory caps so that
# "performance per resource" is meaningful and equal across targets. An optional
# profile-driven TLS terminator (nginx) fronts the server for the p1/p2/p3
# security profiles; for p0-plaintext it is left out and k6 hits :8090 directly.
#
# Caps default to 2 CPU / 1 GiB for the server and are overridable:
#   BENCH_CPUS=2 BENCH_MEM=1024m BENCH_DB_MEM=1024m
#
# Secrets (JWT keys, DB/AMQP creds) are sourced the same way as `just prod-up`;
# runner/run-benchmark.sh sources docker/.secrets before invoking compose.
name: bench-axiam

services:
  axiam-server:
    # Prefer the published multi-arch image so a benchmark run needs no local
    # source build — bumping BENCH_CPUS/BENCH_MEM then just restarts the same
    # image, which makes scaling the resource envelope up/down fast. The release
    # pipeline publishes ghcr.io/<owner>/<repo>/server:<version> (prereleases get
    # the exact version tag). `just bench-up` sets BENCH_AXIAM_IMAGE to the current
    # workspace version automatically; the literal below is only a fallback for a
    # raw `docker compose` invocation. Note GHCR packages are private by default —
    # `docker login ghcr.io` (or make the package public) to pull. Force a local
    # build instead with `just target=axiam build=1 bench-up`; the `build` block
    # below is also an automatic fallback when the image can't be pulled.
    image: ${BENCH_AXIAM_IMAGE:-ghcr.io/ilpanich/axiam/server:latest}
    pull_policy: ${BENCH_AXIAM_PULL_POLICY:-missing}
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.server
    container_name: bench-axiam-server
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEM:-2048m}
    ports:
      - "${BENCH_APP_PORT:-8090}:8090"
      - "${BENCH_GRPC_PORT:-50051}:50051"
    environment:
      AXIAM__DB__URL: "surrealdb:8000"
      AXIAM__DB__USERNAME: "${AXIAM__DB__USERNAME:?run via 'just bench-up' which bootstraps bench secrets}"
      AXIAM__DB__PASSWORD: "${AXIAM__DB__PASSWORD:?run via 'just bench-up' which bootstraps bench secrets}"
      AXIAM__DB__NAMESPACE: "axiam"
      # Aligned with docker/docker-compose.prod.yml (was "main").
      AXIAM__DB__DATABASE: "${AXIAM__DB__DATABASE:-axiam}"
      AXIAM__AMQP__URL: "amqps://${RABBITMQ_DEFAULT_USER:?required}:${RABBITMQ_DEFAULT_PASS:?required}@rabbitmq:5671"
      AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.pem"
      # A6: TLS on the broker hop, because AMQP is TLS-only and there is no
      # longer a flag that says otherwise.
      #
      # READ THIS BEFORE COMPARING A RUN ACROSS THIS CHANGE. This hop was
      # deliberately plaintext through run 5, on the reasoning that encrypting
      # synthetic load-test traffic taxes the very numbers the harness exists to
      # measure. That reasoning was not wrong, and the cost did not disappear —
      # it is now paid, and paid by the AXIAM target only, since the Keycloak
      # comparison target is unaffected by this file. Any AMQP-carrying figure
      # (async authz, audit ingestion) is therefore NOT directly comparable to
      # run 5 or earlier. Re-baseline before drawing a trend line through it.
      # AMQP master signing key (SECHRD-08 / D-05c): the release image mandates it
      # at startup (no unsigned code path), so this fails closed if unset. `just
      # bench-up` generates a stable hex key under docker/.secrets/ automatically.
      AXIAM__AMQP__SIGNING_KEY: "${AXIAM__AMQP__SIGNING_KEY:?run via 'just bench-up' which generates it under docker/.secrets/}"
      # Subsystem secrets (all set by 'just bench-up'). The AES-256-GCM keys +
      # GDPR HMAC pepper fail closed on a malformed value; the auth pepper is
      # mandatory at startup in the release image (OBS-1 — client secrets are a
      # keyed HMAC-SHA256 tag with no unkeyed fallback), so it fails closed too
      # and is NOT optional. Only the OIDC issuer URL is optional — empty means
      # "feature off".
      AXIAM__AUTH__MFA_ENCRYPTION_KEY: "${AXIAM__AUTH__MFA_ENCRYPTION_KEY:?run via 'just bench-up'}"
      # OPAQUE (RFC 9807). Both keys or neither — the server logs a warning and
      # leaves OPAQUE off if only one is present. Required for the two opaque_*
      # cells; see the `just bench-up` block that generates them, and seed.sh,
      # which bootstraps the bench tenant with `opaque_mode: optional` so the
      # endpoints answer 200 rather than the 404 a disabled tenant returns.
      AXIAM__AUTH__OPAQUE_SESSION_KEY: "${AXIAM__AUTH__OPAQUE_SESSION_KEY:?run via 'just bench-up'}"
      AXIAM__AUTH__OPAQUE_SETUP_KEY: "${AXIAM__AUTH__OPAQUE_SETUP_KEY:?run via 'just bench-up'}"
      AXIAM__EMAIL_ENCRYPTION_KEY: "${AXIAM__EMAIL_ENCRYPTION_KEY:?run via 'just bench-up'}"
      AXIAM__GDPR_PSEUDONYM_PEPPER: "${AXIAM__GDPR_PSEUDONYM_PEPPER:?run via 'just bench-up'}"
      AXIAM__AUTH__PEPPER: "${AXIAM__AUTH__PEPPER:?run via 'just bench-up' which generates it under docker/.secrets/ (OBS-1: mandatory in the release image)}"
      AXIAM__AUTH__OAUTH2_ISSUER_URL: "${AXIAM__AUTH__OAUTH2_ISSUER_URL:-}"
      # --- Argon2id hash gate (B1) ------------------------------------------------
      # Bounds concurrent Argon2id hash/verify ops (each ~19 MiB arena) to cap peak
      # RSS and shed load past capacity, closing an unauthenticated memory-DoS on the
      # login path. Pass-through-or-default so a plain `docker compose up` still runs.
      # 0 = auto → min(cores, 4). Set explicitly to exercise a specific value under load.
      AXIAM__AUTH__MAX_CONCURRENT_HASHES: "${AXIAM__AUTH__MAX_CONCURRENT_HASHES:-0}"
      # --- Session-cookie Secure attribute (H6, fixes H2 §8.3) --------------------
      # crates/axiam-auth/src/config.rs defaults cookie_secure=true, so
      # /api/v1/auth/login sets axiam_access/axiam_csrf/axiam_refresh with
      # `Secure`. k6's cookie jar (correctly) refuses to replay a Secure cookie
      # over http://, so on p0-plaintext EVERY scenario that calls
      # lib/auth.js::loginSession() — userinfo, authz_check_rest,
      # authz_batch_rest, oauth2_password_login — died in setup() with "no
      # axiam_access cookie", and no p0 cell for those scenarios in results/ was
      # ever real (curl and the seed smoke-check are unaffected, which is why it
      # went unnoticed). `just bench-up` sets this to "false" for p0-plaintext
      # ONLY; every TLS profile keeps the production-correct default of true.
      # This is a bench-harness accommodation for an http:// baseline, not a
      # posture change: p2/p3 cells still exercise the shipped behaviour.
      AXIAM__AUTH__COOKIE_SECURE: "${BENCH_AXIAM_COOKIE_SECURE:-true}"
      AXIAM__AUTH__HASH_ACQUIRE_TIMEOUT_SECS: "${AXIAM__AUTH__HASH_ACQUIRE_TIMEOUT_SECS:-5}"
      # --- Account lockout: NEUTRALIZED for benchmarking (D-06) -------------------
      # The shipped posture is max_failed_login_attempts=5, lockout_duration_secs=900,
      # backoff x2, capped at 3600 (crates/axiam-auth/src/config.rs). The harness has
      # ONE seeded user, and `scenarios/grpc_admin_validate.js` deliberately drives
      # `UserService/ValidateCredentials` with a WRONG password for that user ~10k
      # times per cell — Argon2id cost is the whole point of that scenario. D-06
      # accrual is always-on and shared by the REST and gRPC credential paths
      # (crates/axiam-auth/src/lockout.rs), so at the shipped threshold the account
      # locks about five iterations in. Two things then break:
      #
      #  1. COLLATERAL: every later login-based cell fails. In the alpha25 dry run
      #     that was oauth2_password_login, token_exchange, token_refresh,
      #     uma_ticket_grant, userinfo and userinfo_grpc — six cells reporting 401
      #     "invalid credentials", which reads as a broken seed or a target bug. The
      #     backoff escalates to an HOUR, so a re-seed inside the same stack does not
      #     clear it (create_or_find finds the locked user and leaves it locked).
      #  2. SELF-INVALIDATING: `validate_credentials` returns `invalid` BEFORE
      #     `verify_password` once `locked_until > now` (services/user.rs). So after
      #     the lock, grpc_admin_validate's remaining ~10k iterations skip Argon2id
      #     entirely and it measures the lockout short-circuit while still reporting
      #     gRPC OK — p95 2ms against the ~34ms a real Argon2id verify costs. The
      #     scenario silently stopped measuring the CPU guard it exists to measure.
      #
      # Neutralizing the THRESHOLD is not disabling the accrual: the D-06 code path
      # still runs on every failed check (that invariant is "never behind a config
      # flag" and this does not put it behind one) — the counter simply never reaches
      # a ceiling within a run. Same reasoning as login_per_min in the rate-limit
      # block below: a single-account, closed-loop capacity probe must not be
      # measuring an anti-abuse control sized for a human attacker.
      #
      # An operator who exports the real name wins, so `rl=prod`-style sensitivity
      # passes can still put the shipped lockout back deliberately.
      AXIAM__AUTH__MAX_FAILED_LOGIN_ATTEMPTS: "${AXIAM__AUTH__MAX_FAILED_LOGIN_ATTEMPTS:-1000000}"
      # --- Authz decision cache (D7) ----------------------------------------------
      # Default OFF (today's behavior). Flip ENABLED=true only for the labeled
      # cache-sensitivity pass — never for the head-to-head matrix.
      AXIAM__AUTHZ__DECISION_CACHE_ENABLED: "${AXIAM__AUTHZ__DECISION_CACHE_ENABLED:-false}"
      AXIAM__AUTHZ__DECISION_CACHE_TTL_SECS: "${AXIAM__AUTHZ__DECISION_CACHE_TTL_SECS:-5}"
      AXIAM__AUTHZ__DECISION_CACHE_MAX_ENTRIES: "${AXIAM__AUTHZ__DECISION_CACHE_MAX_ENTRIES:-10000}"
      # --- Authz batch strategy (D10/H3) ------------------------------------------
      # Default `coalesced` — MUST track the product default decided in H3/G3
      # (crates/axiam-authz/src/config.rs). The old `concurrent` fallback here
      # silently overrode the shipped default for the whole run-4 matrix (see
      # PRIVATE_BENCH_ANALYSIS.md §1.1 / task I14). Set `concurrent` only for
      # the labeled A/B sensitivity pass; decisions are identical either way.
      AXIAM__AUTHZ__BATCH_STRATEGY: "${AXIAM__AUTHZ__BATCH_STRATEGY:-coalesced}"
      AXIAM__AUTHZ__BATCH_MAX_CONCURRENCY: "${AXIAM__AUTHZ__BATCH_MAX_CONCURRENCY:-16}"
      # --- SurrealDB connection pool (F2/F3) --------------------------------------
      # Defaults (1 handle, cap disabled) are byte-for-byte the pre-pool behavior.
      # POOL_SIZE>1 / a positive MAX_IN_FLIGHT are the F3 sensitivity knobs.
      AXIAM__DB__POOL_SIZE: "${AXIAM__DB__POOL_SIZE:-1}"
      AXIAM__DB__POOL_MAX_IN_FLIGHT: "${AXIAM__DB__POOL_MAX_IN_FLIGHT:-0}"
      AXIAM__DB__POOL_ACQUIRE_TIMEOUT_SECS: "${AXIAM__DB__POOL_ACQUIRE_TIMEOUT_SECS:-5}"
      AXIAM__SERVER__HOST: "0.0.0.0"
      AXIAM__GRPC__HOST: "0.0.0.0"
      # --- A4/E4: gRPC strict session-revocation mode ----------------------
      # Shipped default is `false`: the gRPC data plane validates the JWT and
      # stops, so its revocation bound is the token's 15-minute lifetime —
      # which is a real part of why gRPC reads faster than REST, and is
      # documented as a posture choice rather than an oversight. Setting this
      # to "true" adds the session-revocation read to the interceptor (served
      # from the session-validation cache when that is enabled), matching
      # REST's posture.
      #
      # Listed here because compose forwards only the names in this block — a
      # shell `export` of a name absent from it reaches nothing, which is
      # exactly the J9 failure that cost run 5 its stage timings. The E4
      # strict-revocation cell exists to publish what this posture costs, so
      # the knob has to be reachable from `bench-up`.
      AXIAM__GRPC__STRICT_REVOCATION: "${AXIAM__GRPC__STRICT_REVOCATION:-false}"
      # --- I5: Nagle on the REST listener ---------------------------------
      # actix-web leaves the socket at its OS default (Nagle ON) unless told
      # otherwise; tonic sets TCP_NODELAY itself. Shipped default is `true`.
      # Set to "false" to reproduce the pre-I5 behaviour for the run-5 A/B —
      # this MUST be listed here or a shell `export` never reaches the
      # container (compose forwards only the names in this block).
      AXIAM__SERVER__TCP_NODELAY: "${AXIAM__SERVER__TCP_NODELAY:-true}"
      # --- I6: session-validation cache ------------------------------------
      # Shipped default is 0 = OFF. The run-5 I6 matrix needs it set to a
      # non-zero TTL (5) or the cell measures nothing new. The server logs a
      # WARN naming the active TTL at startup; its absence means it is off.
      AXIAM__AUTH__SESSION_VALIDATION_CACHE_TTL_SECS: "${AXIAM__AUTH__SESSION_VALIDATION_CACHE_TTL_SECS:-0}"
      # First-run bootstrap gate (D-03a): satisfies the fail-closed admin gate so
      # runner/seed.sh can POST /api/v1/admin/bootstrap without a setup_token.
      # Bench-only; the production compose deliberately does not preset this.
      AXIAM_BOOTSTRAP_ADMIN_EMAIL: "${BENCH_ADMIN_EMAIL:-admin@bench.dev}"
      AXIAM__AUTH__JWT_PRIVATE_KEY_PEM: "${AXIAM__AUTH__JWT_PRIVATE_KEY_PEM:?required}"
      AXIAM__AUTH__JWT_PUBLIC_KEY_PEM: "${AXIAM__AUTH__JWT_PUBLIC_KEY_PEM:?required}"
      # --- Rate limits: NEUTRALIZED by default for benchmarking ------------------
      # k6 drives all load from a SINGLE source IP. AXIAM's per-IP rate limiter
      # (crates/axiam-api-rest/src/config/rate_limit.rs — login 10/min, token
      # 20/min, introspect 10/min, authz 300/min; gRPC 100/s in
      # crates/axiam-api-grpc/src/config.rs) would therefore throttle every
      # scenario except the unlimited JWKS endpoint to a trickle of 200s and a
      # flood of 429s — the benchmark would measure the 429 path, not endpoint
      # capacity. Competitors (Keycloak/Zitadel) ship no per-IP limit by default,
      # so an active limiter also makes head-to-head numbers apples-to-oranges.
      #
      # Each var is pass-through-or-neutralize: if the operator exported the real
      # AXIAM__… name (e.g. via `just rl=prod … bench-up`) that value wins;
      # otherwise it defaults to 1,000,000 (effectively unlimited; well within
      # u32 and RateLimitConfig::validate's >=1 floor). A raw `docker compose up`
      # is therefore neutralized too. AXIAM_BENCH_RL_POSTURE is a non-functional
      # label the server ignores — runner/run-benchmark.sh reads it back via
      # `docker inspect` to stamp each meta.json so report.py can refuse to
      # compare mixed postures.
      AXIAM_BENCH_RL_POSTURE: "${AXIAM_BENCH_RL_POSTURE:-neutralized}"
      AXIAM__RATE_LIMIT__LOGIN_PER_MIN: "${AXIAM__RATE_LIMIT__LOGIN_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__REGISTER_PER_MIN: "${AXIAM__RATE_LIMIT__REGISTER_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__TOKEN_PER_MIN: "${AXIAM__RATE_LIMIT__TOKEN_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__PASSWORD_RESET_PER_MIN: "${AXIAM__RATE_LIMIT__PASSWORD_RESET_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__MFA_PER_MIN: "${AXIAM__RATE_LIMIT__MFA_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__INTROSPECT_PER_MIN: "${AXIAM__RATE_LIMIT__INTROSPECT_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__REVOKE_PER_MIN: "${AXIAM__RATE_LIMIT__REVOKE_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__AUTHZ_CHECK_PER_MIN: "${AXIAM__RATE_LIMIT__AUTHZ_CHECK_PER_MIN:-1000000}"
      # The eight families above were the whole neutralized posture until the
      # alpha25 dry run, and that was a silent hole: RateLimitConfig has SIXTEEN
      # per-family knobs, and every family this block forgot stayed at its
      # SHIPPED default while the harness reported "rate limits: NEUTRALIZED".
      # Since every scenario here is a closed-loop `ramping-vus` capacity probe,
      # a forgotten family does not throttle a little — it throttles totally:
      # device_authorization (12/min) and device_verify (10/min) spend the whole
      # minute's quota in the first ~200ms, so `device_authorization`,
      # `device_flow_poll` and `device_verify` measured nothing but the 429 path
      # (33 612/33 622 rejected). token_exchange/uma/par/end_session/scim were
      # the same bug waiting for their scenario to get far enough to hit it.
      #
      # Rule for whoever adds the seventeenth family: a knob that exists in
      # rate_limit.rs and is missing here is a hole, not a default. Neutralizing
      # is not a judgement about how the endpoint should be sized in production
      # — `rl=prod` is what measures the shipped posture. These are deliberately
      # neutralized despite their field docs saying "not sized from capacity"
      # (device_*) or "never preset" (scim, end_session), for exactly the reason
      # login_per_min is: at `rl=neutralized` the limiter must be out of the way
      # so the number on the other side is the endpoint's, not the governor's.
      AXIAM__RATE_LIMIT__TOKEN_EXCHANGE_PER_MIN: "${AXIAM__RATE_LIMIT__TOKEN_EXCHANGE_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__END_SESSION_PER_MIN: "${AXIAM__RATE_LIMIT__END_SESSION_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__PAR_PER_MIN: "${AXIAM__RATE_LIMIT__PAR_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__UMA_PERM_PER_MIN: "${AXIAM__RATE_LIMIT__UMA_PERM_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__UMA_TICKET_PER_MIN: "${AXIAM__RATE_LIMIT__UMA_TICKET_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__DEVICE_AUTHORIZATION_PER_MIN: "${AXIAM__RATE_LIMIT__DEVICE_AUTHORIZATION_PER_MIN:-1000000}"
      AXIAM__RATE_LIMIT__SCIM_PER_MIN: "${AXIAM__RATE_LIMIT__SCIM_PER_MIN:-1000000}"
      # AXIAM__RATE_LIMIT__DEVICE_VERIFY_PER_MIN is DELIBERATELY ABSENT — do not
      # "complete" the list by adding it. `RateLimitConfig::validate` asserts the
      # OWASP user-code bound, `charset^len / (rate x lifetime) > 10^6`, and with
      # a 20-character alphabet, an 8-character code and a 600s grant that caps
      # the knob at 2559/min. Setting it to 1000000 does not throttle the
      # benchmark — it makes the SERVER REFUSE TO BOOT:
      #
      #   thread 'main' panicked at crates/axiam-api-rest/src/config/rate_limit.rs
      #   device_verify_per_min=1000000 leaves only 2560 expected guesses against
      #   a live user code over its 600s lifetime — below the 10^6 bar.
      #
      # That is the guard working, not a bug to route around. The endpoint is a
      # brute-force surface against a space a human has to be able to type, so
      # there is no setting at which `device_verify` becomes a capacity
      # measurement, and the shipped 10/min is left in place so what the run
      # records is the real ceiling. `runner/run-benchmark.sh`'s dry-run grader
      # lists `device_verify` in EXPECTED_THROTTLE for this reason.
      #
      # 2559 (the largest legal value) was considered and rejected: it is still
      # far below what a ramping-vus scenario offers, so it buys no measurement,
      # and it would label a posture "neutralized" that matches neither the
      # shipped configuration nor an unlimited one — the mixed-posture confusion
      # AXIAM_BENCH_RL_POSTURE and report.py exist to prevent. It would also
      # silently rot if USER_CODE_LEN, the charset or the grant lifetime moved.
      AXIAM__GRPC__GRPC_AUTHZ_PER_SEC: "${AXIAM__GRPC__GRPC_AUTHZ_PER_SEC:-1000000}"
      # I2: the gRPC limiter is per-method-family. Unset, identity derives as
      # 5x authz and admin as 1x authz inside the server; neutralized runs
      # therefore stay unlimited either way. Pinned here so `rl=prod` can set
      # all three explicitly and rl-prod-check can assert each family — a
      # server-wide assertion would not have caught the I2 scoping bug.
      AXIAM__GRPC__GRPC_IDENTITY_PER_SEC: "${AXIAM__GRPC__GRPC_IDENTITY_PER_SEC:-5000000}"
      AXIAM__GRPC__GRPC_ADMIN_PER_SEC: "${AXIAM__GRPC__GRPC_ADMIN_PER_SEC:-1000000}"
      RUST_LOG: "${RUST_LOG:-axiam=warn}"
    volumes:
      # A6: read-only CA bundle for verifying the broker certificate.
      - ../../../docker/.secrets/broker-tls/ca.pem:/etc/axiam/broker-tls/ca.pem:ro
    depends_on:
      surrealdb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/axiam-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"
    networks: [bench]

  # Profile-driven TLS terminator. Enabled only for the `tls` compose profile
  # (p1/p2/p3). The runner selects which nginx conf to mount via BENCH_NGINX_CONF
  # (tls12.conf | tls13.conf | mtls.conf) and mounts the test certs read-only.
  tls-edge:
    image: nginx:1.27-alpine
    container_name: bench-axiam-tls
    profiles: ["tls"]
    cpus: ${BENCH_EDGE_CPUS:-1}
    mem_limit: ${BENCH_EDGE_MEM:-128m}
    ports:
      - "${BENCH_TLS_PORT:-8443}:8443"
      # H6: the cleartext control listener (tls/_plain-control.inc), present
      # only in the two p2 confs. Publishing it unconditionally is harmless for
      # the confs that don't define an :8080 vhost — Docker will happily
      # publish a port nothing is listening on.
      - "${BENCH_EDGE_PLAIN_PORT:-18080}:8080"
    volumes:
      - ../../profiles/certs:/certs:ro
      # H6: the whole tls/ dir is mounted OUTSIDE conf.d (so nginx does not
      # auto-include every conf here) purely so each selected conf can
      # `include /etc/nginx/bench-tls/_upstream.inc;` — one shared, keep-alive
      # upstream definition instead of four copies that can drift. See that
      # file for why per-request backend connections were a real measurement
      # defect and not a style point.
      - ./tls:/etc/nginx/bench-tls:ro
      - ./tls/${BENCH_NGINX_CONF:-tls13.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      axiam-server: { condition: service_healthy }
    restart: "no"
    networks: [bench]

  surrealdb-init:
    image: busybox
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod -R u+rwX /data"]
    volumes:
      - surrealdb-data:/data
    restart: "no"

  surrealdb:
    # A9: surrealdb/surrealdb:v3 is a floating tag — it can point at a different
    # build over time, which breaks provenance ("what exactly did this run
    # measure against?"). No network/registry access is available where this
    # override was authored, so a real digest can't be resolved and pinned
    # here without risking a fabricated (unpullable) sha256. Instead, pin it
    # at run time: pull once, resolve the digest, then export
    # BENCH_SURREALDB_IMAGE to override this default, e.g.:
    #   docker pull surrealdb/surrealdb:v3
    #   export BENCH_SURREALDB_IMAGE="surrealdb/surrealdb@$(docker inspect --format '{{index .RepoDigests 0}}' surrealdb/surrealdb:v3 | cut -d@ -f2)"
    # (run-benchmark.sh's meta.json also now records image_id/build_ref as a
    # fallback identifier for whatever tag actually ran — see A9 in
    # claude_dev/benchmark-improvement-plan.md.)
    image: ${BENCH_SURREALDB_IMAGE:-surrealdb/surrealdb:v3}
    container_name: bench-axiam-surrealdb
    cpus: ${BENCH_DB_CPUS:-2}
    mem_limit: ${BENCH_DB_MEM:-1024m}
    depends_on:
      surrealdb-init: { condition: service_completed_successfully }
    command: start --user ${AXIAM__DB__USERNAME:?required} --pass ${AXIAM__DB__PASSWORD:?required} --log warn surrealkv:/data/axiam.db
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"
    networks: [bench]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bench-axiam-rabbitmq
    cpus: ${BENCH_MQ_CPUS:-1}
    mem_limit: ${BENCH_MQ_MEM:-512m}
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?required}"
    volumes:
      # A6: AMQPS-only listener, plaintext listener off — the same config file
      # the dev, e2e and CI brokers use. `just bench-up` mints the material.
      - ../../../docker/.secrets/broker-tls:/etc/rabbitmq/tls:ro
      - ../../../docker/rabbitmq-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"
    networks: [bench]

volumes:
  surrealdb-data:

networks:
  bench:
    driver: bridge
