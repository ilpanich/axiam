# p1-tls12: TLS 1.2, broad GCM cipher set, server-auth only.
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://axiam-server:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Real client IP for the rate limiters. Without it the server keys every
        # request on the nginx container address — see docs/security-profiles.md
        # "Client IP and the rate limiters" for why that is silent and why
        # TRUSTED_HOPS=0 is the matching setting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
