# p2-tls13 h1 control (B2/H6): TLS 1.3 only, server-auth, HTTP/1.1 only.
#
# IDENTICAL to `tls13.conf` except that `http2 on;` is omitted, so the edge
# offers only `http/1.1` over ALPN. These two files are the controlled pair
# that isolates h1-vs-h2: same nginx process, same TLS stack, same proxy hop,
# same upstream keep-alive, same logging — the ONLY difference on the wire is
# the negotiated protocol. If you change one, change the other.
#
# Why this exists at all: AXIAM's own TLS listener cannot be made h1-only.
# actix-http unconditionally prepends `h2` to the rustls ALPN list
# (actix-http-3.13.1 src/service.rs:747), so `AXIAM__SERVER__TLS__HTTP2=false`
# was a no-op and is now a hard startup error — see
# claude_dev/b2-tls-h2-investigation.md §1.1. An edge is the only way to get an
# http/1.1-only TLS 1.3 endpoint in front of this server.
#
# Select it with (an env var, not a just variable — bench-up sees it set and
# takes the nginx-fronted p2 path instead of the native-TLS overlay):
#
#     BENCH_NGINX_CONF=tls13-h1.conf just target=axiam profile=p2-tls13 bench-up
#
# Do NOT trust the conf filename as evidence of what ran: read the report's
# `http` column (`bench_http_proto`, added in H6). This cell must read `1.1`
# and `tls13.conf`'s must read `2.0`; anything else voids the comparison.
# G8's summary column read `?` for every cell, which is how a conviction got
# built on which file we believed nginx had loaded.

include /etc/nginx/bench-tls/_upstream.inc;
include /etc/nginx/bench-tls/_plain-control.inc;

server {
    listen 8443 ssl;
    server_name localhost;
    # http2 intentionally omitted -> HTTP/1.1 only over TLS 1.3.

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets on;
    ssl_session_cache shared:BENCHTLS:10m;
    ssl_session_timeout 1h;

    keepalive_requests 1000000;
    keepalive_timeout 300s;

    access_log off;

    location / {
        proxy_pass http://axiam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
