# p2-tls13: TLS 1.3 only, server-auth, HTTP/2 enabled at the edge.
#
# H6 pairing rule: this file and `tls13-h1.conf` MUST stay identical except for
# the single `http2 on;` line. They are the controlled pair that isolates
# h1-vs-h2 (same edge process, same TLS stack, same proxy hop, same upstream
# keep-alive) — the comparison G8 never actually ran, because it compared an
# nginx h1 edge against AXIAM's own in-process h2 listener and so folded
# "nginx + a proxy hop + h1" versus "actix + h2" into a single number.
# If you change one, change the other.

include /etc/nginx/bench-tls/_upstream.inc;
include /etc/nginx/bench-tls/_plain-control.inc;

server {
    listen 8443 ssl;
    server_name localhost;
    http2 on;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.3;
    # TLS 1.3 session resumption (tickets) is on by default; stated explicitly
    # so the h1/h2 pair cannot differ in resumption behaviour by accident.
    ssl_session_tickets on;
    ssl_session_cache shared:BENCHTLS:10m;
    ssl_session_timeout 1h;

    # H6: client-side keep-alive. nginx's default keepalive_requests is 1000,
    # so a 50-VU cell at ~1 000 ops/s closes and re-opens every client
    # connection roughly once a minute — a perturbation that lands differently
    # on h1 (n connections) than on h2 (one connection carrying n streams),
    # i.e. precisely on the axis being measured.
    keepalive_requests 1000000;
    keepalive_timeout 300s;

    # Access logging is a synchronous write per request in the default config,
    # and is pure edge overhead the AXIAM-native cells never pay.
    access_log off;

    location / {
        proxy_pass http://axiam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Response buffering makes nginx read the whole upstream response
        # before writing to the client. For the small JSON bodies every bench
        # scenario returns that only adds a copy.
        proxy_buffering off;
    }
}
