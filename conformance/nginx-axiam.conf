# conformance/nginx-axiam.conf — the AXIAM conformance target's front door.
#
# WHY THIS FILE EXISTS
#
# The first real conformance run (2026-09-08) finished 35 Basic OP modules in
# `WAITING` and 30 FAPI 2.0 modules `INTERRUPTED`. Neither verdict is an
# assertion about AXIAM: both mean the browser never completed the login hop.
# `/oauth2/authorize` answers an unauthenticated request by redirecting to
# `LOGIN_PATH` — a same-origin `/login` — and the `axiam-server` binary does
# not serve that route. The admin SPA does. So a conformance target has to
# serve the SPA and the API on ONE origin, which is what this does.
#
# WHY THE BACKEND IS NOT SIMPLY BEHIND THIS PROXY
#
# Because that would trade 65 stalled modules for 31 failing ones.
# `axiam_oauth2::mtls` refuses the `X-Client-Certificate` proxy header for
# OAuth2 client authentication *by construction* — there is no configuration
# that enables it — because FAPI 2.0 requires the authorization server itself
# to authenticate the client, and a header is forgeable by anything that can
# reach the server. Terminating TLS here would therefore make `tls_client_auth`
# and `self_signed_tls_client_auth` unauthenticatable.
#
# The product already has the answer, and it is the one RFC 8705 §5 designed:
# `mtls_endpoint_aliases`. This proxy owns the FRONT channel on the issuer
# origin — the SPA, `/login`, `/consent`, `/oauth2/authorize`, `/.well-known`
# and the admin API. `axiam-server` keeps its own rustls listener on
# AXIAM_MTLS_PORT for the BACK channel, where the peer certificate is verified
# during the TLS 1.3 handshake exactly as it is in production. Discovery
# advertises the split through `AXIAM__AUTH__OAUTH2_MTLS_BASE_URL`.
#
# One consequence worth stating: `/oauth2/` is proxied here in full, not just
# the front-channel members. The Basic OP plan's clients authenticate with a
# secret and have no certificate at all, so their token requests arrive on THIS
# listener; RFC 8705 §5 aliases are an instruction to mTLS clients, not a
# relocation of the endpoint. Both listeners serve `/oauth2/token`; only one of
# them can see a client certificate, and only mTLS clients are told to use it.
#
# Rendered by the stock nginx entrypoint's envsubst pass. Only `AXIAM_`-prefixed
# names are substituted (NGINX_ENVSUBST_FILTER in docker-compose.yml), so
# nginx's own `$host`, `$uri` and `$proxy_add_x_forwarded_for` survive — the
# same guard docker/nginx.conf.template documents at length.

server {
    listen 8444 ssl;
    http2 on;
    server_name _;

    # The same certificate axiam-server presents on the mTLS listener. It is
    # minted by gen-certs.sh with host.docker.internal, localhost,
    # localhost.emobix.co.uk, 127.0.0.1 and the docker bridge gateway in its
    # SAN, so the suite (inside a container, dialling the gateway name) and the
    # harness scripts (on the host, dialling localhost) both verify normally.
    # Neither side needs `curl -k`, and a run that quietly stopped verifying is
    # a run that proves less than it appears to.
    ssl_certificate     /etc/axiam/certs/server.crt;
    ssl_certificate_key /etc/axiam/certs/server.key;
    ssl_protocols TLSv1.3;

    # Deliberately NO ssl_client_certificate / ssl_verify_client. This listener
    # must not ask for a client certificate: the Basic OP plan's clients have
    # none, and a request for one would be answered by some TLS stacks with an
    # aborted handshake rather than an empty certificate list. Client
    # certificates belong to the mTLS listener, which is axiam-server itself.

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors docker/nginx.conf.template. A certification target should look
    # like the product; 'wasm-unsafe-eval' in particular is what lets the admin
    # UI instantiate the OPAQUE WebAssembly client, and without it the login
    # page degrades in a way that is invisible until a sign-in fails.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # SPA fallback. This single line is what turns 65 `WAITING`/`INTERRUPTED`
    # modules into modules that can actually reach an assertion.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass https://host.docker.internal:${AXIAM_MTLS_PORT};
        include /etc/nginx/axiam-backend.inc;
    }

    # The trailing slash is load-bearing and the reason is recorded in
    # docker/nginx.conf.template: `location /oauth2` is a PREFIX match that also
    # captures `/oauth2-clients`, the admin UI's own SPA route, and proxies it
    # to a backend with no such endpoint. Every backend OAuth2 endpoint lives
    # under `/oauth2/`.
    location /oauth2/ {
        proxy_pass https://host.docker.internal:${AXIAM_MTLS_PORT};
        include /etc/nginx/axiam-backend.inc;
    }

    location /.well-known {
        proxy_pass https://host.docker.internal:${AXIAM_MTLS_PORT};
        include /etc/nginx/axiam-backend.inc;
    }

    # SCIM 2.0. NOT in docker/nginx.conf.template, and deliberately so there: a
    # provisioning client is a back-office integration that talks to the
    # backend directly, not something the admin UI proxies. It is here because
    # `register-user.sh` gives the conformance user a phone number and an
    # address over SCIM PATCH, and every harness script is pointed at one
    # origin. Without it nginx answered the PATCH from the SPA fallback with
    # `405 Not Allowed`, which reads as a server bug and is a missing location
    # block.
    location /scim {
        proxy_pass https://host.docker.internal:${AXIAM_MTLS_PORT};
        include /etc/nginx/axiam-backend.inc;
    }

    # Liveness and readiness, so an operator can ask the front door whether the
    # thing behind it is up without needing to know the back channel's port.
    location = /health {
        proxy_pass https://host.docker.internal:${AXIAM_MTLS_PORT};
        include /etc/nginx/axiam-backend.inc;
    }

    location = /ready {
        proxy_pass https://host.docker.internal:${AXIAM_MTLS_PORT};
        include /etc/nginx/axiam-backend.inc;
    }
}
