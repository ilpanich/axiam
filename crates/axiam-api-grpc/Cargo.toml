[package]
name = "axiam-api-grpc"
description = "AXIAM gRPC API built with Tonic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiam-core = { workspace = true }
axiam-authz = { workspace = true }
axiam-auth = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
secrecy = { workspace = true }
axiam-db = { workspace = true }
# X1 / R2.3 — ReactorAdminService reuses `axiam_amqp::reactor::gate::recent_health`
# (the same per-reactor health query the REST admin handler calls) rather than
# duplicating it, so both transports report identical numbers. This crate stays
# broker-agnostic in every other respect: only the health-query function and its
# constants are used, never a connection or a transport.
axiam-amqp = { workspace = true }
# X5.1 — the interceptor computes an `x5t#S256` thumbprint over the peer
# certificate to enforce RFC 8705 §3.2 token binding. One SHA-256 plus a
# base64url encode; deliberately NOT a dependency on axiam-oauth2, which would
# drag the whole authorization server in for one digest.
base64 = { workspace = true }
sha2 = { workspace = true }
surrealdb = { workspace = true }
futures = { version = "0.3.32", default-features = false, features = ["std"] }

[features]
client = []

[dev-dependencies]
axiam-test-support = { workspace = true }
axiam-auth = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
# Test-only: runtime-generates the self-signed TLS leaf cert/key used by the
# TLS-enabled `start_grpc_server` boot test, instead of a hard-coded PEM
# literal (avoids static secret-scanner false positives).
rcgen = { workspace = true }
# Test-only: installs the process-level rustls CryptoProvider (mirrors
# axiam-server's main()) so the TLS-enabled `start_grpc_server` boot test
# doesn't hit "Could not automatically determine the process-level
# CryptoProvider" — tonic's `ServerTlsConfig` resolves the default provider,
# and two providers (ring + aws-lc-rs) are linked transitively with none
# installed by default in a bare test binary.
rustls = { workspace = true, features = ["ring"] }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

# The gRPC authz integration tests need generated client stubs, which are only
# produced under the `client` feature (build.rs gates on CARGO_FEATURE_CLIENT).
# `required-features` makes Cargo SKIP this target when the feature is off
# (so `cargo test --workspace` compiles cleanly) and build+run it when the
# feature is enabled (`cargo test -p axiam-api-grpc --features client`).
[[test]]
name = "grpc_authz_test"
required-features = ["client"]

[[test]]
name = "grpc_auth_test"
required-features = ["client"]

[[test]]
name = "grpc_userinfo_test"
required-features = ["client"]

[[test]]
name = "grpc_reactor_test"
required-features = ["client"]
