[package]
name = "axiam-api-grpc"
description = "AXIAM gRPC API built with Tonic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiam-core = { workspace = true }
axiam-authz = { workspace = true }
axiam-auth = { workspace = true }
# `tls-ring` is still required after R-1, though tonic no longer terminates
# TLS here. It is the only published feature that turns on tonic's `_tls-any`,
# which gates BOTH the things this crate still needs from it: the `Connected`
# impl for `tokio_rustls::server::TlsStream` (how the peer address reaches the
# rate limiter — `transport/server/conn.rs:106`) and the `TlsConnectInfo` type
# `middleware::rate_limit` reads it back out of. `tls-connect-info` alone
# provides the impl but not the exported type.
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
tower = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
secrecy = { workspace = true }
axiam-db = { workspace = true }
# X1 / R2.3 — ReactorAdminService reuses `axiam_amqp::reactor::gate::recent_health`
# (the same per-reactor health query the REST admin handler calls) rather than
# duplicating it, so both transports report identical numbers. This crate stays
# broker-agnostic in every other respect: only the health-query function and its
# constants are used, never a connection or a transport.
axiam-amqp = { workspace = true }
# X5.1 — the interceptor computes an `x5t#S256` thumbprint over the peer
# certificate to enforce RFC 8705 §3.2 token binding. One SHA-256 plus a
# base64url encode; deliberately NOT a dependency on axiam-oauth2, which would
# drag the whole authorization server in for one digest.
base64 = { workspace = true }
sha2 = { workspace = true }
surrealdb = { workspace = true }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
# R-1 / T-234 — this listener terminates TLS itself rather than handing tonic a
# `ServerTlsConfig`, which accepts neither a `rustls::ServerConfig` nor a
# certificate resolver and therefore cannot express either a reloadable leaf or
# a TLS-1.3-only pin. `rustls` appears in the PUBLIC api (`GrpcTls::Rustls`)
# because the composition root, which owns the resolver, builds the config.
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[features]
client = []

[dev-dependencies]
axiam-test-support = { workspace = true }
axiam-auth = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
# Test-only: runtime-generates the self-signed TLS leaves the round-trip tests
# in tests/grpc_server_test.rs use (renewal mid-flight, a TLS 1.2 client
# refused, the peer address recovered through TLS, a handshake flood), instead
# of hard-coded PEM literals — which static secret scanners flag.
#
# rustls and tokio-rustls are no longer dev-dependencies: since R-1 the server
# side depends on both directly (see [dependencies] above), and the client
# halves of those tests use the same two crates.
rcgen = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

# The gRPC authz integration tests need generated client stubs, which are only
# produced under the `client` feature (build.rs gates on CARGO_FEATURE_CLIENT).
# `required-features` makes Cargo SKIP this target when the feature is off
# (so `cargo test --workspace` compiles cleanly) and build+run it when the
# feature is enabled (`cargo test -p axiam-api-grpc --features client`).
[[test]]
name = "grpc_authz_test"
required-features = ["client"]

[[test]]
name = "grpc_auth_test"
required-features = ["client"]

[[test]]
name = "grpc_userinfo_test"
required-features = ["client"]

[[test]]
name = "grpc_reactor_test"
required-features = ["client"]
