[package]
name = "axiam-auth"
description = "AXIAM authentication: password hashing, JWT, MFA"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiam-core = { workspace = true }
argon2 = { workspace = true }
# hash_password (src/password.rs) generates the Argon2 salt with
# argon2::password_hash::rand_core::OsRng, which only exists when rand_core 0.6's
# `getrandom` feature is enabled. Declare it here so axiam-auth builds standalone
# instead of relying on feature unification from api-rest/pki/server.
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { workspace = true }
totp-rs = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
# X5.1 — `CnfClaim` appears in the OpenAPI-documented introspection response
# (RFC 8705 §3.3), so it needs a schema like every other wire-visible type.
utoipa = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { workspace = true }
secrecy = { workspace = true }
url = { workspace = true }
webauthn-rs = { workspace = true }
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "std"] }
sha2_v10 = { version = "0.10", package = "sha2" }
axiam-opaque = { version = "1.0.0-alpha32", path = "../axiam-opaque" }
# webauthn-rs-proto: removed — only webauthn-rs is used directly in axiam-auth; types come through webauthn-rs re-exports

[dev-dependencies]
axiam-test-support = { workspace = true }
axiam-db = { workspace = true }
criterion = { version = "0.8.2", features = ["html_reports"] }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio-test = { workspace = true }
getrandom = "0.4.3"
wiremock = "0.6.5"
serde_json.workspace = true

[[bench]]
name = "auth_bench"
harness = false
