[package]
name = "axiam-db"
description = "AXIAM SurrealDB repository implementations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiam-core = { workspace = true }
axiam-auth = { workspace = true }
# X3 wave 2: the MDS ingestion orchestrator (`mds_ingest`) ties axiam-pki's
# BLOB fetch/verify pipeline to this crate's `MdsRepository` storage. axiam-pki
# depends only on axiam-core in its regular dependencies (its `axiam-db` dep is
# dev-only, for its own tests), so this direction is acyclic — mirrors the
# already-shipped axiam-db -> axiam-auth relationship.
axiam-pki = { workspace = true }
argon2 = { workspace = true }
surrealdb = { workspace = true, features = ["protocol-http"] }
arc-swap = { workspace = true }
surrealdb-types = "3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }  # used via <axiam-pki> re-export pattern; do not remove
sha2 = { workspace = true }
hex = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
axiam-test-support = { workspace = true }
# `kv-surrealkv` alongside `kv-mem` is not redundancy. `kv-mem` is fast and is
# right for the ~40 test binaries that assert behaviour rather than isolation,
# but it does NOT reliably serialise concurrent read-modify-writes: measured on
# SurrealDB 3.2.3 with `tools/surreal-race-probe`, it admits two winners to a
# guarded single-use `UPDATE` in ~1% of contended rounds, where `surrealkv`
# (what `docker-compose.prod.yml` and the k8s StatefulSet run) admits none in
# 40 000 attempts. Tests that assert "exactly one winner" therefore open a
# surrealkv datastore via `tests/common`, so they are measuring the engine we
# actually ship.
surrealdb = { workspace = true, features = ["kv-mem", "kv-surrealkv"] }
tempfile = "3"
tokio-test = { workspace = true }
