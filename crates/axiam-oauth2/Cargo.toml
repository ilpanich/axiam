[package]
name = "axiam-oauth2"
description = "AXIAM OAuth2 authorization server and OpenID Connect provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiam-core = { workspace = true }
axiam-auth = { workspace = true }
axiam-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
utoipa = { workspace = true }
subtle = { workspace = true }
# X5.1 — RFC 8705 client authentication reads the subject DN and SANs out of
# the certificate rustls already verified during the handshake.
x509-parser = { workspace = true }
# X5.1 second half — a `jwks_uri` on an OAuth2 client is the same threat
# surface as a federated IdP's, so it is fetched through the SAME cache: TTL,
# stale-while-revalidate, and the SEC-054 SSRF guard. `default-features = false`
# leaves samael/libxml out of this crate's graph; only `jwks_cache` is needed
# and it is in the OIDC (non-SAML) half.
axiam-federation = { workspace = true, default-features = false }
reqwest = { workspace = true }

[dev-dependencies]
# X4 external-exchange unit tests mint an Ed25519 keypair for the AuthConfig
# under test, the same way every other crate's token tests do.
rcgen = { workspace = true }
# R5.3 (X2 test gap) — property test: an RPT can never carry a
# (resource, scope) pair the live engine would deny at mint time
# (tests/uma_rpt_deny_property_test.rs).
proptest = { workspace = true }
