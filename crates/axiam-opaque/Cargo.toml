[package]
name = "axiam-opaque"
version.workspace = true
edition.workspace = true
# Explicit, NOT `workspace = true`, and this is the one crate in the workspace
# where that matters.
#
# axiam-opaque is vendored into the Rust SDK, whose MSRV is 1.88 and is CI-
# enforced. Inheriting the workspace's 1.93 made that SDK's MSRV job fail with
# "axiam-opaque requires rustc 1.93" — a floor nothing in this crate actually
# needs: its only non-trivial dependency, opaque-ke, declares 1.85, and the
# rest of the tree is far below.
#
# So this states the crate's real floor. Raising it is a breaking change for
# every SDK that vendors or depends on it, which is exactly the kind of thing
# that should be a deliberate edit here rather than a side effect of bumping
# the server's toolchain.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "AXIAM's OPAQUE (RFC 9807) ciphersuite, key-stretching functions and client operations"
readme = "README.md"

[dependencies]
# RFC 9807, independently audited. Pinned to a patch range rather than a caret
# range because the wire format is a cross-language contract: a minor bump that
# changed a byte would break every SDK at once, silently.
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "std"] }
# opaque-ke 4.0.1 is built on the digest 0.10 generation of RustCrypto while the
# AXIAM workspace has moved to 0.11. Both are in the tree; the aliases keep it
# unambiguous which is meant at each use site.
sha2_v10 = { version = "0.10", package = "sha2" }
# Only the raw KDF is used here (hash_password_into), never the PHC string
# API. argon2 0.6 turned `getrandom` into a default feature, which drags
# getrandom 0.4 into the wasm32-unknown-unknown build of axiam-opaque-wasm,
# where it fails to compile without a JS backend. Take only `alloc`, which
# is all hash_password_into needs; axiam-auth still enables the full
# feature set for its own use on native targets.
argon2 = { workspace = true, features = ["alloc"] }
scrypt = "0.12"
hex = { workspace = true }
thiserror = { workspace = true }
rand08 = { version = "0.8", package = "rand", features = ["getrandom"] }

[lints]
workspace = true

[dev-dependencies]
getrandom = "0.4.3"
serde_json.workspace = true
