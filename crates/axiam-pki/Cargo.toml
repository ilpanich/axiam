[package]
name = "axiam-pki"
description = "AXIAM PKI — Certificate management, CA operations, and GnuPG integration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axiam-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
x509-parser = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
# Required: pgp/rsa crate uses rand_core 0.6 CryptoRng; do not upgrade until upstream
rand_core = { version = "0.6", features = ["getrandom"] }
# RSA-4096 certificate key generation. rcgen delegates to *ring*, which
# implements RSA signing but deliberately implements no RSA key *generation*, so
# `KeyPair::generate_for(&PKCS_RSA_SHA256)` fails outright. This supplies the
# missing half: the key is generated here and handed to rcgen as PKCS#8 DER
# (see `crypto::generate_keypair`). Already in Cargo.lock via `pgp`, so this
# promotes an existing dependency edge rather than adding a crate.
rsa = { version = "0.9", features = ["pem"] }
base64 = { workspace = true }
pgp = { workspace = true }
zeroize = { workspace = true }
smallvec = "1"
time = "0.3"
# D2 (X3): shared SSRF guard, lifted from axiam-federation — outbound
# fetch (MDS BLOB, and federation's discovery/JWKS/token/SAML metadata via
# the re-export in axiam-federation::ssrf).
reqwest = { workspace = true }
url = { workspace = true }
# D1/D4 (X3): FIDO MDS3 BLOB is a signed JWT; parse header/payload and verify
# the RS256 signature over it.
jsonwebtoken = { workspace = true }
# D1/D3 (X3): parse the vendored root anchor and x5c chain entries from PEM.
pem = { workspace = true }

[dev-dependencies]
axiam-db = { workspace = true }
# Test-only: a real HTTP server for the Vault CA key store's request paths, so
# the URL, headers, body shape and status handling are exercised rather than
# only the string that builds the URL. Already a dev-dependency of five other
# crates in this workspace.
wiremock = "0.6"

criterion = { version = "0.8.2", features = ["html_reports"] }
surrealdb = { workspace = true, features = ["kv-mem"] }
uuid = { workspace = true }

[[bench]]
name = "cert_bench"
harness = false
