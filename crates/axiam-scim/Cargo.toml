[package]
name = "axiam-scim"
description = "AXIAM SCIM 2.0 provisioning endpoint (RFC 7643/7644), mounted under /scim/v2"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# R3.1 (B4): SCIM maps onto the EXISTING user/group repositories and reuses
# axiam-api-rest's AppState<C>, AuthenticatedUser extractor, RequirePermission
# guard, and AuthzMiddleware — no parallel storage or authorization stack.
axiam-core = { workspace = true }
axiam-api-rest = { workspace = true }
# G-6 (T23.6.2, D-57): the outbound SCIM client sends every request through the
# shared SSRF guard (`axiam_federation::ssrf`, which re-exports axiam-pki's), so
# no second HTTP client exists beside it. Already a dependency of
# axiam-api-rest, so nothing enters the graph.
axiam-federation = { workspace = true }
# The outbound client's wire: request building (reqwest), the base-URL join and
# the filter's query encoding (url), the token request's Basic client
# authentication (base64), the SHA-256 digest of a representation (sha2, hex)
# and the zeroising buffers the credential and the cached access token live in.
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# Argon2id-hashes a SCIM-supplied `password` PATCH value / generates the
# random initial password for SCIM-provisioned users — the same function
# `axiam-db`'s user repository already uses internally (Security Standards:
# Argon2id for all password storage).
axiam-auth = { workspace = true }
secrecy = { workspace = true }
actix-web = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
surrealdb = { workspace = true }

[dev-dependencies]
axiam-db = { workspace = true }
tokio = { workspace = true }
axiam-authz = { workspace = true }
axiam-test-support = { workspace = true }
actix-rt = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
# T23.5.3 — the SSF event tests build the deployment key at run time (no key
# literal) and name the request type the routes take.
rcgen = { workspace = true }
actix-http = { workspace = true }
