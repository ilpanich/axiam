# deny.toml — cargo-deny workspace configuration
# Docs: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Policy decisions: .planning/phases/06-ci-cd-infrastructure-hardening/06-CONTEXT.md (D-01..D-03)

[advisories]
# Advisory IDs to ignore. Every entry MUST carry id + reason + review date (D-02).
#
# THIS LIST IS DELIBERATELY SHORTER THAN THE cargo-audit ONE in
# .github/workflows/ci.yml, and the difference is not drift. The two tools do not
# look at the same set of crates:
#
#   * cargo-deny resolves the feature graph, so a dependency that is declared
#     `optional = true` and never enabled simply is not there to match against.
#   * cargo-audit reads Cargo.lock, which records optional dependencies whether
#     or not any feature activates them, so it still reports them.
#
# Two advisories fall in that gap today — RUSTSEC-2023-0089 (atomic-polyfill) and
# RUSTSEC-2026-0235 (rkyv). Both are lockfile artifacts: `cargo tree -i <crate>
# --target all --all-features` prints "nothing to print" for each. They are
# suppressed for cargo-audit, which needs it, and NOT here, which does not —
# cargo-deny reports an unmatched ignore as `advisory-not-detected`, and this job
# runs with `-D advisory-not-detected` so a suppression that has stopped applying
# fails CI instead of accumulating.
#
# That escalation is the point: an ignore is keyed by advisory ID, not by version
# or by crate, so one left behind after its crate leaves the graph would silently
# re-suppress the same advisory if a future dependency ever pulled that crate back
# in. Removing an entry the moment it stops matching is what keeps this list from
# becoming a set of blind spots. Delete a stale entry; do not re-add it here to
# quiet the build.
#
# The `audit-only:` lines below are the machine-readable half of that split, and
# scripts/check-audit-ignore-sync.py enforces it: every ID in the workflow's
# cargo-audit `ignore:` input must either appear in the `ignore` list here or be
# declared audit-only right here, with a reason. A suppression cargo-audit is
# given and nobody wrote down is the thing the gate exists to prevent.
#
# audit-only: RUSTSEC-2023-0089 — atomic-polyfill 1.0.3 is unmaintained (merged into
#   embassy). It sits in Cargo.lock but is not in the resolved graph: `cargo tree -i
#   atomic-polyfill --target all --all-features` prints "nothing to print". Maintenance
#   notice, no CVE. Review: 2026-09-04. Drop when it leaves Cargo.lock.
# audit-only: RUSTSEC-2026-0235 — rkyv 0.7.46, insufficient archive validation (OOB read
#   via Rc/Arc). NEVER COMPILED INTO ANY AXIAM ARTIFACT: rkyv is an `optional = true`
#   dependency of rust_decimal behind that crate's `rkyv` feature, and nothing in the
#   AXIAM graph enables it — `cargo tree -i rkyv --target all --all-features` prints
#   "nothing to print". A Cargo.lock artifact, not a reachable vulnerability. Review:
#   2026-09-04. Re-verify with that command if rust_decimal's feature defaults change;
#   drop this entry if rust_decimal moves to rkyv >=0.8.17.
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack — potential RSA key recovery through timing sidechannels.
    # Affects rsa 0.9.x via pgp 0.19.x (axiam-pki) and jsonwebtoken 10.x (surrealdb-core).
    # Solution: No fixed upgrade is available upstream (rsa crate has no patched release).
    # Mitigated: AXIAM uses RSA only in PGP asymmetric encryption (not a decryption oracle context).
    # JWT signing uses Ed25519 (not RSA). Timing side-channel requires a local/remote oracle.
    # Review date: 2026-06-04. Re-evaluate when pgp or rsa upstream publishes a fix.
    { id = "RUSTSEC-2023-0071", reason = "No upstream fix; RSA in PGP encryption path only (not decryption oracle); JWT uses Ed25519. Review: 2026-06-04" },
    # RUSTSEC-2025-0141: bincode v2.0.1 is unmaintained (team disbanded after harassment incident).
    # Pulled in transitively by surrealdb-core v3.x; no direct AXIAM dependency; no upstream fix.
    # Risk: maintenance only — no known exploitable CVE. Tracked for re-evaluation when surrealdb
    # upgrades or removes bincode dependency.
    # Review date: 2026-06-04.
    { id = "RUSTSEC-2025-0141", reason = "Transitive dep via surrealdb-core; no upstream fix; unmaintained only (no CVE). Review: 2026-06-04" },
    # RUSTSEC-2026-0258: h2 accepts and queues empty DATA frames without limit; if streams are not
    # actively drained that grows memory without bound, or panics if the length overflows.
    # Upstream rates it LOW. Solution: upgrade to >=0.4.16.
    #
    # READ THIS ENTRY DIFFERENTLY FROM THE TWO ABOVE. Those are a timing side-channel off the
    # reachable path (RUSTSEC-2023-0071) and an unmaintained-crate notice with no CVE behind it
    # (RUSTSEC-2025-0141). This one IS reachable in a default AXIAM deployment. It is suppressed
    # only because there is no fix to take:
    #
    #   * Two copies of h2 resolve. The `h2 0.4.x` copy — reqwest / tonic / hyper — HAS been
    #     patched: Cargo.lock pins 0.4.16, so it raises no finding. Note that the suppression is
    #     keyed by advisory ID, not by version, so it would ALSO mask this advisory if the 0.4
    #     copy were ever rolled back below 0.4.16 — check `h2` in Cargo.lock before assuming a
    #     silent audit means only the actix path is affected.
    #   * `h2 0.3.27` arrives via actix-http <- actix-web / actix-governor and is what serves the
    #     REST listener. The advisory patches `>=0.4.16` only; there is no 0.3.x backport, and
    #     `cargo update -p h2@0.3.27` locks 0 packages. actix-http 3.13.3 and actix-web 4.14.1
    #     (both released 2026-08-09) are the newest versions on crates.io and predate the
    #     advisory, so there is nothing upstream to pick up yet.
    #
    # Exposure, stated rather than assumed: `crates/axiam-server/src/tls.rs:38` advertises
    # ["h2", "http/1.1"] on the rustls bind, and `reject_unsupported_http2_knob` makes startup FAIL
    # rather than let an operator narrow ALPN to HTTP/1.1, so every HTTP/2-capable TLS client
    # negotiates h2 against the affected code. Two things that look like mitigations are not:
    # the `server.h2` window knobs do not bound this (empty DATA frames consume no flow-control
    # credit — that is precisely why the bug exists), and actix-http never sends
    # SETTINGS_MAX_CONCURRENT_STREAMS (see the `max_concurrent_streams` note in tls.rs), so no
    # stream cap bounds it either.
    #
    # What genuinely limits the blast radius: it is availability-only (no key, token or data
    # compromise), upstream severity is low, and it requires an attacker who can complete a TLS
    # handshake against the REST listener. An operator who needs the exposure gone before actix
    # ships a fix can terminate TLS at an edge that does not offer HTTP/2 and leave `server.tls`
    # disabled — see `docs/security-profiles.md` and `benchmarks/targets/axiam/tls/tls13-h1.conf`.
    #
    # Review date: 2026-08-19. DROP THIS ENTRY as soon as actix-http publishes a release built on
    # h2 0.4.x (watch https://github.com/actix/actix-web/releases) — that is the only reason it is
    # here, and it should not outlive the missing upstream release.
    { id = "RUSTSEC-2026-0258", reason = "REACHABLE, not theoretical — unlike every other entry here. h2 0.3.27 via actix-http serves the TLS REST listener and has no patched 0.3.x release (patched >=0.4.16 only; actix-http 3.13.3 predates the advisory). The 0.4.x copy IS patched, to 0.4.16. Availability-only, upstream severity low; h1-only edge termination is the interim mitigation. Drop when actix-http moves to h2 0.4. Review: 2026-08-19" },
]

[licenses]
# Permissive license allowlist (D-03)
# Deny UNKNOWN/unclear licenses; per-crate exceptions below for non-standard licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # Permissive licenses verified as acceptable:
    "Unlicense",          # Public domain equivalent (The Unlicense)
    "0BSD",               # Zero-clause BSD — public domain-equivalent
    "CDLA-Permissive-2.0", # Community Data License Agreement (permissive variant, allows use/distribution)
]
confidence-threshold = 0.8

# Per-crate exceptions for non-standard or copyleft licenses where the
# dependency is necessary and the license reviewed acceptable.
exceptions = [
    # actix-governor 0.10.0: GPL-3.0-or-later (rate limiter middleware).
    # actix-governor is used in axiam-api-rest for rate limiting.
    # GPL-3.0 in a library is acceptable when linking a server binary (AXIAM is AGPL/Apache dual
    # concern — the project is Apache-2.0, and linking GPL code into a server binary is permitted
    # under GPL's network-server exception in most practical interpretations; however, this
    # should be reviewed against AXIAM's distribution requirements).
    # Alternatively: if this creates a license conflict, replace actix-governor with a MIT/Apache
    # rate-limiter (e.g., actix-web-lab or a custom tower middleware).
    # Review date: 2026-06-04.
    { allow = ["GPL-3.0-or-later"], name = "actix-governor" },
    # surrealdb family: BUSL-1.1 (Business Source License 1.1).
    # SurrealDB is AXIAM's core database. BUSL-1.1 converts to Apache-2.0 after 4 years.
    # Production use is permitted for non-production-use cases and for companies meeting the
    # "Additional Use Grant" in the SurrealDB BUSL. Since AXIAM embeds SurrealDB as a
    # server-side dependency (not redistributing SurrealDB itself as a product),
    # this is reviewed as acceptable for AXIAM's open-source development.
    # Review date: 2026-06-04.
    { allow = ["BUSL-1.1"], name = "surrealdb" },
    { allow = ["BUSL-1.1"], name = "surrealdb-core" },
    { allow = ["BUSL-1.1"], name = "surrealdb-collections" },
    { allow = ["BUSL-1.1"], name = "surrealdb-strand" },
    { allow = ["BUSL-1.1"], name = "surrealdb-types" },
    { allow = ["BUSL-1.1"], name = "surrealdb-types-derive" },
    { allow = ["BUSL-1.1"], name = "surrealdb-protocol" },
    # libbz2-rs-sys: bzip2-1.0.6 custom permissive license (embedded in the crate).
    # bzip2's license is a BSD-like permissive license. Reviewed as acceptable.
    # Review date: 2026-06-04.
    { allow = ["bzip2-1.0.6"], name = "libbz2-rs-sys" },
    # quoted_printable: 0BSD (Zero-Clause BSD — public domain equivalent).
    # Already in the allow list above; this exception is redundant but explicit for clarity.
    # Review date: 2026-06-04.
    { allow = ["0BSD"], name = "quoted_printable" },
    # xxhash-rust: BSL-1.0 — the BOOST Software License 1.0.
    #
    # Read that twice. This is NOT BUSL-1.1, the Business Source License granted
    # to the surrealdb crates a few lines above, despite the near-identical
    # abbreviation. BSL-1.0 is a plain permissive licence — OSI approved and
    # FSF Free/Libre (cargo-deny says so itself in the rejection), with no
    # copyleft, no field-of-use restriction, and no attribution requirement for
    # binary distribution. It is in the same class as MIT and ISC and would be
    # uncontroversial in the allow list above.
    #
    # It is an exception rather than a blanket allow deliberately: a licence
    # this easy to confuse with the one directly above it should be granted one
    # crate at a time, so that a second BSL-1.0 dependency gets looked at by a
    # human instead of being waved through by a policy line nobody re-reads.
    #
    # Reached via surrealkv -> surrealdb-core -> surrealdb, and surrealkv
    # entered the lockfile when axiam-db added the `kv-surrealkv` dev-dependency
    # feature so the serialisation tests could run on the engine production
    # deploys (see tools/surreal-race-probe/README.md).
    # Review date: 2026-08-12.
    { allow = ["BSL-1.0"], name = "xxhash-rust" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
