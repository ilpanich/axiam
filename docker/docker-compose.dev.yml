services:
  # One-shot init: chown /data for the non-root SurrealDB user (65532).
  # Named volumes are root-owned by default; without this surreal can't write.
  surrealdb-init:
    image: busybox
    container_name: axiam-surrealdb-init
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod -R u+rwX /data"]
    volumes:
      - surrealdb-data:/data
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: axiam-surrealdb
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    # Persist the datastore on the mounted volume. Without a PATH arg the
    # default is `memory` and all state is wiped on restart.
    command: start --user root --pass root --log info surrealkv:/data/axiam.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: axiam-rabbitmq
    ports:
      # A6: 5671 (AMQPS) only. There is no plaintext 5672 mapping because there
      # is no plaintext listener to map — see docker/rabbitmq-tls.conf, mounted
      # below, which sets `listeners.tcp = none`.
      - "5671:5671"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: axiam
      RABBITMQ_DEFAULT_PASS: axiam
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # A6: broker certificate + key + CA, generated by `just dev-broker-certs`
      # (which `just dev-up` runs for you), plus the AMQPS-only listener config
      # shared with the e2e, benchmark and CI brokers.
      - ./.secrets/broker-tls:/etc/rabbitmq/tls:ro
      - ./rabbitmq-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # axiam-server — run with COOKIE_SECURE=false so auth cookies work over
  # plain http://localhost during local development (D-18).
  # NEVER set AXIAM__AUTH__COOKIE_SECURE=false in staging or production.
  #
  # Gated behind the "full-stack" profile so `just dev-up` starts only the
  # datastores (SurrealDB + RabbitMQ) and the server runs from source via
  # `just run`. This image is published to a private registry; pulling it is
  # opt-in for those with access: `docker compose --profile full-stack up -d`.
  # ---------------------------------------------------------------------------
  # HashiCorp Vault (development mode) — OPTIONAL locally
  # ---------------------------------------------------------------------------
  #
  # Gated behind the "vault" profile, so `just dev-up` does not start it and a
  # developer keeps the environment-variable workflow by default. Bring it up
  # with `just vault-up`, which also seeds AXIAM's keys.
  #
  # `-dev` mode is NOT production: it stores everything in memory, starts
  # unsealed, listens on plain HTTP and uses a fixed root token. Every one of
  # those is wrong for a real deployment, which is why the production compose
  # file and the k8s manifests do none of them, and why
  # docs/deployment/vault.md exists.
  #
  # It is right for local development for the same reasons: no unseal ceremony
  # between `docker compose down` and `up`, and no TLS certificate to mint
  # before anything works.
  vault:
    profiles: ["vault", "full-stack"]
    image: hashicorp/vault:1.20
    container_name: axiam-vault
    cap_add:
      # Vault locks its memory so secrets cannot be swapped to disk. Without
      # this it still runs, but logs a warning on every start.
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:-axiam-dev-root}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      # 200 = unsealed and active. A dev-mode Vault should reach this within a
      # second or two; anything else means it did not start cleanly.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  axiam-server:
    profiles: ["full-stack"]
    image: ghcr.io/axiamhq/axiam/server:latest
    container_name: axiam-server
    depends_on:
      surrealdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      AXIAM__DB__URL: "surrealdb:8000"
      AXIAM__DB__USERNAME: root
      AXIAM__DB__PASSWORD: root
      # A6: TLS to the broker, exactly as in prod. Local dev used to be the
      # documented exception here (`AXIAM__AMQP__ALLOW_PLAINTEXT=true`, on the
      # reasoning that the broker is local with throwaway data). That reasoning
      # was sound in isolation and wrong in aggregate: the same argument was
      # made independently by the e2e stack, the benchmark target and CI, and
      # between the four of them "AMQP is TLS-only" described almost nothing
      # this repository actually runs. The flag is gone; minting a dev
      # certificate is one script invocation and `just dev-up` does it.
      AXIAM__AMQP__URL: "amqps://axiam:axiam@rabbitmq:5671"
      AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.pem"
      RUST_LOG: "${RUST_LOG:-axiam=debug}"
      # D-18: cookies work over HTTP in local dev (http://localhost).
      # Default in code is true (prod-safe). NEVER set false in production.
      AXIAM__AUTH__COOKIE_SECURE: "false"
      # Secrets come from Vault when it is running, and from this file's
      # environment otherwise. `env` is the default in code, so a developer who
      # never starts Vault sees no change.
      AXIAM__AUTH__SECRET_PROVIDER: "${AXIAM__AUTH__SECRET_PROVIDER:-env}"
      AXIAM__AUTH__VAULT_ADDR: "http://vault:8200"
      AXIAM__AUTH__VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-axiam-dev-root}"
      AXIAM__AUTH__VAULT_MOUNT: "secret"
      AXIAM__AUTH__VAULT_PATH: "axiam"
    volumes:
      # A6: read-only CA bundle for verifying the broker certificate.
      - ./.secrets/broker-tls/ca.pem:/etc/axiam/broker-tls/ca.pem:ro
    restart: unless-stopped

volumes:
  surrealdb-data:
  rabbitmq-data:
