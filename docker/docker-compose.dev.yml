services:
  # One-shot init: chown /data for the non-root SurrealDB user (65532).
  # Named volumes are root-owned by default; without this surreal can't write.
  surrealdb-init:
    image: busybox
    container_name: axiam-surrealdb-init
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod -R u+rwX /data"]
    volumes:
      - surrealdb-data:/data
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: axiam-surrealdb
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    # Persist the datastore on the mounted volume. Without a PATH arg the
    # default is `memory` and all state is wiped on restart.
    command: start --user root --pass root --log info surrealkv:/data/axiam.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: axiam-rabbitmq
    ports:
      # A6: 5671 (AMQPS) only. There is no plaintext 5672 mapping because there
      # is no plaintext listener to map — see the listener config below.
      - "5671:5671"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: axiam
      RABBITMQ_DEFAULT_PASS: axiam
      # A6: identical to the prod stack, and deliberately so. AMQP is TLS-only
      # in every build profile, so a dev broker with a plaintext listener would
      # simply be a broker `just run` cannot talk to — the plaintext escape
      # hatch that used to bridge the gap here is gone.
      #
      # `just dev-up` calls scripts/gen-broker-tls.sh first, which mints the CA
      # and broker certificate into ./.secrets/broker-tls (gitignored). The
      # certificate's SAN carries `rabbitmq`, `localhost` and `127.0.0.1`, so
      # the same material verifies from inside the compose network and from a
      # `cargo test` running on the host.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbit listeners.tcp []
        -rabbit listeners.ssl.default 5671
        -rabbit ssl_options.cacertfile "/etc/rabbitmq/tls/ca.pem"
        -rabbit ssl_options.certfile   "/etc/rabbitmq/tls/server.pem"
        -rabbit ssl_options.keyfile    "/etc/rabbitmq/tls/server.key"
        -rabbit ssl_options.verify verify_none
        -rabbit ssl_options.fail_if_no_peer_cert false
        -rabbit ssl_options.versions ['tlsv1.3']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # A6: broker certificate + key + CA, generated by `just dev-broker-certs`
      # (which `just dev-up` runs for you).
      - ./.secrets/broker-tls:/etc/rabbitmq/tls:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # axiam-server — run with COOKIE_SECURE=false so auth cookies work over
  # plain http://localhost during local development (D-18).
  # NEVER set AXIAM__AUTH__COOKIE_SECURE=false in staging or production.
  #
  # Gated behind the "full-stack" profile so `just dev-up` starts only the
  # datastores (SurrealDB + RabbitMQ) and the server runs from source via
  # `just run`. This image is published to a private registry; pulling it is
  # opt-in for those with access: `docker compose --profile full-stack up -d`.
  axiam-server:
    profiles: ["full-stack"]
    image: ghcr.io/axiamhq/axiam/server:latest
    container_name: axiam-server
    depends_on:
      surrealdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      AXIAM__DB__URL: "surrealdb:8000"
      AXIAM__DB__USERNAME: root
      AXIAM__DB__PASSWORD: root
      # A6: TLS to the broker, exactly as in prod. Local dev used to be the
      # documented exception here (`AXIAM__AMQP__ALLOW_PLAINTEXT=true`, on the
      # reasoning that the broker is local with throwaway data). That reasoning
      # was sound in isolation and wrong in aggregate: the same argument was
      # made independently by the e2e stack, the benchmark target and CI, and
      # between the four of them "AMQP is TLS-only" described almost nothing
      # this repository actually runs. The flag is gone; minting a dev
      # certificate is one script invocation and `just dev-up` does it.
      AXIAM__AMQP__URL: "amqps://axiam:axiam@rabbitmq:5671"
      AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.pem"
      RUST_LOG: "${RUST_LOG:-axiam=debug}"
      # D-18: cookies work over HTTP in local dev (http://localhost).
      # Default in code is true (prod-safe). NEVER set false in production.
      AXIAM__AUTH__COOKIE_SECURE: "false"
    volumes:
      # A6: read-only CA bundle for verifying the broker certificate.
      - ./.secrets/broker-tls/ca.pem:/etc/axiam/broker-tls/ca.pem:ro
    restart: unless-stopped

volumes:
  surrealdb-data:
  rabbitmq-data:
