services:
  # One-shot init: chown /data for the non-root SurrealDB user (65532), exactly
  # as `docker-compose.dev.yml` does. Named volumes are root-owned by default.
  surrealdb-init:
    image: busybox
    container_name: axiam-e2e-surrealdb-init
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod -R u+rwX /data"]
    volumes:
      - e2e-surrealdb-data:/data
    restart: "no"

  # E2E runs the SAME storage engine as production, and this is load-bearing
  # rather than tidiness. This service said `memory` until 2026-08. Measured on
  # SurrealDB 3.2.3 with `tools/surreal-race-probe`, `kv-mem` lets TWO callers
  # win a guarded single-use `UPDATE` in ~1% of contended rounds, while
  # `surrealkv` and `rocksdb` let none — so an E2E suite on `memory` exercises
  # weaker single-use guarantees than anything it is meant to give confidence
  # about, and would go green on a race that production does not have (or hide
  # one it does).
  #
  # The volume costs an init container and is discarded with the stack; that is
  # the price of testing the engine we ship.
  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: axiam-e2e-surrealdb
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    command: start --user root --pass root --log info surrealkv:/data/axiam.db
    ports:
      - "8000:8000"
    volumes:
      - e2e-surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # R5.4 (X4 cross-vendor proof): a real Keycloak instance so
  # `keycloak_cross_vendor_token_exchange_test.rs` can exchange a token
  # actually minted (and signed) by Keycloak, not a hand-rolled JWT shaped
  # like one — `external_token_exchange_test.rs:19-27` names exactly this
  # gap and says it belongs to the compose suite, not a unit-test harness.
  #
  # Image, healthcheck technique and the bootstrap-admin env vars are the
  # same as `benchmarks/targets/keycloak/docker-compose.yml` (26.7.0; a bare
  # TCP probe on the management port, because the image ships no curl and an
  # https profile serves the management port over TLS too). Deliberately
  # NOT that target's postgres-backed `start` + build-then-serve sequence,
  # and no TLS profile: the bench target needs production-representative
  # persistence and a matrix of security profiles to measure; this service
  # exists for one CI job's worth of realm/client/user that is discarded
  # with the stack, so `start-dev` (in-memory H2, auto-http-enabled) is
  # simpler and boots faster for no loss of what this test actually proves.
  # Plaintext HTTP is fine here: the test reaches this service over loopback
  # (the published port below) through the SAME `allow_private`/
  # `JwksCache::new_allow_private_networks()` seam every other
  # loopback-mock-IdP integration test uses — `axiam_pki::ssrf::guarded_fetch`
  # tolerates a non-HTTPS first hop only behind that seam, so this container
  # is never reachable in a posture the production SSRF guard would accept
  # (see the test file's module docs for why that is a real, intentional
  # limit — a *production* AXIAM instance still cannot federate with an
  # internal-network IdP over plain HTTP, or at all without an explicit
  # allowlist that does not exist today).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: axiam-e2e-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${E2E_KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${E2E_KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      # Published on the host so the Rust test process (running directly on
      # the CI runner, not in a container — see the test file's module docs
      # for why) reaches it at http://localhost:8180, which is loopback from
      # the test's point of view and therefore within the documented test
      # seam above.
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 15
      # Generous: first-ever `start-dev` on a cold image pull is slower than
      # a warm re-run.
      start_period: 60s
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: axiam-e2e-rabbitmq
    ports:
      # A6: 5671 (AMQPS) only — there is no plaintext listener to publish.
      - "5671:5671"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: axiam
      RABBITMQ_DEFAULT_PASS: axiam
    volumes:
      # A6: throwaway CA + broker certificate minted per run by the E2E job,
      # plus the AMQPS-only listener config shared with every other stack.
      - ./.secrets/broker-tls:/etc/rabbitmq/tls:ro
      - ./rabbitmq-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # axiam-server — BUILT FROM PR SOURCE (build: key instead of stale registry image).
  # Using image: ghcr.io/axiamhq/axiam/server:latest is deliberately absent here:
  # that tag is stale/absent for PR branches and would produce false-green E2E (W8).
  # COOKIE_SECURE=false so auth cookies work over plain http:// in CI (D-18).
  # NEVER set AXIAM__AUTH__COOKIE_SECURE=false in staging or production.
  axiam-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: axiam-e2e-server
    depends_on:
      surrealdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      AXIAM__DB__URL: "surrealdb:8000"
      AXIAM__DB__USERNAME: root
      AXIAM__DB__PASSWORD: root
      # A6: TLS to the broker. This stack used to run plaintext on the reasoning
      # that its broker is ephemeral, on the compose network, carrying synthetic
      # fixtures for one CI run — a fair argument that stopped being available
      # when the plaintext escape hatch was removed. The cost turned out to be
      # small: `scripts/e2e-bootstrap.sh` mints a throwaway CA and broker
      # certificate in about a second, and the job is otherwise unchanged.
      AXIAM__AMQP__URL: "amqps://axiam:axiam@rabbitmq:5671"
      AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.pem"
      # Bind on all interfaces so the published port is reachable from the host
      # (the in-code default is 127.0.0.1, which only the in-container Docker
      # healthcheck can reach — the host bootstrap probe to :8090 gets 000).
      # Mirrors docker-compose.prod.yml.
      AXIAM__SERVER__HOST: "0.0.0.0"
      AXIAM__GRPC__HOST: "0.0.0.0"
      RUST_LOG: "${RUST_LOG:-axiam=info}"
      # D-18: cookies work over HTTP in CI/local dev (http://localhost).
      # Default in code is true (prod-safe). NEVER set false in production.
      AXIAM__AUTH__COOKIE_SECURE: "false"
      # Bootstrap guard: only requests with this email are accepted by /admin/bootstrap.
      # NOTE: the bootstrap handler reads this via `std::env::var` directly (NOT
      # through the `AXIAM__`-prefixed config layer), so the OS env var name must
      # be exactly AXIAM_BOOTSTRAP_ADMIN_EMAIL (single underscore). A double
      # underscore here never reaches the gate and every bootstrap call 403s.
      AXIAM_BOOTSTRAP_ADMIN_EMAIL: "${E2E_ADMIN_EMAIL:-admin@axiam.dev}"
      # JWT signing keypair — load_config() asserts these are non-empty, otherwise
      # the server panics on startup (exit 101). The CI E2E job generates an
      # ephemeral Ed25519 keypair per run and exports these vars before
      # `docker compose up`; never committed.
      AXIAM__AUTH__JWT_PRIVATE_KEY_PEM: "${AXIAM__AUTH__JWT_PRIVATE_KEY_PEM:-}"
      AXIAM__AUTH__JWT_PUBLIC_KEY_PEM: "${AXIAM__AUTH__JWT_PUBLIC_KEY_PEM:-}"
      # SEC-022/SECHRD-08/D-05c: the AMQP master signing key is MANDATORY in a
      # release build (this image) — resolve_signing_key() fails closed and the
      # server panics on startup (exit 101) when it is unset. Hex-encoded; the
      # CI E2E job generates an ephemeral 32-byte key per run and exports it
      # before `docker compose up`; never committed.
      AXIAM__AMQP__SIGNING_KEY: "${AXIAM__AMQP__SIGNING_KEY:-}"
      # OBS-1: the auth pepper is MANDATORY in a release build (this image) —
      # client secrets are stored as a keyed HMAC-SHA256 tag with no unkeyed
      # fallback, so install_from_config() fails closed and the server panics on
      # startup (exit 101) when it is unset. Same posture and same reason as
      # AXIAM__AMQP__SIGNING_KEY above. The CI E2E job generates an ephemeral
      # pepper per run and exports it before `docker compose up`; never
      # committed. A fresh pepper per run is correct here: E2E starts from an
      # empty database, so there are no v2 hashes to carry across runs.
      AXIAM__AUTH__PEPPER: "${AXIAM__AUTH__PEPPER:-}"
      # OIDC discovery (/.well-known/openid-configuration) returns 500
      # "OIDC issuer is not configured as a valid URL" unless this is a real
      # URL: effective_issuer() falls back to jwt_issuer, which is a bare name
      # and fails url::Url::parse in the discovery handler's guard. Nothing in
      # the e2e suite exercised discovery until the B5 relying-party example
      # did, which is why this was never noticed.
      # It must equal the URL clients actually reach the server on — the
      # discovery `issuer` has to string-match the `iss` in issued tokens
      # (OIDC Core §2) — and the stack publishes the server on localhost:8090,
      # which is also what the examples use as AXIAM_URL.
      AXIAM__AUTH__OAUTH2_ISSUER_URL: "${AXIAM__AUTH__OAUTH2_ISSUER_URL:-http://localhost:8090}"

      # Login budget for a TEST stack, and only for a test stack.
      #
      # `login_per_min` ships as 10 (`config/rate_limit.rs`) and the shared
      # limiter buckets on `"{endpoint}:{ip}"` in the default `ip` mode. Every
      # example and every Playwright spec dials `/api/v1/auth/login` from the
      # single CI runner IP, and the examples job runs all of them inside about
      # fifteen seconds — so the whole suite shares ONE bucket and one 60s
      # window.
      #
      # That put the suite at its ceiling with no headroom: `main` makes eleven
      # login calls against a budget of ten plus the governor's ~1-per-6s
      # replenishment, which is the only reason it is green. This branch adds
      # two — the bootstrap's new "already bootstrapped?" probe and one in the
      # expanded b6 walkthrough — and `b5-rp-logout-app` runs last, so b5 is
      # what got the 429. The same bucket is why `org-scope.spec.ts` shows up
      # flaky: its login times out in `beforeEach` and passes on retry, once the
      # window has rolled.
      #
      # Raised here rather than by trimming logins, because the arithmetic is
      # the defect: at 10/10 any example that ever adds a single sign-in turns
      # the job red, for a reason that has nothing to do with what it changed.
      # This is the E2E compose file — the shipped default is untouched, and no
      # test asserts a login 429 (the helpers wait them out, they never expect
      # them), so nothing is being hidden.
      AXIAM__RATE_LIMIT__LOGIN_PER_MIN: "120"
    volumes:
      # A6: read-only CA bundle for verifying the broker certificate.
      - ./.secrets/broker-tls/ca.pem:/etc/axiam/broker-tls/ca.pem:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/axiam-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"

volumes:
  # Discarded with the stack (`docker compose down -v`); it exists only so the
  # surrealkv engine has somewhere to write. See the surrealdb service comment
  # for why E2E does not run `memory`.
  e2e-surrealdb-data:
