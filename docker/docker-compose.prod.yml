# Production-like Docker Compose for local testing of the full AXIAM stack.
# Usage: docker compose -f docker/docker-compose.prod.yml up -d   (via `just prod-up`)
#
# axiam-server and axiam-frontend pull the official released images from
# ghcr.io/ilpanich/axiam/* rather than building from this working tree. Pin a
# different release with AXIAM_IMAGE_TAG, or uncomment the `build:` blocks on
# those two services to go back to a local build.
#
# This file is NOT intended for actual production deployment (use Kubernetes
# manifests in k8s/ for that). It exists so developers can spin up the entire
# stack locally with a single command and validate end-to-end behaviour.

services:
  # ---------------------------------------------------------------------------
  # HashiCorp Vault — MANDATORY in this stack
  # ---------------------------------------------------------------------------
  #
  # Not gated behind a profile, unlike the dev stack: in a production-shaped
  # deployment the secret provider is Vault, and `axiam-server` below depends on
  # it being healthy.
  #
  # This runs Vault with Raft (integrated storage) and a real (self-signed) TLS
  # listener, which is close enough to production to exercise the parts that
  # differ from dev mode — sealing, unsealing, persistent storage, TLS, and a
  # read-only scoped token for the server rather than root. It is still NOT a
  # production Vault, and the single difference that matters is auto-unseal: a
  # real deployment uses a cloud KMS or transit seal so a restart does not need
  # a human with unseal keys, whereas `just prod-up` unseals from a key it left
  # on this disk. See docs/deployment/vault.md §5.3 and docker/vault/vault.hcl.
  #
  # `just prod-up` runs the init/unseal ceremony and seeds AXIAM's keys.

  # One-shot init: hand /vault/data to the non-root vault user (100:1000), the
  # same problem and the same shape as surrealdb-init below. Docker creates a
  # named volume's mount point owned by root when the path is absent from the
  # image — and hashicorp/vault ships /vault/config, /vault/file and
  # /vault/logs, but no /vault/data. Vault then cannot create its Raft bolt file
  # and dies on every start, which `restart: unless-stopped` turns into a loop:
  #
  #     Error initializing storage of type raft: failed to create fsm:
  #     failed to open bolt file: open /vault/data/vault.db: permission denied
  #
  # In Kubernetes `fsGroup: 1000` does this for us (k8s/vault/statefulset.yml);
  # Compose has no equivalent. Running Vault itself as root so its entrypoint
  # could chown would be the other way out, and would hand the one process that
  # holds every secret in the stack privileges it otherwise never needs.
  #
  # Runs on the Vault image rather than busybox because it is already pulled and
  # it can name the account instead of hardcoding its uid. Idempotent.
  vault-data-perms:
    image: hashicorp/vault:1.20
    container_name: axiam-vault-data-perms
    user: root
    # The image entrypoint would start a server; this container only touches
    # permissions.
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R vault:vault /vault/data && chmod 700 /vault/data"]
    volumes:
      - vault-raft-data:/vault/data
    # A root container with no reason to reach anything.
    network_mode: "none"
    # Must not restart: Vault waits for this to exit 0, exactly once.
    restart: "no"

  vault:
    image: hashicorp/vault:1.20
    container_name: axiam-vault
    cap_add:
      - IPC_LOCK
    depends_on:
      # /vault/data must belong to the unprivileged `vault` user before Vault
      # starts — see the vault-data-perms service above for why.
      vault-data-perms:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_API_ADDR: "https://vault:8200"
      VAULT_CACERT: "/vault/tls/ca.pem"
      # The image entrypoint chowns /vault/config on every start. That mount
      # is read-only here, deliberately, so the attempt fails and logs a burst
      # of "Read-only file system" errors and a "Could not chown" warning that
      # have nothing to do with any real problem — and sit directly above the
      # one line that does. Ownership is already correct and Vault only reads
      # the config. k8s/vault/statefulset.yml sets the same variable.
      SKIP_CHOWN: "true"
    volumes:
      # Raft (integrated storage) — see docker/vault/vault.hcl for why, and for
      # what an existing `file`-backend stack should do. That stack's old
      # `vault-data` volume is deliberately NOT reused or deleted here: it still
      # holds the only copy of its secrets, and silently pointing Raft at it
      # would produce a node that refuses to start rather than a migration.
      - vault-raft-data:/vault/data
      # Config is bind-mounted from the repository rather than living in a
      # named volume: it is not a secret, it should be reviewable in git, and
      # editing it should not require exec'ing into a container.
      - ./vault:/vault/config:ro
      - ./.secrets/vault-tls:/vault/tls:ro
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    ports:
      # SEC-016: bound to the loopback interface only, and published solely so
      # `just prod-up` can initialise, unseal and seed from the host — those are
      # host-side curl calls against $VAULT_ADDR. In production (k8s) Vault is
      # never reachable outside the cluster network; remove this mapping.
      - "127.0.0.1:8200:8200"
    healthcheck:
      # 501 = not initialised, 503 = sealed, 200 = ready. Only 200 is healthy;
      # a sealed Vault cannot answer a secret read, so starting the server
      # against one would fail at boot with a less obvious message.
      test: ["CMD", "sh", "-c", "wget --no-check-certificate --spider -q https://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - axiam-network

  # ---------------------------------------------------------------------------
  # AXIAM Backend (REST + gRPC)
  # ---------------------------------------------------------------------------
  axiam-server:
    # Official multi-arch image from the project's public GitHub registry,
    # built, scanned, signed (cosign) and attested by `.github/workflows/release.yml`.
    #
    # NOTE on the tag: release.yml applies the moving `latest` / `major.minor`
    # tags ONLY to stable releases (`flavor: latest=${{ stable }}`), and AXIAM
    # has so far published nothing but pre-releases — so `:latest` does NOT
    # exist in the registry and `:latest` here would fail with "manifest
    # unknown". AXIAM_IMAGE_TAG is therefore mandatory; `just prod-up` sets it
    # to the workspace version in Cargo.toml (= the newest released tag).
    # Override it to pull another release:
    #   AXIAM_IMAGE_TAG=1.0.0-alpha32 just prod-up
    image: ghcr.io/ilpanich/axiam/server:${AXIAM_IMAGE_TAG:?image tag required - run 'just prod-up', which defaults it to the workspace version, or export AXIAM_IMAGE_TAG=1.0.0-alphaNN}
    # Build from local source instead — uncomment this block (and comment out
    # `image:` above) to test working-tree changes, then use `just prod-up` with
    # `--build` restored in the justfile recipe.
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile.server
    container_name: axiam-server
    ports:
      # Bound to the LOOPBACK interface, not 0.0.0.0.
      #
      # These used to publish on every interface, which on a machine with a
      # port-forward or a permissive firewall put the API and the gRPC listener
      # straight on the internet with no edge in front — and therefore with
      # X-Forwarded-For honoured from anyone who cared to send one. The
      # documented topology puts Caddy in front (see
      # claude_dev/public-backend-tls-design.md §2), so the only thing that needs
      # to reach these is a process on this host.
      #
      # In production (k8s) the server is ClusterIP-only — remove these mappings.
      - "127.0.0.1:8090:8090"   # REST API — reached by the edge proxy on this host
      - "127.0.0.1:50051:50051" # gRPC — never published to the internet (SEC-003)
    # NOTE on naming: load_config() in crates/axiam-server/src/main.rs calls
    # `.with_prefix("AXIAM").separator("__")` without `.prefix_separator(_)`,
    # so config-rs 0.15 uses `__` as BOTH the prefix separator and the nested
    # key separator (see config-0.15.19/src/env.rs:236). Env vars must use a
    # DOUBLE underscore after AXIAM (e.g. `AXIAM__DB__URL`), otherwise they
    # are silently ignored and in-code defaults win.
    environment:
      # SurrealDB v3 Rust SDK's Ws engine takes a bare `host:port`, NOT a URL.
      # Passing a websocket URL scheme makes the SDK try to resolve the scheme
      # as a hostname and fail with a confusing DNS error.
      AXIAM__DB__URL: "surrealdb:8000"
      # SEC-023: No literal default credentials. Run `just prod-up`, which mints
      # them on first run into docker/.secrets/stack-credentials.env (gitignored)
      # and sources that file before starting compose.
      AXIAM__DB__USERNAME: "${AXIAM__DB__USERNAME:?SurrealDB username required - run 'just prod-up' or export AXIAM__DB__USERNAME}"
      AXIAM__DB__PASSWORD: "${AXIAM__DB__PASSWORD:?SurrealDB password required - run 'just prod-up' or export AXIAM__DB__PASSWORD}"
      AXIAM__DB__NAMESPACE: "axiam"
      AXIAM__DB__DATABASE: "axiam"
      # WebAuthn is validated against the origin the BROWSER is on, not the
      # address the API answers on. The built-in default is the API's own
      # `http://localhost:8090`, which no browser is ever on in this stack, so
      # every register/finish was rejected with a 401 that looked like a session
      # problem: the authenticator created the passkey and the password manager
      # saved it, then the server refused the attestation because
      # `clientDataJSON.origin` did not match.
      #
      # Default here is the Caddy front door this stack documents
      # (`caddy reverse-proxy --from https://localhost --to :8081`). Reaching the
      # frontend directly on http://localhost:8081 is a DIFFERENT origin — set
      # AXIAM_WEBAUTHN_RP_ORIGIN to whatever appears in the browser's address
      # bar, or passkeys will fail there in exactly the same way.
      #
      # RP_ID stays the bare registrable domain: it must be the origin's host or
      # a parent of it, and credentials are bound to it, so changing it later
      # invalidates every passkey already enrolled.
      AXIAM__AUTH__WEBAUTHN_RP_ID: "${AXIAM_WEBAUTHN_RP_ID:-localhost}"
      AXIAM__AUTH__WEBAUTHN_RP_ORIGIN: "${AXIAM_WEBAUTHN_RP_ORIGIN:-https://localhost}"
      # SEC-023: AMQP URL must not embed literal credentials.
      # A6: TLS to the broker. Port 5671 is the AMQPS listener configured on
      # the rabbitmq service below. HMAC signing (AXIAM__AMQP__SIGNING_KEY)
      # stays mandatory regardless — TLS gives confidentiality in transit,
      # HMAC gives end-to-end authenticity and replay protection across broker
      # hops. They are not alternatives.
      AXIAM__AMQP__URL: "amqps://${RABBITMQ_DEFAULT_USER:?RabbitMQ username required}:${RABBITMQ_DEFAULT_PASS:?RabbitMQ password required}@rabbitmq:5671"
      # The broker certificate is issued by a private CA (`just prod-broker-certs`
      # generates one; an AXIAM org CA from axiam-pki works identically), so the
      # system root store cannot verify it and the bundle must be supplied.
      # There is deliberately no verification-skip option — see AmqpTlsConfig.
      AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.pem"
      AXIAM__SERVER__HOST: "0.0.0.0"
      AXIAM__GRPC__HOST: "0.0.0.0"
      # JWT signing keys — provided by `just prod-up` from docker/.secrets/jwt_ed25519*.pem.
      # Compose refuses to start if these vars are not set in the shell environment,
      # so `docker compose up` run outside `just prod-up` fails fast with a clear message.
      # Secrets come from Vault, not from this file. That is the point: a
      # production deployment should be inspectable — `docker inspect`, a
      # Compose file in git, a CI variable — without any of those revealing the
      # token signing key or the OPAQUE setup key.
      #
      # The JWT keys below stay as a fallback for a stack brought up before the
      # Vault seeding step has run; once `just prod-up` has seeded, the values
      # in Vault win (see crates/axiam-server/src/main.rs).
      AXIAM__AUTH__SECRET_PROVIDER: "vault"
      AXIAM__AUTH__VAULT_ADDR: "https://vault:8200"
      AXIAM__AUTH__VAULT_TOKEN: "${AXIAM__AUTH__VAULT_TOKEN:?Vault token missing - run 'just prod-up' instead of raw docker compose}"
      AXIAM__AUTH__VAULT_MOUNT: "secret"
      AXIAM__AUTH__VAULT_PATH: "axiam"
      # Vault's listener certificate is issued by the private CA that
      # `just tls-certs` generates, and the server's HTTP client is built on
      # rustls with compiled-in roots — no SSL_CERT_FILE, so the anchor has to
      # be named. Without it the fetch fails at the TLS handshake with a bare
      # "error sending request", which says nothing about trust.
      AXIAM__AUTH__VAULT_CA_CERT_PATH: "/etc/axiam/vault-tls/ca.pem"
      AXIAM__AUTH__JWT_PRIVATE_KEY_PEM: "${AXIAM__AUTH__JWT_PRIVATE_KEY_PEM:?JWT private key missing - run 'just prod-up' instead of raw docker compose}"
      AXIAM__AUTH__JWT_PUBLIC_KEY_PEM: "${AXIAM__AUTH__JWT_PUBLIC_KEY_PEM:?JWT public key missing - run 'just prod-up' instead of raw docker compose}"
      # -- Rate-limit keying -------------------------------------------------
      #
      # trusted_hops = (reverse proxies between the client and the server) - 1,
      # because a proxy appends the address it received FROM, so the nearest
      # proxy is the socket peer and never appears in X-Forwarded-For.
      #
      # This topology has exactly ONE proxy in front of /api — the edge (Caddy)
      # routes /api, /oauth2 and /.well-known straight here, the same split
      # k8s/ingress.yml has always used — so the value is 0.
      #
      # It is set explicitly even though 0 is the built-in default. The previous
      # topology sent /api through the frontend's nginx as well, which made two
      # proxies and made 0 WRONG: the extractor then selected the edge's own
      # address for every request on the internet, collapsing every per-IP limit
      # — /auth/login included — into one global bucket. Anyone who reintroduces
      # a hop needs to see a number here to change, not a default to rediscover.
      # See claude_dev/public-backend-tls-design.md §4.
      #
      # Read via std::env::var directly, NOT through the AXIAM__-prefixed config
      # layer, but the name is the same either way.
      AXIAM__RATE_LIMIT__TRUSTED_HOPS: "${AXIAM__RATE_LIMIT__TRUSTED_HOPS:-0}"
      # -- Direct TLS (opt-in) -----------------------------------------------
      #
      # Off by default, which keeps this file working for anyone terminating TLS
      # at a proxy and speaking plaintext to the backend. Set AXIAM_TLS_ENABLED=true
      # and mount a certificate at ./.secrets/server-tls to have the backend
      # terminate its own TLS 1.3 — what the Pi deployment does, so no cleartext
      # credential crosses the Docker network. The leaf is re-read on SIGHUP and
      # hourly, so an ACME renewal needs no restart.
      AXIAM__SERVER__TLS__ENABLED: "${AXIAM_TLS_ENABLED:-false}"
      AXIAM__SERVER__TLS__CERT_PATH: "/etc/axiam/server-tls/fullchain.pem"
      AXIAM__SERVER__TLS__KEY_PATH: "/etc/axiam/server-tls/privkey.pem"
      # Client-certificate policy for native mTLS. `optional` lets one listener
      # serve both the edge proxy (which presents none) and IoT devices reaching
      # the backend directly (which do). Leave `off` if you enrol no devices.
      AXIAM__SERVER__TLS__CLIENT_AUTH: "${AXIAM_TLS_CLIENT_AUTH:-off}"
      RUST_LOG: "${RUST_LOG:-axiam=info}"
    volumes:
      # A6: read-only CA bundle for verifying the broker certificate.
      - ./.secrets/broker-tls:/etc/axiam/broker-tls:ro
      # The server's own TLS leaf, when AXIAM_TLS_ENABLED=true. Mounted
      # read-only and unconditionally: an empty directory is harmless while TLS
      # is off, and a bind mount that only exists in one branch is a bind mount
      # somebody forgets. On the Pi this is where the certbot deploy hook
      # installs the renewed Let's Encrypt leaf.
      - ./.secrets/server-tls:/etc/axiam/server-tls:ro
      # Trust anchor for Vault's listener — the server reads every secret over
      # this connection before it can serve anything, so it must be mounted.
      - ./.secrets/vault-tls:/etc/axiam/vault-tls:ro
    depends_on:
      surrealdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # An unhealthy Vault here means sealed or not yet initialised. Starting
      # the server against one would fail at boot — by design, since secrets
      # fail closed — but with a less obvious message than "vault is unhealthy".
      vault:
        condition: service_healthy
    healthcheck:
      # D-09: distroless has no shell; use the axiam-server healthcheck subcommand
      test: ["CMD", "/usr/local/bin/axiam-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - axiam-network

  # ---------------------------------------------------------------------------
  # AXIAM Frontend (React / Nginx)
  # ---------------------------------------------------------------------------
  axiam-frontend:
    # Official image from the project's public GitHub registry — see the tag
    # note on axiam-server above; both images share AXIAM_IMAGE_TAG so the
    # frontend can never drift to a different release than the backend.
    image: ghcr.io/ilpanich/axiam/frontend:${AXIAM_IMAGE_TAG:?image tag required - run 'just prod-up', which defaults it to the workspace version, or export AXIAM_IMAGE_TAG=1.0.0-alphaNN}
    # Build from local source instead — uncomment this block (and comment out
    # `image:` above) to test working-tree changes.
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile.frontend
    container_name: axiam-frontend
    environment:
      # How this nginx reaches the backend. Defaults reproduce the plaintext
      # behaviour the image has always had, so nothing changes for a stack that
      # leaves AXIAM_TLS_ENABLED off. With the backend terminating its own TLS,
      # set AXIAM_BACKEND_ORIGIN=https://axiam-server:8090 and AXIAM_BACKEND_SNI
      # to the name the backend's certificate is issued for — verification is
      # always on and there is no way to turn it off.
      #
      # On the documented Pi topology nothing routes through here at all: the
      # edge claims /api, /oauth2 and /.well-known before this container sees
      # them, and this serves the SPA only. These stay wired anyway because the
      # dev stack, the E2E suite and anyone reaching the container directly go
      # through these blocks.
      AXIAM_BACKEND_ORIGIN: "${AXIAM_BACKEND_ORIGIN:-http://axiam-server:8090}"
      AXIAM_BACKEND_SNI: "${AXIAM_BACKEND_SNI:-axiam-server}"
      AXIAM_BACKEND_CA: "${AXIAM_BACKEND_CA:-/etc/ssl/certs/ca-certificates.crt}"
    ports:
      # Loopback only, for the same reason as axiam-server above: the edge
      # proxy on this host is the only thing that should reach it. Host port
      # 8081 keeps :80 and :443 free for that proxy.
      - "127.0.0.1:8081:8080"
    depends_on:
      - axiam-server
    restart: unless-stopped
    networks:
      - axiam-network

  # ---------------------------------------------------------------------------
  # One-shot init: fix /data ownership for the non-root SurrealDB user (65532).
  # Docker creates named volumes owned by root; SurrealDB's non-root process
  # cannot write without this. Runs once and exits; surrealdb `depends_on`
  # its successful completion.
  surrealdb-init:
    image: busybox
    container_name: axiam-surrealdb-init
    command: ["sh", "-c", "chown -R 65532:65532 /data && chmod -R u+rwX /data"]
    volumes:
      - surrealdb-data:/data
    restart: "no"

  # SurrealDB — document/graph database
  # ---------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: axiam-surrealdb
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    # Persist the datastore on the mounted volume. Without a PATH arg the
    # default is `memory`, which leaves the volume untouched and wipes all
    # state on every container restart.
    command: start --user ${AXIAM__DB__USERNAME:?SurrealDB username required} --pass ${AXIAM__DB__PASSWORD:?SurrealDB password required} --log info surrealkv:/data/axiam.db
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - axiam-network

  # ---------------------------------------------------------------------------
  # RabbitMQ — AMQP message broker
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: axiam-rabbitmq
    environment:
      # SEC-023: No literal default credentials — see the note on
      # axiam-server; `just prod-up` sources docker/.secrets/stack-credentials.env.
      # RabbitMQ only applies these on the FIRST boot of an empty rabbitmq-data
      # volume, which is why they are persisted rather than regenerated per run.
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RabbitMQ username required - run 'just prod-up' or export RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RabbitMQ password required - run 'just prod-up' or export RABBITMQ_DEFAULT_PASS}"
      # T-131: this stack stays on the default vhost `/`, unlike the Kubernetes
      # manifests, which use a dedicated `axiam` vhost
      # (k8s/rabbitmq/statefulset.yml). Deliberate, for two reasons:
      #
      # 1. A vhost buys isolation from OTHER applications sharing the broker.
      #    Nothing else uses this one — it exists to run AXIAM on a laptop —
      #    so here it would be a boundary with nothing on the other side.
      # 2. RABBITMQ_DEFAULT_VHOST is honoured only on the first boot of an
      #    empty rabbitmq-data volume, exactly like the user and password
      #    above. Setting it on an existing volume changes the URL the server
      #    dials without creating the vhost it now names, so AMQP starts
      #    failing with an access-refused that points at nothing obvious.
      #    Adopting it here would mean requiring `just prod-clean` — full data
      #    loss — to pick up a change with no local security benefit.
      #
      # If you do want it locally: `just prod-clean`, set this to `axiam`, and
      # append `/axiam` to AXIAM__AMQP__URL above. Both, or neither.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # A6: broker certificate + key + CA, generated by `just prod-broker-certs`.
      - ./.secrets/broker-tls:/etc/rabbitmq/tls:ro
      # A6: the AMQPS listener config, shared with every other stack. A conf.d
      # fragment rather than a replacement for rabbitmq.conf, so the entrypoint's
      # own 10-defaultuser.conf still supplies the credentials above.
      - ./rabbitmq-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - axiam-network

volumes:
  surrealdb-data:
  rabbitmq-data:
  # Vault's Raft (integrated storage) data. Losing this volume loses every
  # secret AXIAM stores there — including the OPAQUE setup key, which means a
  # password reset for every user in every tenant. Back it up with
  # `vault operator raft snapshot save`, which is consistent and can be taken
  # while Vault is running; copying the directory under a live process is not.
  vault-raft-data:

networks:
  axiam-network:
    driver: bridge
