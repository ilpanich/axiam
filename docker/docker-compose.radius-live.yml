# The Live profile of the 802.1X / EAP-TLS e2e stack (W6.5, #563): the same
# FreeRADIUS, but AXIAM decides the placement per authentication, through
# rlm_rest and POST /api/v1/network/decide, instead of a placement table.
#
# An OVERRIDE, not a stack of its own: it is read together with the base file,
#
#   docker compose -f docker-compose.radius.yml -f docker-compose.radius-live.yml ...
#
# and changes the one service `freeradius` of it. The image is therefore pinned
# once, by digest, in docker-compose.radius.yml, and this file names none (it
# builds nothing either). docs/pki/freeradius.md, "The decision per
# authentication", is the guide; the test is the Live case of
# crates/axiam-server/tests/radius_e2e.rs, which brings this stack up itself:
#
#   AXIAM_E2E_RADIUS=1 cargo test -p axiam-server --no-default-features \
#       --test radius_e2e -- --nocapture
#
# What it changes
# ---------------
#  * check-eap-tls asks AXIAM; the `files` placement module is replaced by the
#    rlm_rest, cache and exec modules that do (a volume mounted over the same
#    path as the base file's, so the table is not loaded at all);
#  * the `eap` module's `$-INCLUDE` finds verify.conf, so EAP-TLS runs the hook
#    that leaves the certificate's fingerprint for the decision;
#  * clients.conf takes each client's `shortname` from AXIAM_LIVE_SITE: the AXIAM
#    site key, from the server's own configuration;
#  * the container reaches AXIAM, which the test runs on the host, at
#    axiam.radius.test: the name AXIAM's TLS certificate carries, mapped to the
#    network's gateway (the host). In production it is AXIAM's own address, and
#    nothing between the two ends the TLS connection.
#
# Variables (the test writes them into docker/.secrets/radius/env):
#   RADIUS_E2E_AXIAM_URL      https://axiam.radius.test:<port>
#   RADIUS_E2E_SITE           the AXIAM site key
#   RADIUS_E2E_AXIAM_HOST_IP  where axiam.radius.test points (default: the
#                             gateway of the base file's network)

services:
  freeradius:
    # The base file's debug output, but THREADED: `-X` is `-sfxx -l stdout`, and its
    # `-s` serves one request at a time (radiusd.c 3.2.8, `case 'X'` clears
    # spawn_flag), so two authentications can never be in post-auth at once and the
    # e2e's concurrent rotation step could not run concurrently at all (#765).
    # `-xx` is the same debug level 2, so the log lines (no timestamps, the `(N)`
    # request number in front) are the ones `-X` writes (log.c :405).
    command: ["freeradius", "-f", "-xx", "-l", "stdout"]
    environment:
      AXIAM_LIVE_URL: "${RADIUS_E2E_AXIAM_URL:?the test writes docker/.secrets/radius/env; pass --env-file}"
      AXIAM_LIVE_SITE: "${RADIUS_E2E_SITE:?the test writes docker/.secrets/radius/env; pass --env-file}"
    extra_hosts:
      - "axiam.radius.test:${RADIUS_E2E_AXIAM_HOST_IP:-172.28.78.1}"
    # The hook's scratch space and the fingerprints it leaves: memory only,
    # owned by the freerad user (uid 101 in the image) alone.
    tmpfs:
      - /var/run/axiam-live:uid=101,gid=101,mode=0700
    volumes:
      - ./radius/raddb/live/clients.conf:/etc/freeradius/clients.conf:ro
      - ./radius/raddb/live/check-eap-tls:/etc/freeradius/sites-enabled/check-eap-tls:ro
      # Over the base file's axiam_placement: the Live profile has no table.
      - ./radius/raddb/live/axiam_live:/etc/freeradius/mods-enabled/axiam_placement:ro
      - ./radius/raddb/live/verify.conf:/etc/freeradius/axiam-live/verify.conf:ro
      - ./radius/raddb/live/axiam-live.sh:/etc/freeradius/axiam-live/axiam-live.sh:ro
