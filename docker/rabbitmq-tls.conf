# RabbitMQ AMQPS-only listener configuration (A6).
#
# Installed as /etc/rabbitmq/conf.d/20-tls.conf — a *fragment*, not a
# replacement for rabbitmq.conf. That matters: the official image's entrypoint
# writes conf.d/10-defaultuser.conf from RABBITMQ_DEFAULT_USER/PASS, and
# replacing rabbitmq.conf wholesale is a good way to lose the credentials every
# stack here authenticates with. Numbered 20 so it loads after that one.
#
# Used by every stack that runs a broker: the production, dev, e2e and benchmark
# compose files, and docker-compose.ci-broker.yml for CI's test and coverage
# jobs. Those two use a compose file rather than a `services:` container because
# a service container starts before any step runs, and the certificate is minted
# by a step.
#
# # Why a config file rather than RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
#
# Because the erl-args form this replaced was never valid, and had never worked.
# It read:
#
#     -rabbit listeners.tcp []
#     -rabbit ssl_options.cacertfile "/etc/rabbitmq/tls/ca.pem"
#     -rabbit ssl_options.versions ['tlsv1.3']
#
# Those are **sysctl-format configuration keys** passed as **classic Erlang
# application arguments**. `-rabbit <key> <value>` wants Erlang atoms and terms
# (`tcp_listeners`, `ssl_listeners`, `ssl_options`), not dotted config keys, and
# the two spellings are not interchangeable. The node dies during prelaunch, and
# — this is the part that costs time — the symptom is an unrelated-looking
#
#     Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces
#
# so the failure reads as a permissions or infrastructure problem rather than as
# a config one. It cost three CI rounds and two wrong diagnoses (shell quoting,
# then bind-mount ownership) before the two spellings were compared side by side.
#
# docker-compose.prod.yml carried this since A6 landed, which means the
# production stack's AMQPS listener has almost certainly never come up. Nothing
# exercised it: the plaintext escape hatch meant every stack that CI actually
# ran was plaintext, so this file is the first thing to boot a TLS broker here.
# That is the aggregate failure this whole change is about, showing up one level
# down — an untested path stayed broken because nothing required it to work.
#
# The sysctl format below is the documented one, has no quoting hazards, and is
# identical whether compose or a human installs it.

listeners.tcp = none

listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile   = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile    = /etc/rabbitmq/tls/server.key

# The broker does not require a client certificate. AXIAM authenticates to it
# with SASL credentials, and mutual TLS toward the broker is an option the
# client side offers (AXIAM__AMQP__TLS__CLIENT_CERT_PATH) rather than something
# this test broker demands. `verify_none` here is about the CLIENT certificate
# the broker asks for; it does not weaken the server certificate AXIAM verifies,
# which is the direction that matters for A6.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# TLS 1.3 only, matching the project standard ("TLS 1.3 minimum for all
# external communication"). The broker is where this floor is actually
# enforceable for the AMQP link — lapin exposes no seam for a client-side
# minimum version — and enforcing it here also covers every other AMQP client
# that talks to the same broker.
ssl_options.versions.1 = tlsv1.3
