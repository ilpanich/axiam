# RabbitMQ AMQPS-only listener configuration (A6).
#
# Mounted at /etc/rabbitmq/rabbitmq.conf by the dev, e2e and benchmark compose
# stacks, and by CI's test and coverage jobs — which start the broker with
# `docker run` rather than as a `services:` container, because a service
# container starts before any step runs and no step-generated certificate could
# reach it.
#
# # Why a config file rather than RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
#
# The first version of this passed the same settings as `-rabbit key value`
# pairs through that environment variable. It works from a compose file, where
# a YAML folded scalar hands Docker one clean string. It does not survive
# `docker run` in a shell: the value carries quotes around each path and a
# `['tlsv1.3']` list, and the shell mangles both. The broker then exits during
# boot and the only symptom upstream is `container ... is not running`, which
# reads as an infrastructure flake rather than as a quoting bug — it cost a CI
# round before the container log said otherwise.
#
# One file in the documented format now serves every stack. It has no quoting
# hazards, it is identical whether mounted by `docker run`, by compose, or by a
# human debugging the broker by hand, and there is one place to change when the
# listener policy changes.
#
# `docker-compose.prod.yml` still carries the inline erl-args form. That is
# pre-existing and works (compose hands it over intact); it is left alone
# deliberately rather than swept into this change.

# No plaintext listener at all. `none` is the sysctl-format spelling of the
# `[]` the classic Erlang term used. This is the line that makes an amqps://
# URL a guarantee rather than a preference: without it, anything failing TLS
# could quietly reconnect in the clear.
listeners.tcp = none

listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile   = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile    = /etc/rabbitmq/tls/server.key

# The broker does not require a client certificate. AXIAM authenticates to it
# with SASL credentials, and mutual TLS toward the broker is an option the
# client side offers (AXIAM__AMQP__TLS__CLIENT_CERT_PATH) rather than something
# this test broker demands. `verify_none` here is about the CLIENT certificate
# the broker asks for; it does not weaken the server certificate AXIAM verifies,
# which is the direction that matters for A6.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# TLS 1.3 only, matching the project standard ("TLS 1.3 minimum for all
# external communication"). The broker is where this floor is actually
# enforceable for the AMQP link — lapin exposes no seam for a client-side
# minimum version — and enforcing it here also covers every other AMQP client
# that talks to the same broker.
ssl_options.versions.1 = tlsv1.3
