# The NASes this FreeRADIUS answers (docs/pki/freeradius.md, "Clients").
#
# FreeRADIUS answers a request only if its source address matches a `client`
# here: a packet from any other address is dropped without a reply (RFC 2865
# section 2), so an address that is not listed cannot probe the server.
#
# `secret` is read from the environment so that no secret is in a file that is
# committed. In production, give every NAS its own secret of at least 128 bits
# from a CSPRNG (for example `openssl rand -base64 24`) and prefer RadSec
# (the guide's "RadSec" section), where the NAS is identified by its certificate.

client e2e-nas {
	# The compose network (docker/docker-compose.radius.yml). One /24 here is a
	# test convenience; in production list each NAS by its own address.
	ipaddr = 172.28.78.0/24
	secret = $ENV{RADIUS_SHARED_SECRET}

	# Blast-RADIUS (CVE-2024-3596, RFC 9765): a request without a verifying
	# Message-Authenticator is discarded, and every response carries one. Set per
	# client so that it holds whatever the global default in radiusd.conf is.
	require_message_authenticator = yes
}

client e2e-local {
	# The container's own loopback: the end-to-end test sends one request from
	# here with radclient, with and without a Message-Authenticator, to show the
	# setting above doing its work. Drop this client in production.
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	require_message_authenticator = yes
}
