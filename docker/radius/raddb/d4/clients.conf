# The NASes this FreeRADIUS answers, D4 profile (docker/docker-compose.radius-d4.yml
# mounts this file over ../clients.conf). Identical to it but for `shortname`.
#
# `shortname` is the AXIAM SITE KEY of every request from this client:
# sites-enabled/check-eap-tls posts %{client:shortname} to
# POST /api/v1/network/decide. It comes from this file and never from the packet
# (docs/pki/freeradius.md, "The decision per authentication"), so a NAS cannot
# name another site. Set it on every `client` of a site, to that site's key in
# AXIAM; FreeRADIUS defaults it to the client's name.

client e2e-nas {
	ipaddr = 172.28.78.0/24
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = $ENV{AXIAM_D4_SITE}
	require_message_authenticator = yes
}

client e2e-local {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = $ENV{AXIAM_D4_SITE}
	require_message_authenticator = yes
}
