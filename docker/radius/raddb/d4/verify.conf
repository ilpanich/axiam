# D4 profile only (docker/docker-compose.radius-d4.yml mounts this file; `eap`
# includes it when it is there). docs/pki/freeradius.md, "The decision per
# authentication".
#
# FreeRADIUS 3.2.8 offers the configuration no attribute that holds the client
# certificate or its fingerprint. The one place it shows it is a PEM file that
# exists while this hook runs and is deleted when the hook returns, so the hook
# computes the fingerprint and leaves it for the decision (axiam-d4.sh).
#
# A hook that exits non-zero rejects the certificate: a failure here is a reject.
verify {
	# FreeRADIUS writes the PEM here, and axiam-d4.sh leaves the fingerprints
	# here: a tmpfs of the freerad user's alone (docker-compose.radius-d4.yml).
	tmpdir = /var/run/axiam-d4

	client = "/bin/sh /etc/freeradius/axiam-d4/axiam-d4.sh stash %{TLS-Client-Cert-Filename}"
}
