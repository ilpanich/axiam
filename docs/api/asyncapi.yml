asyncapi: 2.6.0
info:
  title: AXIAM AMQP API
  version: "0.1.0"
  description: |
    AMQP message contracts for AXIAM's async authorization, audit ingestion,
    mail delivery, webhook delivery, SSF push delivery, and notification queues.

    **Hand-authored, not generated.** Derived by field-for-field transcription
    from `crates/axiam-amqp/src/messages.rs` and
    `crates/axiam-amqp/src/connection.rs` (`pub mod queues`) as of v1.2 beta.
    Unlike the REST OpenAPI spec (generated from `utoipa` annotations and
    drift-gated in CI), this document has no codegen link to the Rust source
    — it is a point-in-time snapshot that must be manually re-verified
    whenever `messages.rs` or `connection.rs` changes. See
    `docs/api/README.md` for the full caveat.

    All AMQP payloads flowing through `axiam.authz.request`, `axiam.audit.events`,
    and `axiam.webhook.*` participate in AXIAM's fail-closed security model:
    `AuthzRequest` and `AuditEventMessage` carry a mandatory HMAC-SHA256
    `hmac_signature` (see the `AuthzRequest` message description for the
    exact convention); webhook delivery uses a nack-no-requeue dead-letter
    chain with no silent message loss.

    **Minimal profile.** A server running with `AXIAM__AMQP__ENABLED=false`
    reads none of these queues. A broker confirm for a message published to
    `axiam.authz.request` or `axiam.audit.events` never means AXIAM decided the
    request or recorded the event; it means only that the broker accepted it.
  license:
    name: Apache-2.0
  x-milestone: v1.2 Beta
  x-last-verified: "2026-07-06"
servers:
  rabbitmq:
    url: "{host}:{port}"
    protocol: amqp
    description: >-
      RabbitMQ broker (AMQP 0-9-1). Host/port are deployment-specific
      (see docs/deployment/README.md); the queue topology below is fixed
      by `crates/axiam-amqp/src/connection.rs`.
    variables:
      host:
        default: localhost
        description: RabbitMQ hostname (e.g. the `AXIAM__AMQP__HOST` config value).
      port:
        default: "5672"
        description: RabbitMQ AMQP port.

defaultContentType: application/json

channels:
  axiam.authz.request:
    description: >-
      Inbound async authorization check requests (queue: `axiam.authz.request`,
      durable, autoDelete=false). Consumed by AXIAM; poison messages route to
      `axiam.authz.request.dlq` (CQ-B05).
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.authz.request
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM consumes an authorization check request.
      message:
        $ref: '#/components/messages/AuthzRequest'

  axiam.authz.request.dlq:
    description: >-
      Dead-letter queue for `axiam.authz.request` poison messages (CQ-B05).
      Not consumed by the running application in normal operation; retained
      for operator inspection/replay.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.authz.request.dlq
          durable: true
          autoDelete: false
    publish:
      summary: A poison `AuthzRequest` is dead-lettered here (nack, no requeue).
      message:
        $ref: '#/components/messages/AuthzRequest'

  axiam.authz.response:
    description: >-
      Outbound authorization decision responses (queue: `axiam.authz.response`,
      durable). No DLQ — this is a response queue, not subject to poison-message
      dead-lettering.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.authz.response
          durable: true
          autoDelete: false
    publish:
      summary: AXIAM publishes an authorization decision.
      message:
        $ref: '#/components/messages/AuthzResponse'

  axiam.audit.events:
    description: >-
      Inbound audit events from external services (queue: `axiam.audit.events`,
      durable). Consumed by AXIAM; poison messages route to
      `axiam.audit.events.dlq` (CQ-B05).
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.audit.events
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM consumes an externally-produced audit event.
      message:
        $ref: '#/components/messages/AuditEventMessage'

  axiam.audit.events.dlq:
    description: >-
      Dead-letter queue for `axiam.audit.events` poison messages (CQ-B05).
      Not consumed by the running application in normal operation; retained
      for operator inspection/replay.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.audit.events.dlq
          durable: true
          autoDelete: false
    publish:
      summary: A poison `AuditEventMessage` is dead-lettered here (nack, no requeue).
      message:
        $ref: '#/components/messages/AuditEventMessage'

  axiam.notifications:
    description: >-
      Outbound real-time event notifications (queue: `axiam.notifications`,
      durable). No DLQ.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.notifications
          durable: true
          autoDelete: false
    publish:
      summary: AXIAM publishes a real-time notification event.
      message:
        $ref: '#/components/messages/NotificationEvent'

  axiam.mail.outbound:
    description: >-
      Outbound async mail delivery queue (D-14) (queue: `axiam.mail.outbound`,
      durable). Consumed by AXIAM's mail-delivery worker; messages exhausted
      after retry route to `axiam.mail.outbound.dlq`.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.mail.outbound
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM's mail worker consumes an outbound mail job.
      message:
        $ref: '#/components/messages/OutboundMailMessage'

  axiam.mail.outbound.dlq:
    description: >-
      Dead-letter queue for `axiam.mail.outbound` exhausted-retry messages
      (D-14). Not consumed by the running application in normal operation;
      retained for operator inspection/replay.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.mail.outbound.dlq
          durable: true
          autoDelete: false
    publish:
      summary: A mail job exhausted its retries and is dead-lettered here.
      message:
        $ref: '#/components/messages/OutboundMailMessage'

  axiam.webhook:
    description: >-
      Primary webhook delivery queue (CORR-03/D-07) (queue: `axiam.webhook`,
      durable). Consumed by the webhook AMQP consumer, which drives
      `WebhookDeliveryService::deliver_once` per (re)delivery attempt. A
      terminal nack (requeue=false, `attempt` exhausted against
      `AXIAM__WEBHOOK__MAX_ATTEMPTS`) dead-letters to `axiam.webhook.dlq`.
      Non-terminal failures republish to `axiam.webhook.retry` with an
      incremented `attempt`.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.webhook
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM's webhook consumer processes a delivery attempt.
      message:
        $ref: '#/components/messages/WebhookMessage'

  axiam.webhook.retry:
    description: >-
      Webhook retry-delay queue (CORR-03/D-07) (queue: `axiam.webhook.retry`,
      durable). No consumer is ever attached to this queue — AXIAM publishes
      a `WebhookMessage` here with a per-message TTL
      (`x-message-ttl` / `BasicProperties::with_expiration`), and once the
      TTL expires RabbitMQ dead-letters it back to `axiam.webhook` via the
      default exchange, giving RabbitMQ-native delayed retry without an
      in-process sleep tying up a consumer slot. `attempt` is incremented by
      the `axiam.webhook` consumer before republishing here.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.webhook.retry
          durable: true
          autoDelete: false
    publish:
      summary: >-
        AXIAM publishes a `WebhookMessage` here (with TTL) to delay the next
        delivery attempt; no application ever subscribes to this queue.
      message:
        $ref: '#/components/messages/WebhookMessage'

  axiam.webhook.dlq:
    description: >-
      Terminal dead-letter queue for exhausted webhook deliveries
      (CORR-03/D-07). Messages here are real and replayable — not silently
      dropped. Reached via a terminal nack (requeue=false) from
      `axiam.webhook` once `attempt` exceeds `AXIAM__WEBHOOK__MAX_ATTEMPTS`.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.webhook.dlq
          durable: true
          autoDelete: false
    publish:
      summary: A webhook delivery exhausted all attempts and is dead-lettered here.
      message:
        $ref: '#/components/messages/WebhookMessage'

  axiam.ssf_push:
    description: >-
      Primary Shared Signals Framework push delivery queue (G-5, T23.5.3, D-36,
      D-49) (queue: `axiam.ssf_push`, durable). The same shared outbound
      dispatcher that serves `axiam.webhook`, with queues of its own so one kind's
      backlog never delays the other's. Consumed by the `SsfPush` deliverer, which
      makes **one** push attempt per (re)delivery: it re-reads the stream, signs
      the event against it as it is then, and POSTs the compact SET
      (`application/secevent+jwt`, RFC 8935) with the stored `Authorization`
      header, never following a redirect. A terminal outcome (a `400` with an
      RFC 8935 `err`, `401`, `403`, any other `4xx` but `404`/`408`/`429`, or
      `attempt` exhausted against `AXIAM__SSF_PUSH__MAX_ATTEMPTS`) dead-letters to
      `axiam.ssf_push.dlq`; a retryable one republishes to `axiam.ssf_push.retry`
      with an incremented `attempt`. The message carries the **unsigned** event;
      no signed token is ever queued.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.ssf_push
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM's SSF push consumer makes one delivery attempt.
      message:
        $ref: '#/components/messages/SsfPushMessage'

  axiam.ssf_push.retry:
    description: >-
      SSF push retry-delay queue (queue: `axiam.ssf_push.retry`, durable). No
      consumer is ever attached: AXIAM publishes a `SsfPushMessage` here with a
      per-message TTL (`base x 2^(attempt-1)` clamped to a ceiling, from
      `AXIAM__SSF_PUSH__BACKOFF_BASE_MS` and `AXIAM__SSF_PUSH__BACKOFF_CEILING_MS`),
      and when it expires RabbitMQ dead-letters it back to `axiam.ssf_push` via the
      default exchange.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.ssf_push.retry
          durable: true
          autoDelete: false
    publish:
      summary: >-
        AXIAM publishes a `SsfPushMessage` here (with TTL) to delay the next push
        attempt; no application ever subscribes to this queue.
      message:
        $ref: '#/components/messages/SsfPushMessage'

  axiam.ssf_push.dlq:
    description: >-
      Terminal dead-letter queue for SSF push deliveries that cannot or did not
      succeed (queue: `axiam.ssf_push.dlq`, durable, `x-message-ttl` of seven days,
      D-53). Unlike `axiam.webhook.dlq` it is **bounded**: a dead-lettered message
      holds an unsigned event and so a subject (possibly an address), and the
      broker discards it after seven days. Replayable until then.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.ssf_push.dlq
          durable: true
          autoDelete: false
    publish:
      summary: An SSF push delivery was dead-lettered here; it is discarded after seven days.
      message:
        $ref: '#/components/messages/SsfPushMessage'

  axiam.scim_push:
    description: >-
      Primary outbound SCIM provisioning queue (G-6, T23.6.2, D-36, D-57) (queue:
      `axiam.scim_push`, durable). The third kind of the shared outbound
      dispatcher, with queues of its own so one kind's backlog never delays
      another's. A message is a **reference**, `{resource_type, axiam_id}`, never
      a payload: the `ScimPush` deliverer makes **one** attempt per (re)delivery,
      re-reads the target, the resource and its link, computes the downstream
      state it should have now, and sends `POST`, `PATCH` or `DELETE` to the
      tenant's SCIM 2.0 service provider (`application/scim+json`, RFC 7644),
      never following a redirect. A terminal outcome (`401`/`403` on a bearer
      target, any other `4xx` but `404`/`408`/`429`, a disabled or deleted target,
      or `attempt` exhausted against `AXIAM__SCIM_PUSH__MAX_ATTEMPTS`) dead-letters
      to `axiam.scim_push.dlq`; a retryable one republishes to
      `axiam.scim_push.retry` with an incremented `attempt`. A target whose
      per-target breaker is open (five or more consecutive failures, the last
      within its backoff window; #550) is not called: the attempt is a retry,
      reason `target is failing; backing off`, with no request.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.scim_push
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM's SCIM push consumer makes one delivery attempt.
      message:
        $ref: '#/components/messages/ScimPushMessage'

  axiam.scim_push.retry:
    description: >-
      SCIM push retry-delay queue (queue: `axiam.scim_push.retry`, durable). No
      consumer is ever attached: AXIAM publishes a `ScimPushMessage` here with a
      per-message TTL (`base x 2^(attempt-1)` clamped to a ceiling, from
      `AXIAM__SCIM_PUSH__BACKOFF_BASE_MS` and `AXIAM__SCIM_PUSH__BACKOFF_CEILING_MS`),
      and when it expires RabbitMQ dead-letters it back to `axiam.scim_push` via
      the default exchange.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.scim_push.retry
          durable: true
          autoDelete: false
    publish:
      summary: >-
        AXIAM publishes a `ScimPushMessage` here (with TTL) to delay the next
        attempt; no application ever subscribes to this queue.
      message:
        $ref: '#/components/messages/ScimPushMessage'

  axiam.scim_push.dlq:
    description: >-
      Terminal dead-letter queue for SCIM provisioning messages that cannot or did
      not succeed (queue: `axiam.scim_push.dlq`, durable, `x-message-ttl` of seven
      days, D-57). **Bounded**, like `axiam.ssf_push.dlq`: a message holds only a
      user or group id, but a user id is still an identifier of a person, and the
      broker discards it after seven days. Replayable until then.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.scim_push.dlq
          durable: true
          autoDelete: false
    publish:
      summary: A SCIM provisioning message was dead-lettered here; it is discarded after seven days.
      message:
        $ref: '#/components/messages/ScimPushMessage'

  axiam.ciba_ping:
    description: >-
      Primary CIBA ping queue (G-7, T23.7.2, D-36, D-65) (queue: `axiam.ciba_ping`,
      durable). The fourth kind of the shared outbound dispatcher, with queues of
      its own so one kind's backlog never delays another's. A message is the
      request's **record id** and tenant and nothing else: never the `auth_req_id`
      or the client's `client_notification_token`, both of which stay sealed in the
      request row. The `CibaPing` deliverer makes **one** attempt per
      (re)delivery: it re-reads the request and the client, opens the sealed
      credentials, and sends `POST {"auth_req_id": …}` with `Authorization: Bearer
      <client_notification_token>` to the client's registered
      `backchannel_client_notification_endpoint` (CIBA Core §10.2) through
      `guarded_fetch_no_redirect` with `allow_private = false`, never following a
      redirect. A message is queued after an approval **and** after a denial. A
      terminal outcome (a `4xx` other than `408`/`429`, a request that is gone or
      expired, a client that no longer receives pings, or `attempt` exhausted
      against `AXIAM__CIBA_PING__MAX_ATTEMPTS`) dead-letters to
      `axiam.ciba_ping.dlq`; a retryable one republishes to
      `axiam.ciba_ping.retry` with an incremented `attempt`.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.ciba_ping
          durable: true
          autoDelete: false
    subscribe:
      summary: AXIAM's CIBA ping consumer makes one delivery attempt.
      message:
        $ref: '#/components/messages/CibaPingMessage'

  axiam.ciba_ping.retry:
    description: >-
      CIBA ping retry-delay queue (queue: `axiam.ciba_ping.retry`, durable). No
      consumer is ever attached: AXIAM publishes a `CibaPingMessage` here with a
      per-message TTL (`base x 2^(attempt-1)` clamped to a ceiling, from
      `AXIAM__CIBA_PING__BACKOFF_BASE_MS` and `AXIAM__CIBA_PING__BACKOFF_CEILING_MS`),
      and when it expires RabbitMQ dead-letters it back to `axiam.ciba_ping` via
      the default exchange.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.ciba_ping.retry
          durable: true
          autoDelete: false
    publish:
      summary: >-
        AXIAM publishes a `CibaPingMessage` here (with TTL) to delay the next
        attempt; no application ever subscribes to this queue.
      message:
        $ref: '#/components/messages/CibaPingMessage'

  axiam.ciba_ping.dlq:
    description: >-
      Terminal dead-letter queue for CIBA pings that cannot or did not succeed
      (queue: `axiam.ciba_ping.dlq`, durable, `x-message-ttl` of seven days, D-65).
      **Bounded**, like the other new kinds' DLQs: a message holds a request's
      record id, which names a person's sign-in attempt, and the broker discards
      it after seven days. Replayable until then.
    bindings:
      amqp:
        is: queue
        queue:
          name: axiam.ciba_ping.dlq
          durable: true
          autoDelete: false
    publish:
      summary: A CIBA ping was dead-lettered here; it is discarded after seven days.
      message:
        $ref: '#/components/messages/CibaPingMessage'

components:
  messages:
    AuthzRequest:
      name: AuthzRequest
      title: Authorization check request
      summary: >-
        Authorization check request received from `axiam.authz.request`
        (source: crates/axiam-amqp/src/messages.rs L125-146).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthzRequest'

    AuthzResponse:
      name: AuthzResponse
      title: Authorization decision response
      summary: >-
        Authorization decision published to `axiam.authz.response`
        (source: crates/axiam-amqp/src/messages.rs L148-153).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthzResponse'

    AuditEventMessage:
      name: AuditEventMessage
      title: Audit event
      summary: >-
        Audit event received from external services via `axiam.audit.events`;
        maps directly to `CreateAuditLogEntry` in `axiam-core`
        (source: crates/axiam-amqp/src/messages.rs L159-174).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuditEventMessage'

    NotificationEvent:
      name: NotificationEvent
      title: Notification event
      summary: >-
        Notification event published to `axiam.notifications`
        (source: crates/axiam-amqp/src/messages.rs L187-196).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationEvent'

    OutboundMailMessage:
      name: OutboundMailMessage
      title: Outbound mail job
      summary: >-
        Outbound mail message published to `axiam.mail.outbound` (D-14).
        Defined in `axiam_core::models::mail` and re-exported by
        `crates/axiam-amqp/src/messages.rs` (module doc, L1-13) so crates
        that cannot depend on `axiam-amqp` (e.g. `axiam-audit`) can still
        build outbound mail messages.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OutboundMailMessage'

    SsfPushMessage:
      name: SsfPushMessage
      title: SSF push delivery attempt
      summary: >-
        The shared outbound envelope (`axiam_core::outbound::OutboundMessage`)
        for `kind` `ssf_push`, carried on `axiam.ssf_push` /
        `axiam.ssf_push.retry` / `axiam.ssf_push.dlq` (T23.5.3, D-36).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SsfPushMessage'

    ScimPushMessage:
      name: ScimPushMessage
      title: Outbound SCIM provisioning attempt
      summary: >-
        The shared outbound envelope (`axiam_core::outbound::OutboundMessage`)
        for `kind` `scim_push`, carried on `axiam.scim_push` /
        `axiam.scim_push.retry` / `axiam.scim_push.dlq` (T23.6.2, D-36, D-57).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ScimPushMessage'

    CibaPingMessage:
      name: CibaPingMessage
      title: CIBA ping delivery attempt
      summary: >-
        The shared outbound envelope (`axiam_core::outbound::OutboundMessage`)
        for `kind` `ciba_ping`, carried on `axiam.ciba_ping` /
        `axiam.ciba_ping.retry` / `axiam.ciba_ping.dlq` (T23.7.2, D-36, D-65).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CibaPingMessage'

    WebhookMessage:
      name: WebhookMessage
      title: Webhook delivery attempt
      summary: >-
        Webhook delivery message carried on `axiam.webhook` /
        `axiam.webhook.retry` / `axiam.webhook.dlq` (CORR-03/D-07)
        (source: crates/axiam-amqp/src/messages.rs L214-221).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WebhookMessage'

  schemas:
    AuthzRequest:
      type: object
      description: >-
        HMAC-SHA256-signed (SEC-022/055). `hmac_signature` is computed over
        the JSON-serialized payload with `hmac_signature` itself set to
        null, using a per-tenant subkey derived via HKDF-SHA256
        (`derive_tenant_key`, SECHRD-08/D-05a/b) from a shared master key,
        domain-separated and versioned by `key_version`. Consumers reject
        (nack, no requeue) whenever the signature is absent or invalid —
        there is no fail-open path (D-05c).


        NEW-4 (v2, BREAKING): the signed body additionally carries a
        mandatory `nonce` + `issued_at` for replay protection. This is a
        HARD CUTOVER — consumers reject (nack, no requeue) any message with
        `key_version < 2`, a stale/future `issued_at` (outside ±5 min), or a
        replayed `nonce`. Producers MUST upgrade to emit v2 before the
        enforcing server is deployed. Signed field order:
        correlation_id, tenant_id, subject_id, action, resource_id,
        scope?, key_version, nonce, issued_at (hmac_signature absent).
      required:
        - correlation_id
        - tenant_id
        - subject_id
        - action
        - resource_id
        - key_version
        - nonce
        - issued_at
      properties:
        correlation_id:
          type: string
          format: uuid
          description: Caller-provided ID to correlate request with response.
        tenant_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        action:
          type: string
        resource_id:
          type: string
          format: uuid
        scope:
          type: string
          nullable: true
        key_version:
          type: integer
          minimum: 0
          maximum: 255
          description: >-
            HKDF master-key rotation version (SECHRD-08/D-05b). Selects
            which per-tenant subkey derivation the signature was produced
            with. As of NEW-4 the current value is 2; consumers reject
            `key_version < 2` (hard cutover — no v1 grace path).
        nonce:
          type: string
          format: uuid
          description: >-
            NEW-4 replay-protection nonce. Per-message unique UUID, ALWAYS
            emitted (inside the signed body, immediately after
            `key_version`). The consumer records (tenant_id, nonce) in a
            durable store; a duplicate within the freshness window is a
            replay and is rejected.
        issued_at:
          type: string
          format: date-time
          description: >-
            NEW-4 producer send time (RFC3339 UTC), ALWAYS emitted (inside
            the signed body, immediately after `nonce`). Rejected when
            outside ±`AXIAM__AMQP__REPLAY_SKEW_SECS` (default 300s) of the
            consumer clock.
        hmac_signature:
          type: string
          nullable: true
          description: >-
            HMAC-SHA256 hex digest of the JSON-serialized body (this field
            set to null/absent during signing). Mandatory on the wire — the
            consumer rejects both unsigned and invalid-signature messages
            (no fail-open path).

    AuthzResponse:
      type: object
      required:
        - correlation_id
        - allowed
      properties:
        correlation_id:
          type: string
          format: uuid
        allowed:
          type: boolean
        reason:
          type: string
          nullable: true

    AuditEventMessage:
      type: object
      description: >-
        HMAC-SHA256-signed (SEC-022/055), same convention as `AuthzRequest`
        (per-tenant HKDF-derived subkey, `key_version` on the wire,
        fail-closed — no accept-when-absent path, SECHRD-08/D-05a/b/c).


        NEW-4 (v2, BREAKING): also carries the mandatory `nonce` + `issued_at`
        replay-protection fields (hard cutover — consumers reject
        `key_version < 2`, stale `issued_at`, or a replayed `nonce`). Signed
        field order: tenant_id, actor_id, actor_type, action, resource_id?,
        outcome, ip_address?, metadata?, key_version, nonce, issued_at
        (hmac_signature absent).
      required:
        - tenant_id
        - actor_id
        - actor_type
        - action
        - outcome
        - key_version
        - nonce
        - issued_at
      properties:
        tenant_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_type:
          type: string
        action:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        outcome:
          type: string
        ip_address:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        key_version:
          type: integer
          minimum: 0
          maximum: 255
          description: >-
            As of NEW-4 the current value is 2; consumers reject
            `key_version < 2` (hard cutover).
        nonce:
          type: string
          format: uuid
          description: >-
            NEW-4 replay-protection nonce (per-message unique UUID), ALWAYS
            emitted inside the signed body immediately after `key_version`.
        issued_at:
          type: string
          format: date-time
          description: >-
            NEW-4 producer send time (RFC3339 UTC), ALWAYS emitted inside the
            signed body immediately after `nonce`; rejected outside the
            freshness window.
        hmac_signature:
          type: string
          nullable: true
          description: >-
            HMAC-SHA256 hex digest, same mandatory fail-closed convention as
            `AuthzRequest.hmac_signature`.

    NotificationEvent:
      type: object
      required:
        - event_type
        - tenant_id
        - actor_id
        - timestamp
      properties:
        event_type:
          type: string
        tenant_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
          nullable: true
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          nullable: true
          additionalProperties: true

    OutboundMailMessage:
      type: object
      description: >-
        All fields except `to_address` are safe to include in audit
        metadata. `to_address` is present for delivery only — MUST NOT be
        logged in audit events (D-16); consumers MUST exclude it from any
        audit records they produce. `to_address` is advisory only — the
        actual recipient is always resolved server-side from
        `user_id`+`tenant_id` to prevent recipient hijacking (SEC-055).
      required:
        - mail_type
        - tenant_id
        - org_id
        - user_id
        - to_address
        - template_context
        - attempt_count
        - enqueued_at
      properties:
        mail_type:
          type: string
          enum:
            - PasswordReset
            - EmailVerification
            - Notification
            - DeletionCancel
            - ExportReady
        tenant_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        to_address:
          type: string
          description: >-
            Delivery address, advisory only. MUST NOT appear in audit log
            metadata (D-16).
        template_context:
          type: object
          additionalProperties: true
        attempt_count:
          type: integer
          minimum: 0
        enqueued_at:
          type: string
          format: date-time

    SsfPushMessage:
      type: object
      description: >-
        The shared outbound envelope for the SSF push kind. `target_id` is the
        stream id and `delivery_id` is the event's `jti` read as a UUID, so a
        retried push carries the identical SET. `payload` is an **unsigned**
        pending event (`jti`, `iat`, `event_uri`, `event`, `sub_id`, `txn`);
        the SET is signed at each attempt, against the stream as it is then.
        `attempt` is incremented on each republish to `axiam.ssf_push.retry`
        and checked against `AXIAM__SSF_PUSH__MAX_ATTEMPTS`.
      required:
        - kind
        - tenant_id
        - target_id
        - delivery_id
        - event_type
        - payload
        - attempt
      properties:
        kind:
          type: string
          enum: [ssf_push]
        tenant_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          description: The stream id.
        delivery_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: The event-type URI.
        payload:
          type: object
          additionalProperties: true
        attempt:
          type: integer
          minimum: 0

    ScimPushMessage:
      type: object
      description: >-
        The shared outbound envelope for the SCIM push kind. `target_id` is the
        SCIM target id. `payload` is a **reference** and nothing else:
        `{resource_type, axiam_id}`. No attribute of a person ever sits in the
        queue or the dead-letter queue; the deliverer reads the resource at each
        attempt. `attempt` is incremented on each republish to
        `axiam.scim_push.retry` and checked against `AXIAM__SCIM_PUSH__MAX_ATTEMPTS`.
      required:
        - kind
        - tenant_id
        - target_id
        - delivery_id
        - event_type
        - payload
        - attempt
      properties:
        kind:
          type: string
          enum: [scim_push]
        tenant_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          description: The SCIM target id.
        delivery_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [scim.user, scim.group]
        payload:
          type: object
          required: [resource_type, axiam_id]
          properties:
            resource_type:
              type: string
              enum: [user, group]
            axiam_id:
              type: string
              format: uuid
              description: The AXIAM user or group id; sent downstream as `externalId`.
          additionalProperties: false
        attempt:
          type: integer
          minimum: 0

    CibaPingMessage:
      type: object
      description: >-
        The shared outbound envelope for the CIBA ping kind. `target_id` is the
        CIBA request's **record id**; `payload` is `null`. Neither the
        `auth_req_id` nor the client's `client_notification_token` is ever in the
        queue or the dead-letter queue: the deliverer reads the request and opens
        its sealed credentials at each attempt. `attempt` is incremented on each
        republish to `axiam.ciba_ping.retry` and checked against
        `AXIAM__CIBA_PING__MAX_ATTEMPTS`.
      required:
        - kind
        - tenant_id
        - target_id
        - delivery_id
        - event_type
        - payload
        - attempt
      properties:
        kind:
          type: string
          enum: [ciba_ping]
        tenant_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          description: The CIBA request's record id.
        delivery_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [ciba.ping]
        payload:
          type: 'null'
        attempt:
          type: integer
          minimum: 0

    WebhookMessage:
      type: object
      description: >-
        `tenant_id` is required so `deliver_once` can resolve the webhook via
        the tenant-scoped `WebhookRepository::get_by_id` without a
        cross-tenant lookup, consistent with AXIAM's multi-tenant
        data-isolation model. `attempt` is incremented by the consumer on
        each republish to `axiam.webhook.retry` and checked against
        `AXIAM__WEBHOOK__MAX_ATTEMPTS` before a terminal nack routes the
        message to `axiam.webhook.dlq`.
      required:
        - webhook_id
        - delivery_id
        - tenant_id
        - event_type
        - payload
        - attempt
      properties:
        webhook_id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        attempt:
          type: integer
          minimum: 0
