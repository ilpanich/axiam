[package]
name = "b3-mesh-delegation-grpc"
version = "0.1.0"
edition = "2024"
publish = false
description = "B3 — OAuth2 Token Exchange (RFC 8693) mesh-delegation example, end to end onto the gRPC AuthorizationService."

# Deliberately its own workspace root (this empty table, not a member list)
# so this crate is detached from the main repo's Cargo workspace at
# ../../Cargo.toml. Nothing here needs to be a workspace member — it is a
# standalone example, built and run on its own.
[workspace]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde_json = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
base64 = "0.23"
url = "2"
anyhow = "1"

[build-dependencies]
tonic-prost-build = "0.14"
