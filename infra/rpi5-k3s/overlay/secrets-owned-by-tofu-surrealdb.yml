# K8S-F8: remove the three blank credential Secrets from the render.
#
# `k8s/surrealdb/secret.yml`, `k8s/rabbitmq/secret.yml` and
# `k8s/server/secret.yml` ship with empty values, by design — a manifest with a
# real password in it is a manifest nobody can commit. On this Pi they are
# created by `infra/rpi5-k3s/tofu/20-axiam` instead, from `random_password`, and
# this patch takes them out of the kustomize render so there is exactly ONE
# manager per object.
#
# That is not tidiness. Two managers of a Secret is how a `kubectl apply -k` at
# the wrong moment blanks a live datastore's password — and the value it blanks
# is not re-mintable: SurrealDB and RabbitMQ record their credentials on the
# first boot of an empty volume, so the password in the Secret is the one the
# server PRESENTS, not the one the datastore can be told to accept.
#
# CONSEQUENCE: this overlay is not applicable on its own. `kubectl apply -k
# infra/rpi5-k3s/overlay` gives you a deployment whose server pod sits in
# CreateContainerConfigError saying `secret "axiam-secrets" not found`. That is
# correct and fail-closed — use `infra/rpi5-k3s/run.sh 20-axiam apply`.
#
# `axiam-key-material` is deliberately NOT deleted. It is inert under the
# `vault` secret provider (nothing reads /etc/axiam/secrets) but it is still
# mounted, so it has to exist — and leaving it is what makes falling back to the
# `file` provider a one-line revert on a night when Vault will not unseal.
---
apiVersion: v1
kind: Secret
metadata:
  name: surrealdb-credentials
  namespace: axiam
$patch: delete
