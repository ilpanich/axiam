apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: axiam

commonLabels:
  app: axiam

resources:
  - namespace.yml
  - server/deployment.yml
  - server/service.yml
  - server/hpa.yml
  - server/configmap.yml
  - server/secret.yml
  - frontend/deployment.yml
  - frontend/service.yml
  - ingress.yml
  - vault/statefulset.yml
  - surrealdb/statefulset.yml
  - surrealdb/service.yml
  - surrealdb/secret.yml
  - rabbitmq/statefulset.yml
  - rabbitmq/service.yml
  - rabbitmq/secret.yml
  - network-policy/default-deny.yml
  - network-policy/allow-dns-egress.yml
  - network-policy/server-egress.yml
  - network-policy/allow-ingress-to-server.yml
  - network-policy/allow-ingress-to-frontend.yml
  # SEC-053: the receiver-side halves of the datastore and broker paths.
  # NetworkPolicy is evaluated at BOTH ends — `server-egress` permitting
  # server -> surrealdb:8000 counts for nothing while `default-deny-all` is
  # still denying ingress on the SurrealDB pod. Leaving these two out of the
  # resource list did not merely weaken the model, it broke the deployment:
  # the server could reach neither its datastore nor its broker.
  - network-policy/allow-ingress-to-surrealdb.yml
  - network-policy/allow-ingress-to-rabbitmq.yml
