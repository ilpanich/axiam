apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-rabbitmq
  namespace: axiam
spec:
  # SEC-053: Receiver-side ingress policy — restrict RabbitMQ to accept
  # connections only from axiam-server pods (default-deny complement).
  podSelector:
    matchLabels:
      component: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: server
      ports:
        # A6: AMQPS only. The broker no longer listens on plaintext 5672, so
        # allowing it would permit a path that cannot be established -- and,
        # worse, would leave the policy reading as if plaintext were expected.
        - protocol: TCP
          port: 5671
