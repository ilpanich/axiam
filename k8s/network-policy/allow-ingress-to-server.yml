apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-server
  namespace: axiam
spec:
  podSelector:
    matchLabels:
      component: server
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress controller → server:8090 (D-11)
    # Adjust the namespaceSelector label to match your ingress controller namespace.
    # Common values: ingress-nginx, kube-ingress, or the namespace where your ingress controller runs.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx  # TODO: operator must adjust to match ingress controller namespace
          # SA-45: same `from` entry as the namespaceSelector, so the two AND:
          # only the controller pods of that namespace, not every pod in it
          # (admission-webhook jobs, default-backend, anything else installed
          # there). These are the ingress-nginx Helm chart's labels; adjust
          # them if you run a different controller.
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8090
