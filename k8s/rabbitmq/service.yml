apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: axiam
  labels:
    app: axiam
    component: rabbitmq
spec:
  clusterIP: None
  selector:
    app: axiam
    component: rabbitmq
  ports:
    # A6: TLS only. The plaintext 5672 listener is disabled on the broker, so
    # publishing a 5672 Service port would advertise a path that does not exist.
    - name: amqps
      port: 5671
      targetPort: 5671
    - name: management
      port: 15672
      targetPort: 15672
