apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: axiam
  labels:
    app: axiam
    component: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: axiam
      component: rabbitmq
  template:
    metadata:
      labels:
        app: axiam
        component: rabbitmq
    spec:
      # Pod-level restricted security context (KSV-0118). Mirrors the container
      # context below; fsGroup makes the /var/lib/rabbitmq PVC writable under the
      # non-root rabbitmq UID (999).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            # T-131: a dedicated vhost rather than the default `/`.
            #
            # A vhost is RabbitMQ's authorization boundary: permissions are
            # granted per (user, vhost), and exchanges and queues in different
            # vhosts cannot see each other at all. On the default `/` any other
            # user with default-vhost permissions shares AXIAM's namespace —
            # which matters most on a broker AXIAM does not have to itself, the
            # normal case in a real cluster.
            #
            # Honoured ONLY on the first boot of an empty data volume, like the
            # user and password above. Changing it later requires creating the
            # vhost with rabbitmqctl and granting permissions, not editing this.
            - name: RABBITMQ_DEFAULT_VHOST
              value: "axiam"
            # A6: AMQPS listener on 5671, TLS 1.3 only (the project standard is
            # "TLS 1.3 minimum for all external communication"). The plaintext
            # 5672 listener is switched OFF -- leaving it up would make the
            # amqps:// URL a preference rather than a guarantee, since anything
            # failing TLS could quietly reconnect in the clear.
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: >-
                -rabbit listeners.tcp []
                -rabbit listeners.ssl.default 5671
                -rabbit ssl_options.cacertfile "/etc/rabbitmq/tls/ca.crt"
                -rabbit ssl_options.certfile   "/etc/rabbitmq/tls/tls.crt"
                -rabbit ssl_options.keyfile    "/etc/rabbitmq/tls/tls.key"
                -rabbit ssl_options.verify verify_none
                -rabbit ssl_options.fail_if_no_peer_cert false
                -rabbit ssl_options.versions ['tlsv1.3']
          securityContext:
            runAsNonRoot: true
            # D-13 best-effort: RabbitMQ default UID is 999 (rabbitmq user in official image)
            # If volume permission errors occur at runtime, add an initContainer: chown 999:999 /var/lib/rabbitmq
            runAsUser: 999
            readOnlyRootFilesystem: true      # KSV-0014: immutable root fs (see writable emptyDir mounts below)
            allowPrivilegeEscalation: false   # D-13: restricted profile
            capabilities:
              drop:
                - ALL                 # D-13: restricted profile
            seccompProfile:
              type: RuntimeDefault    # D-13: restricted profile
          ports:
            # A6: 5671 is the only AMQP port the broker listens on now; 5672 is
            # kept out of the manifest entirely rather than declared-and-unused,
            # so a NetworkPolicy reviewer cannot mistake it for a live path.
            - containerPort: 5671
              name: amqps
              protocol: TCP
            - containerPort: 15672
              name: management
              protocol: TCP
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            # Writable paths required under a read-only root fs (KSV-0014): the
            # entrypoint regenerates config under /etc/rabbitmq on each start,
            # and the broker writes logs/scratch to /var/log/rabbitmq and /tmp.
            - name: rabbitmq-etc
              mountPath: /etc/rabbitmq
            - name: rabbitmq-logs
              mountPath: /var/log/rabbitmq
            - name: tmp
              mountPath: /tmp
            # A6: broker certificate + key + issuing CA. cert-manager is the
            # recommended issuer -- a Certificate resource with
            # `dnsNames: [rabbitmq, rabbitmq.axiam.svc.cluster.local]` writing
            # into this Secret gives automatic renewal, which matters because a
            # broker certificate that silently expires takes the whole async
            # plane down. Bring-your-own works identically: create the Secret
            # with tls.crt / tls.key / ca.crt keys.
            - name: broker-tls
              mountPath: /etc/rabbitmq/tls
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_running"]
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_running"]
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        # Writable scratch required because the root filesystem is read-only
        # (KSV-0014). Durable broker state (mnesia, .erlang.cookie) stays on the
        # PVC mounted at /var/lib/rabbitmq.
        - name: rabbitmq-etc
          emptyDir: {}
        - name: rabbitmq-logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: broker-tls
          secret:
            secretName: rabbitmq-broker-tls
            # 0440: readable by the broker's group, never world-readable -- this
            # Secret holds the broker's private key.
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
