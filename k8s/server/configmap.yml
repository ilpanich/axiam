apiVersion: v1
kind: ConfigMap
metadata:
  name: axiam-config
  namespace: axiam
  labels:
    app: axiam
    component: server
data:
  # NOTE: Keys use DOUBLE underscore after AXIAM (AXIAM__) so config-rs
  # .with_prefix("AXIAM").separator("__") parses them correctly.
  # Single-underscore keys (AXIAM_DB__*) are silently ignored — SEC-052.
  AXIAM__DB__URL: "surrealdb:8000"
  AXIAM__DB__NAMESPACE: "axiam"
  AXIAM__DB__DATABASE: "axiam"
  # A6: TLS to the broker. HMAC signing stays mandatory regardless -- TLS gives
  # confidentiality in transit, HMAC gives end-to-end authenticity and replay
  # protection across broker hops. They are layers, not alternatives.
  AXIAM__AMQP__URL: "amqps://rabbitmq:5671"
  # The broker certificate is issued by an in-cluster CA (cert-manager), which
  # the system root store does not know about, so the bundle must be supplied.
  # There is deliberately no verification-skip option in the AMQP client.
  AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.crt"
  AXIAM__SERVER__HOST: "0.0.0.0"
  AXIAM__GRPC__HOST: "0.0.0.0"
  # SEC-052: Narrow RUST_LOG — no internal module exposure in production
  RUST_LOG: "info"
