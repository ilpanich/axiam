apiVersion: v1
kind: ConfigMap
metadata:
  name: axiam-config
  namespace: axiam
  labels:
    app: axiam
    component: server
data:
  # NOTE: Keys use DOUBLE underscore after AXIAM (AXIAM__) so config-rs
  # .with_prefix("AXIAM").separator("__") parses them correctly.
  # Single-underscore keys (AXIAM_DB__*) are silently ignored — SEC-052.
  AXIAM__DB__URL: "surrealdb:8000"
  AXIAM__DB__NAMESPACE: "axiam"
  AXIAM__DB__DATABASE: "axiam"
  # AXIAM__AMQP__URL is NOT here. `AmqpConfig` has only a `url` field, so the
  # broker credentials have to be embedded in it, which makes the whole value a
  # secret and disqualifies it from a ConfigMap (T-131/T-132). It lives in the
  # `axiam-secrets` Secret instead.
  #
  # The value that used to be here — `amqps://rabbitmq:5671`, with no
  # credentials at all — could never have authenticated: lapin falls back to
  # guest/guest, which this broker does not accept and which RabbitMQ restricts
  # to loopback anyway.
  #
  # A6: TLS to the broker. HMAC signing stays mandatory regardless -- TLS gives
  # confidentiality in transit, HMAC gives end-to-end authenticity and replay
  # protection across broker hops. They are layers, not alternatives.
  # The broker certificate is issued by an in-cluster CA (cert-manager), which
  # the system root store does not know about, so the bundle must be supplied.
  # There is deliberately no verification-skip option in the AMQP client.
  AXIAM__AMQP__TLS__CA_CERT_PATH: "/etc/axiam/broker-tls/ca.crt"
  AXIAM__SERVER__HOST: "0.0.0.0"
  AXIAM__GRPC__HOST: "0.0.0.0"
  # ---------------------------------------------------------------------
  # Rate-limit keying
  # ---------------------------------------------------------------------
  #
  # trusted_hops = (reverse proxies between the client and the server) - 1.
  #
  # A proxy appends the address it received FROM, not its own
  # (`proxy_add_x_forwarded_for`), so the nearest proxy is the socket peer and
  # never appears in X-Forwarded-For. `k8s/ingress.yml` puts exactly ONE proxy
  # in front — ingress-nginx routes /api, /oauth2 and /.well-known here
  # directly — so the header the server reads is just `<client>` and the value
  # is 0.
  #
  # RAISE IT BY ONE FOR EVERY ADDITIONAL PROXY. A cloud L7 load balancer in
  # front of the ingress makes it 1; a service mesh sidecar that also appends
  # makes it 2. Get it too HIGH and the extractor discards the header entirely
  # and keys every client on the internet to the proxy's address — one global
  # bucket, including /auth/login, which is deliberately always per-IP so that
  # an attacker cannot lock out a victim. Get it too LOW and you key off a proxy
  # instead of the client, which fails the same way.
  #
  # Set explicitly even though 0 is the built-in default: a value that is
  # correct by accident is one nobody re-derives when they add a load balancer.
  # Derivation and worked table: claude_dev/public-backend-tls-design.md §4.
  #
  # Read via std::env::var directly rather than through the config layer, but
  # the name is the same either way.
  AXIAM__RATE_LIMIT__TRUSTED_HOPS: "0"
  # ---------------------------------------------------------------------
  # Forwarded client certificates
  # ---------------------------------------------------------------------
  #
  # Left at its default of false, i.e. an X-Client-Certificate header is NOT
  # accepted as device identity. ingress-nginx terminates TLS here, so a client
  # certificate presented to it never reaches rustls — which means the only way
  # this deployment could do certificate-based device auth through the ingress
  # is the header, and the header proves nothing: a certificate is public data
  # and there is no handshake on that path to prove possession of its key.
  #
  # If you enrol IoT devices, give them a route that is NOT terminated by the
  # ingress — a TCP passthrough Service, or a second hostname — and let rustls
  # verify the certificate itself. See claude_dev/public-backend-tls-design.md
  # §11. Turn this on only if the ingress performs the mTLS handshake AND
  # overwrites the header on every request it forwards.
  AXIAM__AUTH__TRUST_FORWARDED_CLIENT_CERT: "false"
  # SEC-052: Narrow RUST_LOG — no internal module exposure in production
  RUST_LOG: "info"
  # ---------------------------------------------------------------------
  # Secret provider (see docs/deployment/vault.md)
  # ---------------------------------------------------------------------
  #
  # `vault` is the default here, and mandatory for production. The point is
  # that everything below is safe to read: an operator can `kubectl get
  # configmap axiam-config -o yaml` and learn where secrets live without
  # learning any of them.
  #
  # The three other providers, for reference:
  #   env  — AXIAM__AUTH__<NAME> variables. Fine for development, and what a
  #          plain `docker compose up` uses. Puts the OPAQUE setup key in the
  #          pod spec, where `kubectl describe pod` shows it.
  #   file — one file per key under AXIAM__AUTH__SECRET_DIR. Use this with a
  #          CSI secrets driver (Vault Agent Injector, External Secrets,
  #          AWS/GCP CSI) that materialises secrets as files.
  AXIAM__AUTH__SECRET_PROVIDER: "vault"
  AXIAM__AUTH__VAULT_ADDR: "https://vault.axiam.svc.cluster.local:8200"
  AXIAM__AUTH__VAULT_MOUNT: "secret"
  AXIAM__AUTH__VAULT_PATH: "axiam"
