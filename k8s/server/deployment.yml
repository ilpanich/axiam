apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiam-server
  namespace: axiam
  labels:
    app: axiam
    component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axiam
      component: server
  template:
    metadata:
      labels:
        app: axiam
        component: server
    spec:
      # An orderly stop waits up to 20 s for requests in flight, 5 s for gRPC and
      # 5 s for the audit queue (#569). The default of 30 s leaves no margin, and
      # a pod killed during the audit drain loses the rows it still holds.
      terminationGracePeriodSeconds: 40
      # Pod-level restricted security context (KSV-0118). Container-level
      # contexts below remain authoritative; this satisfies the pod-scope check.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # T-132: group-owns the mounted secret volumes so 0440 key material is
        # readable by the non-root container user. Without this, Kubernetes
        # leaves secret files as root:root and the 0440 mode locks the server
        # out of its own keys — see the `key-material` volume below.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: axiam-server
          # Pin a concrete tag, not :latest (KSV-0013). Update per release.
          #
          # K8S-F7: `OWNER` is a placeholder, and deliberately so — this base is
          # meant to be usable by a fork publishing to its own registry. For the
          # upstream project the real path is
          # `ghcr.io/ilpanich/axiam/server`, the tag is the workspace version
          # with the leading `v` stripped, and linux/amd64 + linux/arm64 ship
          # under one manifest list. There are no moving tags — no `latest`, no
          # `1.0` — so nothing drifts under you. Set both names in an overlay
          # (`images:` in kustomization.yml); infra/rpi5-k3s/overlay does.
          image: ghcr.io/OWNER/server:1.0.0-beta19
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # K8S-F5: `scheme: HTTPS`, because the listener these probe now
          # terminates TLS (AXIAM__SERVER__TLS__ENABLED in the ConfigMap).
          # Left at the default of HTTP, both probes fail forever, the pod never
          # becomes Ready and the Deployment reports a rollout that will not
          # finish — with a perfectly healthy server behind it.
          #
          # The kubelet does not verify the certificate on an HTTPS probe, by
          # design, so there is no CA bundle to give it and no name to match.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8090
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: axiam-config
            - secretRef:
                name: axiam-secrets
          env:
            # T-132: read cryptographic material from mounted files rather than
            # from AXIAM__* environment variables. `file` resolves each logical
            # secret name to <dir>/<name>; see k8s/server/key-material-secret.yml.
            #
            # An unknown provider name is refused at startup rather than falling
            # back to `env`, so a typo here stops the server instead of quietly
            # reverting it to reading variables that are no longer set.
            - name: AXIAM__AUTH__SECRET_PROVIDER
              value: "file"
            - name: AXIAM__AUTH__SECRET_DIR
              value: "/etc/axiam/secrets"
          volumeMounts:
            # A6: the CA bundle that verifies the broker certificate. Only the
            # `ca.crt` key is projected -- the server verifies the broker, it
            # does not need (and must not hold) the broker's private key.
            - name: broker-tls-ca
              mountPath: /etc/axiam/broker-tls
              readOnly: true
            # T-132: one file per logical secret name.
            - name: key-material
              mountPath: /etc/axiam/secrets
              readOnly: true
            # K8S-F5: the server's own TLS leaf. NOT mounted with `subPath` —
            # the kubelet does not refresh a subPath mount, and this leaf is
            # renewed in place by cert-manager and re-read by the server's
            # hourly poll. A subPath here would serve an expired certificate
            # from a process that believes it reloaded.
            - name: server-tls
              mountPath: /etc/axiam/server-tls
              readOnly: true
            # P23W5-A7: the audit dead-letter file (AXIAM__GDPR_AUDIT_DLQ_FILE in
            # the ConfigMap). The root filesystem is read-only, so without this
            # the key would name a path the server cannot create. Writable by the
            # container user through the pod's `fsGroup`.
            - name: audit-dlq
              mountPath: /var/lib/axiam/audit-dlq
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless/cc-debian12:nonroot UID (D-08)
            runAsGroup: 65532         # KSV-0021: non-root GID > 10000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false   # D-13: restricted profile
            capabilities:
              drop:
                - ALL                 # D-13: restricted profile
            seccompProfile:
              type: RuntimeDefault    # D-13: restricted profile
      volumes:
        - name: broker-tls-ca
          secret:
            secretName: rabbitmq-broker-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        # T-132: key material, mounted 0440 rather than the 0444 used for the
        # broker CA above. The CA is a public certificate and world-readable is
        # correct for it; these are signing and encryption keys, so they are
        # readable only by root and by the pod's fsGroup.
        #
        # 0440 REQUIRES the `fsGroup: 65532` in the pod securityContext.
        # Kubernetes gives secret-volume files to root:root by default, so
        # without fsGroup a 0440 file is unreadable by the non-root container
        # user (65532) and the server fails at startup reporting every secret
        # as absent. Changing one without the other breaks the deployment.
        - name: key-material
          secret:
            secretName: axiam-key-material
            defaultMode: 0440
        # K8S-F5: issued by the in-cluster CA — see k8s/certs/. 0440 for the
        # same reason as the key material above: this Secret holds a private
        # key, and 0440 is readable by the container only because the pod sets
        # `fsGroup: 65532`. Change one without the other and the server fails at
        # startup with `failed to open TLS key file`.
        - name: server-tls
          secret:
            secretName: axiam-server-tls
            defaultMode: 0440
        # P23W5-A7: the audit dead-letter file. An `emptyDir`, deliberately, and
        # the trade is worth stating: this is a Deployment of 2-10 replicas under
        # an HPA, and the file is per replica. A PersistentVolumeClaim here would
        # be one ReadWriteOnce volume shared by every replica (a second pod on
        # another node fails to attach), and giving each replica its own would
        # mean turning the server into a StatefulSet, which is a different
        # workload with a different rollout and which no overlay of this base
        # expects. The surrealdb and rabbitmq StatefulSets use PVCs because they
        # are the stores; this is a spill file.
        #
        # What an `emptyDir` survives: a container crash or restart (OOMKill, a
        # failed liveness probe) -- the pod stays on the node and the volume with
        # it, which is the case where the file is most wanted. What it does not:
        # the pod's own deletion (a rollout, a drain, an eviction, a node loss).
        # So replay the file before rolling the Deployment while rows are in it
        # (docs/deployment/README.md, "The audit dead-letter file"), and keep the
        # `axiam.audit.dlq` log events: for the GDPR records they are the second
        # copy, on the log pipeline rather than the pod. A deployment that needs
        # the file to outlive its pod mounts a per-replica volume of its own here
        # (a StatefulSet's volumeClaimTemplates, or a CSI ephemeral volume).
        #
        # `sizeLimit` is not what bounds the file, and must never be reached: the
        # kubelet enforces it by EVICTING the pod, and an evicted pod's `emptyDir`
        # is deleted -- the file with every unreplayed row in it, at the moment it
        # is fullest, and during a datastore outage on every replica at about the
        # same time. What bounds the file is the server's byte budget,
        # AXIAM__GDPR_AUDIT_DLQ_MAX_BYTES in the ConfigMap (192 MiB), which sits
        # below this limit with room to spare: past nine tenths of the budget
        # request-audit rows are refused and counted (`dead_letter_full` on
        # /health/jobs), and the last tenth is kept for the GDPR records. A line
        # is at most about a kilobyte (the request path and the forwarded address
        # are cut to a bound), a few hundred bytes for an honest request. Raise the
        # two together, the budget below the limit.
        - name: audit-dlq
          emptyDir:
            sizeLimit: 256Mi
