apiVersion: v1
kind: Secret
metadata:
  name: axiam-key-material
  namespace: axiam
  labels:
    app: axiam
    component: server
type: Opaque
# T-132: cryptographic material, mounted as FILES rather than injected as
# environment variables.
#
# The distinction is not cosmetic. Environment variables are readable through
# /proc/<pid>/environ by anything sharing the process namespace, are inherited
# by every child process, are captured into crash dumps and many
# error-reporting agents, and show up in `kubectl describe pod` output for
# anything set inline. A mounted file is readable by whatever can open the
# path, which is a smaller and more auditable set — and it is revocable by
# changing the mount rather than by restarting with a different environment.
#
# KEY NAMES ARE THE SERVER'S LOGICAL SECRET NAMES, NOT ENV VAR NAMES. The
# `file` provider resolves a logical name directly to `<dir>/<name>`
# (crates/axiam-auth/src/secrets.rs, FileSecretProvider::path_for), so each key
# below becomes exactly one file under the mount. Renaming a key here silently
# turns the secret into "not configured" — the provider returns Ok(None) for a
# missing file, by design, because most of these are genuinely optional.
#
# The canonical list is `axiam_core::secrets::ALL_KEYS` + `ALL_SECRETS`. Three
# entries here (opaque_session_key, opaque_setup_key, amqp_signing_key) were
# absent from the previous env-var Secret altogether, so those features could
# not have been configured through the shipped manifests at all.
#
# Values are left blank: supply them at deploy time with sealed-secrets, the
# external-secrets operator, or your CI's secret store. Better still, use the
# `vault` provider and remove this Secret entirely — see
# docs/deployment/vault.md.
data:
  # --- 256-bit keys, hex-encoded (32 bytes -> 64 hex chars) ---------------
  # Generate each with: openssl rand -hex 32

  # AES-256-GCM, MFA/TOTP secrets at rest.
  mfa_encryption_key: ""
  # AES-256-GCM, federation client secrets at rest (SECHRD-09).
  federation_encryption_key: ""
  # AES-256-GCM, email/SMTP provider secrets at rest (D-17).
  email_encryption_key: ""
  # AES-256-GCM, CA private keys at rest.
  pki_encryption_key: ""
  # HMAC-SHA256 pepper for GDPR audit actor pseudonymization (D-02).
  gdpr_pseudonym_pepper: ""
  # HMAC-SHA256 key for AMQP message signing. TLS gives confidentiality in
  # transit; this gives end-to-end authenticity and replay protection across
  # broker hops. They are not alternatives.
  amqp_signing_key: ""
  # OPAQUE (RFC 9807). NEVER rotate opaque_setup_key after enrollment: every
  # user's registration record is derived under it, so a new value requires a
  # password reset for every user in every tenant.
  opaque_session_key: ""
  opaque_setup_key: ""

  # --- Free-form secrets --------------------------------------------------

  # Ed25519 JWT signing keypair, PEM. Generate with: just gen-jwt-keys
  jwt_private_key_pem: ""
  jwt_public_key_pem: ""
  # REQUIRED — the server fails closed at startup if this is empty. Two
  # consumers: password hashing (prepended before Argon2id, REQ-14 AC-1) and
  # client-secret hashing, which is a keyed HMAC-SHA256 tag with NO unkeyed
  # fallback (OBS-1) — that second one is what makes it mandatory.
  #
  # Generate with: openssl rand -base64 32
  #
  # WARNING: rotating this is a full credential re-issue. v2 client-secret
  # hashes are keyed by it and are not portable across peppers, and existing
  # passwords stop verifying. Re-issue every OAuth2 client secret and
  # service-account secret before changing it.
  auth_pepper: ""
