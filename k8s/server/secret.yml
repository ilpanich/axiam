apiVersion: v1
kind: Secret
metadata:
  name: axiam-secrets
  namespace: axiam
  labels:
    app: axiam
    component: server
type: Opaque
# T-132: what remains here is ONLY the credentials that are still read through
# the layered configuration (`config::Environment::with_prefix("AXIAM")`)
# rather than through the pluggable secret provider.
#
# Everything cryptographic has moved to `axiam-key-material`, mounted as files
# — see that manifest for why. These three cannot follow yet: the datastore
# credentials are consumed by `AppConfig.db` before any secret provider exists,
# and the Vault token is by definition the one secret that must exist outside
# Vault to bootstrap the trust chain. Moving the datastore pair would mean
# teaching the config layer a `_FILE` convention, which is worth doing and is
# not done here.
#
# Values are left blank: supply them at deploy time (sealed-secrets, the
# external-secrets operator, or your CI's secret store).
data:
  # All keys use a DOUBLE underscore after AXIAM (AXIAM__) — SEC-052. With
  # `config-rs` the same `__` is both the prefix separator and the nested-key
  # separator, so a single underscore here is not a typo that fails loudly, it
  # is a variable that is silently ignored while the in-code default wins.
  AXIAM__DB__USERNAME: ""
  AXIAM__DB__PASSWORD: ""

  # T-131: the full AMQP URI, credentials included. `AmqpConfig` has only a
  # `url` field, so there is nowhere else for the broker password to go — which
  # is exactly why this cannot live in the ConfigMap.
  #
  # Form (note the trailing vhost, matching RABBITMQ_DEFAULT_VHOST in
  # k8s/rabbitmq/statefulset.yml):
  #
  #     amqps://<user>:<password>@rabbitmq:5671/axiam
  #
  # The scheme must be `amqps://`; `validate_transport_security` refuses every
  # other scheme in every build profile, so there is no plaintext fallback to
  # accidentally end up on. A password containing URI-reserved characters must
  # be percent-encoded. Omitting the `/axiam` suffix connects to the default
  # vhost `/`, where this user has no permissions.
  AXIAM__AMQP__URL: ""

  # The Vault token AXIAM authenticates with, needed ONLY when
  # AXIAM__AUTH__SECRET_PROVIDER=vault. The shipped deployment uses the `file`
  # provider, so leave this blank unless you switch.
  #
  # If you do switch: keep its blast radius small. Scope it with a policy
  # granting `read` on exactly `secret/data/axiam` and nothing else (see
  # docs/deployment/vault.md), so a leak exposes AXIAM's secrets and not the
  # rest of your Vault.
  #
  # Better still, do not use a static token at all. With the Kubernetes auth
  # method this field disappears entirely and the pod authenticates with its
  # ServiceAccount token, which Kubernetes rotates for you. That is the
  # recommended production setup, and the reason this is documented rather
  # than simply required.
  AXIAM__AUTH__VAULT_TOKEN: ""
