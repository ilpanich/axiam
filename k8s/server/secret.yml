apiVersion: v1
kind: Secret
metadata:
  name: axiam-secrets
  namespace: axiam
  labels:
    app: axiam
    component: server
type: Opaque
data:
  # Intentionally left blank — provide real values at deploy time
  # (e.g., via CI/CD secrets, sealed-secrets, or external-secrets operator).
  # All keys use DOUBLE underscore after AXIAM (AXIAM__) — SEC-052.
  AXIAM__DB__USERNAME: ""
  AXIAM__DB__PASSWORD: ""
  # JWT Ed25519 signing keys — base64-encoded PEM.
  # Generate with: just gen-jwt-keys
  AXIAM__AUTH__JWT_PRIVATE_KEY_PEM: ""
  AXIAM__AUTH__JWT_PUBLIC_KEY_PEM: ""
  # AES-256-GCM encryption keys — 32 bytes, hex-encoded.
  # Generate with: openssl rand -hex 32
  AXIAM__AUTH__MFA_ENCRYPTION_KEY: ""
  AXIAM__PKI__ENCRYPTION_KEY: ""
  # AES-256-GCM key (32 bytes, hex-encoded) for federation client-secret
  # encryption at rest (SECHRD-09). Generate with: openssl rand -hex 32
  AXIAM__AUTH__FEDERATION_ENCRYPTION_KEY: ""
  # AES-256-GCM key (32 bytes, hex-encoded) for email/SMTP provider secret
  # encryption at rest (D-17). Generate with: openssl rand -hex 32
  AXIAM__EMAIL_ENCRYPTION_KEY: ""
  # HMAC-SHA256 pepper (32 bytes, hex-encoded) for GDPR audit actor
  # pseudonymization (D-02). Generate with: openssl rand -hex 32
  AXIAM__GDPR_PSEUDONYM_PEPPER: ""
  # Auth pepper. REQUIRED — the server FAILS CLOSED AT STARTUP if this is empty.
  # Two consumers:
  #   * password hashing, prepended before Argon2id (REQ-14 AC-1); and
  #   * client-secret hashing, which is a keyed HMAC-SHA256 tag with NO unkeyed
  #     fallback (OBS-1), which is what makes this mandatory rather than optional.
  # Generate a long random string, e.g.: openssl rand -base64 32
  # WARNING: do not rotate this after deployment without re-issuing every OAuth2
  # client secret and service-account secret — v2 client-secret hashes are keyed
  # by this value and are not portable across peppers. Password hashes carry
  # their own salt and are unaffected by the pepper changing only in the sense
  # that existing passwords will no longer verify either; treat a rotation as a
  # full credential re-issue.
  AXIAM__AUTH__PEPPER: ""
  # The Vault token AXIAM authenticates with. This is the ONLY secret that has
  # to exist outside Vault, and that is unavoidable: something must bootstrap
  # the trust chain.
  #
  # Keep its blast radius small. It should be scoped by a policy granting
  # `read` on exactly `secret/data/axiam` and nothing else — see
  # docs/deployment/vault.md — so a leak exposes AXIAM's own secrets and not
  # the rest of your Vault.
  #
  # Better still, do not use a static token at all: with the Kubernetes auth
  # method, this Secret disappears entirely and the pod authenticates with its
  # ServiceAccount token, which Kubernetes rotates for you. The runbook covers
  # that migration; it is the recommended production setup and the reason this
  # field is documented rather than simply required.
  AXIAM__AUTH__VAULT_TOKEN: ""
