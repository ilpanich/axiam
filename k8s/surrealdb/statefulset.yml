apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surrealdb
  namespace: axiam
  labels:
    app: axiam
    component: surrealdb
spec:
  serviceName: surrealdb
  replicas: 1
  selector:
    matchLabels:
      app: axiam
      component: surrealdb
  template:
    metadata:
      labels:
        app: axiam
        component: surrealdb
    spec:
      # Pod-level restricted security context (KSV-0118). Mirrors the container
      # context below; fsGroup makes the /data PVC writable under the non-root UID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:v3
          command: ["surreal"]
          args:
            - "start"
            - "--user"
            - "$(SURREALDB_USER)"
            - "--pass"
            - "$(SURREALDB_PASS)"
            - "--log"
            - "info"
            # `surrealkv:`, not `file:`. SurrealDB 3 REMOVED the `file://`
            # scheme and bails at startup with "The `file://` scheme is no
            # longer supported" (surrealdb-core `kvs/ds.rs`), so this
            # StatefulSet could not start at all while it said `file:`.
            #
            # The engine is also not a free choice. Measured on 3.2.3 with
            # `tools/surreal-race-probe`, `kv-mem` admits two winners to a
            # guarded single-use UPDATE in ~1% of contended rounds;
            # `surrealkv` and `rocksdb` admit none. AXIAM's single-use
            # credentials (permission tickets, device codes, PAR request_uris)
            # depend on that guarantee, so `memory` must never be configured
            # here. This matches `docker/docker-compose.prod.yml`.
            - "surrealkv:/data/surreal.db"
          env:
            - name: SURREALDB_USER
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: username
            - name: SURREALDB_PASS
              valueFrom:
                secretKeyRef:
                  name: surrealdb-credentials
                  key: password
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # D-13 best-effort: surrealdb v3 nonroot UID (adjust if image uses different UID)
            readOnlyRootFilesystem: true      # KSV-0014: immutable root fs; persistent data lives on the PVC, scratch on emptyDir /tmp
            allowPrivilegeEscalation: false   # D-13: restricted profile
            capabilities:
              drop:
                - ALL                 # D-13: restricted profile
            seccompProfile:
              type: RuntimeDefault    # D-13: restricted profile
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - name: surrealdb-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["/surreal", "isready"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/surreal", "isready"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        # Writable scratch space required because the root filesystem is
        # read-only (KSV-0014). Persistent DB state lives on the PVC at /data.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: surrealdb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
