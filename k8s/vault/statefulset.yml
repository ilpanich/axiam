# Single-node Vault with Raft (integrated) storage.
#
# A StatefulSet rather than a Deployment because Vault owns durable state: the
# encrypted secret store. A Deployment's rolling update could run two pods
# against the same PVC, which no storage backend tolerates.
#
# Raft rather than the `file` backend, which this used to run: `file` is a
# single-node development backend with no consistent backup — `vault operator
# raft snapshot save` takes one while Vault is running, whereas backing up
# `file` means copying a directory underneath a live process and hoping. Raft
# is also the only path to more than one replica later, and growing this to
# three nodes is `retry_join` plus a restart rather than a re-seed. A re-seed
# would change the OPAQUE setup key, which means a password reset for every
# user in every tenant.
#
# MIGRATION: this changes the storage backend and the mount path
# (/vault/file -> /vault/data). An existing single-node Vault deployed from the
# previous revision of this file must be migrated with `vault operator migrate`
# (docs/deployment/vault.md §5) — its PVC is not readable by Raft as-is. Most
# teams should run HashiCorp's Helm chart with Raft and 3-5 replicas instead of
# this manifest at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: axiam
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: axiam
data:
  vault.hcl: |
    ui = false

    # K8S-F2: mlock off, which is what lets this pod admit under Pod Security
    # Admission `restricted` (k8s/namespace.yml).
    #
    # Locking memory needs the IPC_LOCK capability, and `restricted` permits
    # adding exactly one capability — NET_BIND_SERVICE. A pod asking for
    # IPC_LOCK is rejected at admission with
    # `violates PodSecurity "restricted": non-default capabilities`, so the
    # choice is not "mlock or no mlock", it is "mlock or no Vault".
    #
    # HashiCorp recommends `disable_mlock = true` for integrated (Raft) storage
    # specifically, and the reason applies exactly here: Raft's BoltDB file is
    # mmap'd, so its pages are already on disk and locking the process's memory
    # protects a copy of data that is durably written anyway. What mlock buys on
    # a `file`- or Consul-backed Vault, it does not buy on this one.
    #
    # What you lose is the guarantee that decrypted secrets are never swapped
    # out. Close that at the node instead, which is where it belongs on
    # Kubernetes: the kubelet refuses to start with swap enabled unless it is
    # explicitly told otherwise, so a conforming node has no swap to leak to.
    # Do not re-enable this without also re-checking that.
    disable_mlock = true

    storage "raft" {
      path    = "/vault/data"
      # Stable across restarts because the StatefulSet gives the pod a stable
      # name; a node_id that changed on every restart would make the node fail
      # to rejoin its own single-node cluster.
      node_id = "vault-0"
    }

    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
      # TLS is not optional here. The token AXIAM presents on every fetch is a
      # bearer credential for the OPAQUE setup key; over plaintext, anything on
      # the pod network can take it.
      tls_min_version = "tls13"
    }

    api_addr     = "https://vault.axiam.svc.cluster.local:8200"
    cluster_addr = "https://vault.axiam.svc.cluster.local:8201"

    # Auto-unseal. UNCOMMENT AND CONFIGURE ONE OF THESE FOR PRODUCTION.
    #
    # Without it, every Vault restart — a node drain, an upgrade, an OOM —
    # leaves Vault sealed and AXIAM unable to start, until a human runs
    # `vault operator unseal` three times with keys held by three people. That
    # is a real outage waiting for a 3am page, and it is the single most
    # important thing to fix before calling this production.
    #
    # seal "awskms" {
    #   region     = "eu-west-1"
    #   kms_key_id = "arn:aws:kms:eu-west-1:...:key/..."
    # }
    #
    # seal "gcpckms" {
    #   project    = "my-project"
    #   region     = "europe-west1"
    #   key_ring   = "vault"
    #   crypto_key = "vault-unseal"
    # }
    #
    # seal "transit" {
    #   address    = "https://vault-central.example:8200"
    #   key_name   = "autounseal"
    #   mount_path = "transit/"
    # }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: axiam
  labels:
    app: axiam
    component: vault
spec:
  # ClusterIP: Vault is reached by AXIAM inside the cluster and by an operator
  # through `kubectl port-forward`. It is never published.
  type: ClusterIP
  # K8S-F11: `app: axiam` AND `component: vault`, the same two-label shape every
  # other component here uses — not the bare `app: vault` this carried.
  #
  # `k8s/kustomization.yml` applies `commonLabels: {app: axiam}`, and kustomize
  # rewrites Service selectors and workload `spec.selector` along with the
  # labels. A selector of `app: vault` therefore did not survive the render: it
  # became `app: axiam`, which matches EVERY pod in the namespace. This Service
  # was load-balancing `https://vault.axiam.svc.cluster.local:8200` across the
  # server, the frontend, SurrealDB and RabbitMQ, so the first secret fetch hit
  # whichever one round-robin picked. Two labels are immune: kustomize
  # overwrites `app` with the value it already has and leaves `component` alone.
  selector:
    app: axiam
    component: vault
  ports:
    - name: https
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: axiam
  labels:
    app: axiam
    component: vault
spec:
  serviceName: vault
  replicas: 1
  # K8S-F11: see the Service above. `commonLabels` collapsed this selector to
  # `app: axiam` too, which made the StatefulSet's selector overlap every other
  # workload in the namespace — an overlap the API server does not reject and
  # the controller is not defined over.
  #
  # UPGRADING AN EXISTING DEPLOYMENT: `spec.selector` is immutable, so
  # `kubectl apply` against a StatefulSet created from the previous revision
  # fails with `Forbidden: updates to statefulset spec for fields other than
  # 'replicas', 'ordinals', ... are forbidden`. Recreate it without touching
  # the data:
  #
  #     kubectl -n axiam delete statefulset vault --cascade=orphan
  #     kubectl apply -k k8s/
  #
  # The PVC and the running pod both survive `--cascade=orphan`; the new
  # StatefulSet adopts the pod once its labels match.
  selector:
    matchLabels:
      app: axiam
      component: vault
  template:
    metadata:
      labels:
        app: axiam
        component: vault
    spec:
      serviceAccountName: vault
      # Pod-level restricted security context (KSV-0118), mirroring the
      # container context below. `runAsUser: 100` / `fsGroup: 1000` are the
      # `vault` user and group in hashicorp/vault; fsGroup is what makes the
      # Raft PVC at /vault/data writable under that non-root UID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        # K8S-F2: named rather than inherited. Without it the container runs
        # with the image's GID, which is 0 in hashicorp/vault — a root group on
        # a pod whose whole point is custody of the OPAQUE setup key.
        runAsGroup: 1000
        fsGroup: 1000
        # K8S-F2: `restricted` REQUIRES a seccomp profile of `RuntimeDefault`
        # or `Localhost`, at pod or container scope. This manifest set neither,
        # so it was rejected at admission with
        # `violates PodSecurity "restricted": seccompProfile`. Every other
        # workload in this tree already sets it; Vault was the one that did not.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:1.20
          args: ["server", "-config=/vault/config/vault.hcl"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              # K8S-F2: drop ALL, add NOTHING. This used to add IPC_LOCK so
              # Vault could lock its memory; `restricted` permits adding only
              # NET_BIND_SERVICE, so that add was an admission rejection rather
              # than a hardening measure. `disable_mlock = true` in the config
              # above is the other half of this change — see the reasoning there.
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: VAULT_ADDR
              value: "https://127.0.0.1:8200"
            - name: VAULT_API_ADDR
              value: "https://vault.axiam.svc.cluster.local:8200"
            - name: SKIP_CHOWN
              value: "true"
          ports:
            - name: https
              containerPort: 8200
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: tls
              mountPath: /vault/tls
              readOnly: true
            - name: data
              mountPath: /vault/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          # No liveness probe on /sys/health, deliberately: a *sealed* Vault
          # answers 503, and restarting it would not unseal it — it would just
          # loop. Sealed is a condition for a human (or auto-unseal) to fix, not
          # something a restart improves.
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: tls
          secret:
            secretName: vault-tls
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Secrets are tiny; this is almost entirely headroom for Vault's
            # own bookkeeping and audit device if one is enabled.
            storage: 1Gi
